<script>
function T(key, vars) { return window.GIQ ? window.GIQ.t(key, vars) : key; }
function isHi() { return !!(window.GIQ && window.GIQ.lang === "hi"); }
function loc() { return window.GIQ ? window.GIQ.locale() : "en-IN"; }
function timeOpts() { return isHi() ? { hour: "2-digit", minute: "2-digit", hourCycle: "h23" } : { hour: "numeric", minute: "2-digit" }; }
function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;"); }
function toDate(s) { if (!s) return null; return s.indexOf("T") !== -1 ? new Date(s) : new Date(s.replace(" ", "T") + "Z"); }
function dateTime(s) { const d = toDate(s); if (!d || isNaN(d)) return ""; return d.toLocaleDateString(loc(), { day: "numeric", month: "short", year: "numeric" }) + ", " + d.toLocaleTimeString(loc(), timeOpts()); }
function day(s) { if (!s) return "—"; return new Date(s + "T00:00:00+05:30").toLocaleDateString(loc(), { day: "numeric", month: "short", year: "numeric", timeZone: "Asia/Kolkata" }); }
function roleLabel(role) { if (!role) return ""; const k = "adm.role_" + role; const v = T(k); return v === k ? role : v; }
function todayIst() { return new Date(Date.now() + 5.5 * 3600000).toISOString().slice(0, 10); }
function addDays(d, n) { return new Date(Date.parse(d + "T00:00:00Z") + n * 86400000).toISOString().slice(0, 10); }
function notice(kind, text) { document.getElementById("notice-area").innerHTML = text ? '<div class="notice ' + kind + '" role="' + (kind === "err" ? "alert" : "status") + '" tabindex="-1" id="notice-msg">' + esc(text) + '</div>' : ""; }
function focusNotice() { const n = document.getElementById("notice-msg"); if (n) n.focus(); }
async function api(url, opts) {
  const res = await fetch(url, opts);
  const body = await res.json().catch(() => ({}));
  return { ok: res.ok, status: res.status, body };
}

const RATINGS = ["CRITICAL", "HIGH", "MEDIUM", "LOW"];
const STATUSES = ["DRAFT", "ISSUED", "RESPONDED", "DONE_REPORTED", "CLOSED", "RISK_ACCEPTED", "WITHDRAWN"];

let view = { tab: "obs", id: null, isNew: false, prefill: {} };
let reg = null, regFilter = { status: "OPEN", rating: "", overdue: false, owner: "", q: "" };

let log = null, logFilter = { source: "", from: "", to: "", who: "", action: "", case: "", page: 1 }, logErrors = {};

function ratingBadge(r) { return '<span class="rating r-' + esc(String(r || "").toLowerCase()) + '">' + esc(T("adm.au_r_" + r)) + '</span>'; }
function statusBadge(o) { return '<span class="st st-' + esc(String(o.status).toLowerCase()) + '">' + esc(T("adm.au_s_" + o.status)) + '</span>' + (o.overdue ? ' <span class="st st-overdue">' + esc(T("adm.au_overdue")) + '</span>' : ''); }
function aboutText(o) {
  if (o.subjectType === "CASE") return T("adm.au_about_cases", { list: (o.subjectCases || []).join(", ") || "—" });
  if (o.subjectType === "OFFICE") return T("adm.au_about_office", { name: o.subjectOffice || "—" });

}
function staffName(email) {

// ---------- routing (#obs, #obs=<id>, #new&case=..&src=kind:id&label=.., #log) ----------
function parseHash() {
  const h = location.hash.replace(/^#/, "");
  const parts = h.split("&");
  const kv = {};
  parts.slice(1).forEach((p) => { const i = p.indexOf("="); if (i > 0) kv[decodeURIComponent(p.slice(0, i))] = decodeURIComponent(p.slice(i + 1)); });
  const head = parts[0] || "";
  if (head === "log") return { tab: "log" };
  if (head === "new") return { tab: "obs", isNew: true, prefill: kv };
  if (head.indexOf("obs=") === 0) return { tab: "obs", id: decodeURIComponent(head.slice(4)) };
  return { tab: "obs" };
}
async function route() {
  view = parseHash(); act = {}; notice("", "");
  renderTabs();
  if (view.tab === "log") return loadLog();
  if (view.isNew) { if (!reg) await loadReg(true); openForm(null); return; }
  if (view.id) return loadDetail(view.id);
  return loadReg();
}
window.addEventListener("hashchange", route);

function renderTabs() {
  const tabs = [["obs", T("adm.au_tab_obs")]];
  if (me.canSeeLog) tabs.push(["log", T("adm.au_tab_log")]);
  document.getElementById("au-tabs").innerHTML = tabs.map((t) => '<a href="#' + t[0] + '" class="au-tab' + (view.tab === t[0] ? " active" : "") + '"' + (view.tab === t[0] ? ' aria-current="page"' : "") + '>' + esc(t[1]) + '</a>').join("");
}

  const err = '<div class="field-err" id="ac-' + id + '-err" role="alert">' + esc(e[id] || "") + '</div>';
  if (kind === "textarea") return '<label for="ac-' + id + '">' + esc(label) + '</label><textarea id="ac-' + id + '" rows="3" maxlength="4000" aria-describedby="ac-' + id + '-err"' + inv + '>' + esc((act.values || {})[id] || "") + '</textarea>' + err;
  if (kind === "date") return '<label for="ac-' + id + '">' + esc(label) + '</label><input type="date" id="ac-' + id + '" min="' + (extra || todayIst()) + '" value="' + esc((act.values || {})[id] || "") + '" aria-describedby="ac-' + id + '-err"' + inv + '>' + err;
  return '<label for="ac-' + id + '">' + esc(label) + '</label><input type="text" id="ac-' + id + '" value="' + esc((act.values || {})[id] || "") + '" aria-describedby="ac-' + id + '-err"' + inv + '>' + err;
}
function renderActions(o, c) {
  const blocks = [];
  const box = (key, title, inner, btn, cls) => '<form class="panel act" data-act="' + key + '" novalidate><h2>' + esc(title) + '</h2>' + inner +
    '<div class="actions-row"><button type="submit" class="' + (cls || "primary") + '"' + (act.busy === key ? " disabled" : "") + '>' + esc(btn) + '</button></div><div class="dialog-error" role="alert">' + esc(act.key === key && act.errors && act.errors.form || "") + '</div></form>';
  if (c.edit) blocks.push('<div class="panel act-row"><button type="button" id="ac-edit">' + esc(T("adm.au_edit_btn")) + '</button> <button type="button" class="primary" id="ac-issue"' + (act.busy === "issue" ? " disabled" : "") + '>' + esc(T("adm.au_issue_btn")) + '</button>' +
    '<p class="hint">' + esc(T("adm.au_issue_hint")) + '</p><div class="dialog-error" role="alert" id="ac-issue-err">' + esc(act.key === "issue" && act.errors && act.errors.form || "") + '</div></div>');
  if (c.respond) blocks.push(box("respond", T("adm.au_respond_t"), '<p class="section-sub">' + esc(T("adm.au_respond_sub")) + '</p>' +
    '<fieldset aria-describedby="ac-agree-err"><legend>' + esc(T("adm.au_agree_q")) + '</legend><label class="check"><input type="radio" name="ac-agree" value="1"' + ((act.values || {}).agree === "1" ? " checked" : "") + '> ' + esc(T("adm.au_agrees")) + '</label><label class="check"><input type="radio" name="ac-agree" value="0"' + ((act.values || {}).agree === "0" ? " checked" : "") + '> ' + esc(T("adm.au_disagrees")) + '</label></fieldset><div class="field-err" id="ac-agree-err" role="alert">' + esc((act.errors || {}).agree || "") + '</div>' +
    actField("text", T("adm.au_reply"), "textarea") + actField("actionPlan", T("adm.au_plan_label"), "textarea") + actField("targetDate", T("adm.au_target_label"), "date"), T("adm.au_respond_btn")));
  if (c.reportDone) blocks.push(box("report_done", T("adm.au_done_t"), actField("evidence", T("adm.au_evidence_label"), "textarea"), T("adm.au_done_btn")));
  if (c.close) blocks.push(box("close", T("adm.au_close_t"), '<p class="section-sub">' + esc(T("adm.au_close_sub")) + '</p>' + actField("note", T("adm.au_close_note"), "textarea"), T("adm.au_close_btn")));
  if (c.sendBack) blocks.push(box("send_back", T("adm.au_sendback_t"), actField("note2", T("adm.au_sendback_note"), "textarea"), T("adm.au_sendback_btn"), "normal"));
  if (c.amend) blocks.push(box("amend", T("adm.au_amend_t"), '<p class="section-sub">' + esc(T("adm.au_amend_sub")) + '</p>' +
    '<label for="ac-field">' + esc(T("adm.au_amend_field")) + '</label><select id="ac-field">' + ["title", "criteria", "condition", "cause", "effect", "recommendation", "rating", "due_date"].map((k) => '<option value="' + k + '"' + ((act.values || {}).field === k ? " selected" : "") + '>' + esc(fieldName(k)) + '</option>').join("") + '</select>' +
    '<div id="ac-value-wrap">' + amendValueInput(o) + '</div>' + actField("reason", T("adm.au_amend_reason"), "text"), T("adm.au_amend_btn"), "normal"));
  if (c.acceptRisk) blocks.push(box("accept_risk", T("adm.au_risk_form_t"), '<p class="section-sub">' + esc(T("adm.au_risk_sub")) + '</p>' + actField("riskReason", T("adm.au_risk_reason"), "textarea") + actField("reviewDate", T("adm.au_review_date"), "date", addDays(todayIst(), 1)), T("adm.au_risk_btn"), "normal"));
  if (c.withdraw) blocks.push(box("withdraw", T("adm.au_withdraw_t"), actField("wreason", T("adm.au_withdraw_reason"), "text"), T("adm.au_withdraw_btn"), "normal"));
  if (c.comment) blocks.push(box("comment", T("adm.au_comment_t"), actField("comment", T("adm.au_comment_label"), "textarea"), T("adm.au_comment_btn"), "normal"));
  return blocks.join("");
}
function amendValueInput(o) {
  const f = (act.values || {}).field || "title";
  const e = act.errors || {};
  const inv = e.value ? ' aria-invalid="true"' : '';
  const err = '<div class="field-err" id="ac-value-err" role="alert">' + esc(e.value || "") + '</div>';
  const v = (act.values || {}).value != null ? act.values.value : (f === "due_date" ? o.dueDate : f === "rating" ? o.rating : o[f]) || "";
  const label = '<label for="ac-value">' + esc(T("adm.au_amend_value")) + '</label>';
  if (f === "rating") return label + '<select id="ac-value" aria-describedby="ac-value-err"' + inv + '>' + RATINGS.map((r) => '<option value="' + r + '"' + (v === r ? " selected" : "") + '>' + esc(T("adm.au_r_" + r)) + '</option>').join("") + '</select>' + err;
  if (f === "due_date") return label + '<input type="date" id="ac-value" min="' + todayIst() + '" value="' + esc(v) + '" aria-describedby="ac-value-err"' + inv + '>' + err;
  if (f === "title") return label + '<input type="text" id="ac-value" maxlength="160" value="' + esc(v) + '" aria-describedby="ac-value-err"' + inv + '>' + err;
  return label + '<textarea id="ac-value" rows="3" maxlength="4000" aria-describedby="ac-value-err"' + inv + '>' + esc(v) + '</textarea>' + err;
}
function attachActions(o) {
  const ed = document.getElementById("ac-edit");
  if (ed) ed.addEventListener("click", () => openForm(o));
  const is = document.getElementById("ac-issue");
  if (is) is.addEventListener("click", () => send("issue", {}, "issue"));
  const fsel = document.getElementById("ac-field");
  if (fsel) fsel.addEventListener("change", () => { act.values = Object.assign({}, act.values, { field: fsel.value, value: null }); document.getElementById("ac-value-wrap").innerHTML = amendValueInput(o); });
  document.querySelectorAll("form.act").forEach((fm) => fm.addEventListener("submit", (ev) => {
    ev.preventDefault();
    const key = fm.getAttribute("data-act");
    const g = (id) => { const el = document.getElementById("ac-" + id); return el ? el.value : ""; };
    const agree = document.querySelector('input[name="ac-agree"]:checked');
    const P = {
      respond: { agree: agree ? agree.value === "1" : null, text: g("text"), actionPlan: g("actionPlan"), targetDate: g("targetDate") },
      report_done: { evidence: g("evidence") },
      close: { note: g("note") },
      send_back: { note: g("note2") },
      amend: { field: g("field"), value: g("value"), reason: g("reason") },
      accept_risk: { reason: g("riskReason"), reviewDate: g("reviewDate") },
      withdraw: { reason: g("wreason") },
      comment: { text: g("comment") },
    }[key];
    act.values = { agree: agree ? agree.value : "", text: g("text"), actionPlan: g("actionPlan"), targetDate: g("targetDate"), evidence: g("evidence"), note: g("note"), note2: g("note2"),
      field: g("field"), value: g("value"), reason: g("reason"), riskReason: g("riskReason"), reviewDate: g("reviewDate"), wreason: g("wreason"), comment: g("comment") };
    send(key, P, key);
  }));
}
// Server field names -> the ids of the inputs for each action.
const FIELD_IDS = { send_back: { note: "note2" }, accept_risk: { reason: "riskReason" }, withdraw: { reason: "wreason" }, comment: { text: "comment" } };
async function send(action, payload, key) {
  act.busy = key; act.key = key; act.errors = {};
  renderDetail();
  const r = await api("/api/admin/observations", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(Object.assign({ action, id: detail.observation.id }, payload)) });
  act.busy = null;
  if (!r.ok) {
    const e = mapErrors(r.body), m = FIELD_IDS[action] || {};
    act.errors = {};
    Object.keys(e).forEach((k) => { act.errors[m[k] || k] = e[k]; });
    if (action === "issue" && r.body && r.body.fields) act.errors.form = T("adm.au_e_issue", { list: Object.keys(r.body.fields).map((k) => T("adm.au_fl_" + ({ dueDate: "due", dueReason: "due_reason", ownerEmail: "owner", subjectType: "about", subjectCases: "cases", subjectOffice: "office", subjectProcess: "process" }[k] || k))).join(", ") });
    renderDetail(); focusFirstError();
    if (action === "issue") { const x = document.getElementById("ac-issue-err"); if (x) x.focus(); }
    return;
  }
  act = {};
  await loadDetail(detail.observation.id);
  notice("ok", T("adm.au_done_" + action)); focusNotice();
}

// ---------- audit log ----------
const ACT_HI = {};   // action labels come from adm.al_a_<code> when present
function actionLabel(code) { const k = "adm.al_a_" + String(code).toLowerCase(); const v = T(k); if (v !== k) return v; const s = String(code).replace(/_/g, " ").toLowerCase(); return s.charAt(0).toUpperCase() + s.slice(1); }
function detailText(r) {
  const d = r.detail;
  if (!d || typeof d !== "object") return d ? String(d) : "";
  return Object.keys(d).filter((k) => k !== "trackingRef" && k !== "role" && d[k] != null && d[k] !== "").slice(0, 6).map((k) => k + ": " + (typeof d[k] === "object" ? JSON.stringify(d[k]) : d[k])).join(" · ");
}
function logQuery(extra) {
  const f = logFilter;
  return ["source", "from", "to", "who", "action", "case"].map((k) => k + "=" + encodeURIComponent(f[k] || "")).join("&") + "&page=" + f.page + (extra || "");
}
async function loadLog() {
  if (!reg) { try { await loadReg(true); } catch (e) { /* ignore */ } }
  if (!me.canSeeLog) { document.getElementById("content").innerHTML = '<div class="notice err" role="alert">' + esc(T("adm.au_err_role")) + '</div>'; return; }
  document.getElementById("content").innerHTML = renderLogFilters() + '<p class="empty">' + esc(T("adm.loading")) + '</p>';
  attachLogFilters();
  const r = await api("/api/admin/audit-log?" + logQuery());
  if (!r.ok) {
    if (r.body && r.body.fields) { logErrors = {}; const M = { DATE: "adm.au_e_date", BEFORE_FROM: "adm.au_e_before" }; Object.keys(r.body.fields).forEach((k) => { logErrors[k] = T(M[r.body.fields[k]] || "adm.au_e_date"); }); log = null; renderLog(); focusFirstError(); return; }
    return showError(r);
  }
  log = r.body; logErrors = {}; renderLog();
}
function renderLogFilters() {
  const f = logFilter, e = logErrors;
  const fe = (k) => '<div class="field-err" id="lf-' + k + '-err" role="alert">' + esc(e[k] || "") + '</div>';
  return '<div class="panel"><p class="section-sub">' + esc(T("adm.al_sub")) + '</p><form class="filters" id="log-filters" novalidate>' +
    '<div><label for="lf-source">' + esc(T("adm.al_f_source")) + '</label><select id="lf-source"><option value="">' + esc(T("adm.au_all")) + '</option>' + ["staff", "signin", "team"].map((s) => '<option value="' + s + '"' + (f.source === s ? " selected" : "") + '>' + esc(T("adm.al_src_" + s)) + '</option>').join("") + '</select></div>' +
    '<div><label for="lf-from">' + esc(T("adm.al_f_from")) + '</label><input type="date" id="lf-from" value="' + esc(f.from) + '" aria-describedby="lf-from-err"' + (e.from ? ' aria-invalid="true"' : '') + '>' + fe("from") + '</div>' +
    '<div><label for="lf-to">' + esc(T("adm.al_f_to")) + '</label><input type="date" id="lf-to" value="' + esc(f.to) + '" aria-describedby="lf-to-err"' + (e.to ? ' aria-invalid="true"' : '') + '>' + fe("to") + '</div>' +
    '<div><label for="lf-who">' + esc(T("adm.al_f_who")) + '</label><input type="search" id="lf-who" value="' + esc(f.who) + '"></div>' +
    '<div><label for="lf-action">' + esc(T("adm.al_f_action")) + '</label><input type="search" id="lf-action" value="' + esc(f.action) + '"></div>' +
    '<div><label for="lf-case">' + esc(T("adm.al_f_case")) + '</label><input type="search" id="lf-case" value="' + esc(f.case) + '" placeholder="GRV-…"></div>' +
    '<div><button type="submit">' + esc(T("adm.au_apply")) + '</button></div></form><div id="log-body"></div></div>';
}
function attachLogFilters() {
  document.getElementById("log-filters").addEventListener("submit", (ev) => {
    ev.preventDefault();
    logFilter = { source: val("lf-source"), from: val("lf-from"), to: val("lf-to"), who: val("lf-who").trim(), action: val("lf-action").trim(), case: val("lf-case").trim(), page: 1 };
    logErrors = {};
    if (logFilter.from && logFilter.to && logFilter.from > logFilter.to) { logErrors.to = T("adm.au_e_before"); renderLog(); focusFirstError(); return; }
    loadLog();
  });
}
function renderLog() {
  document.getElementById("content").innerHTML = renderLogFilters();
  attachLogFilters();
  const body = document.getElementById("log-body");
  if (!log) { body.innerHTML = ""; return; }
  let html = '<div class="result-bar"><span>' + esc(T("adm.al_n", { n: log.total })) + '</span><a class="btn-link" href="/api/admin/audit-log?' + esc(logQuery("&format=csv")) + '" download>' + esc(T("adm.au_csv")) + '</a></div>';
  if (!log.rows.length) html += '<p class="empty">' + esc(T("adm.al_none")) + '</p>';
  else html += '<div class="table-wrap"><table><thead><tr><th scope="col">' + esc(T("adm.al_c_when")) + '</th><th scope="col">' + esc(T("adm.al_c_log")) + '</th><th scope="col">' + esc(T("adm.al_c_who")) + '</th><th scope="col">' + esc(T("adm.al_c_action")) + '</th><th scope="col">' + esc(T("adm.al_c_case")) + '</th><th scope="col">' + esc(T("adm.al_c_details")) + '</th>' + (log.canObserve ? '<th scope="col"><span class="sr-only">' + esc(T("adm.al_raise")) + '</span></th>' : '') + '</tr></thead><tbody>' +
    log.rows.map((r) => '<tr><td>' + esc(dateTime(r.at)) + '</td><td>' + esc(T("adm.al_src_" + r.source)) + '</td><td>' + esc(r.actor || "") + (r.role ? '<div class="ward-sub">' + esc(roleLabel(r.role) === r.role ? r.role.replace(/_/g, " ").toLowerCase() : roleLabel(r.role)) + '</div>' : '') + '</td><td>' + esc(actionLabel(r.action)) + '</td><td>' + esc(r.caseRef || "") + '</td><td class="ward-sub">' + esc(detailText(r)) + '</td>' +
      (log.canObserve ? '<td><a class="small-link" href="#new&src=' + esc(encodeURIComponent("log:" + r.id)) + '&label=' + esc(encodeURIComponent(actionLabel(r.action) + " · " + (r.actor || "") + " · " + dateTime(r.at))) + (r.caseRef ? '&case=' + esc(encodeURIComponent(r.caseRef)) : '') + '">' + esc(T("adm.al_raise")) + '</a></td>' : '') + '</tr>').join("") + '</tbody></table></div>';
  if (log.pages > 1) html += '<div class="actions-row"><button type="button" id="lg-prev"' + (log.page <= 1 ? " disabled" : "") + '>' + esc(T("adm.al_prev")) + '</button><span>' + esc(T("adm.al_page", { p: log.page, n: log.pages })) + '</span><button type="button" id="lg-next"' + (log.page >= log.pages ? " disabled" : "") + '>' + esc(T("adm.al_next")) + '</button></div>';
  body.innerHTML = html;
  const pv = document.getElementById("lg-prev"), nx = document.getElementById("lg-next");
  if (pv) pv.addEventListener("click", () => { logFilter.page--; loadLog(); });
  if (nx) nx.addEventListener("click", () => { logFilter.page++; loadLog(); });
}

// ---------- theme / language ----------
function applyTheme(theme) {
  document.documentElement.classList.toggle("light-theme", theme === "light");
  document.getElementById("theme-toggle").textContent = theme === "light" ? T("adm.theme_dark") : T("adm.theme_light");
}
let theme = "dark";
try { theme = localStorage.getItem("griq-admin-theme") === "light" ? "light" : "dark"; } catch (e) { /* ignore */ }
applyTheme(theme);
document.getElementById("theme-toggle").addEventListener("click", () => {
  theme = theme === "light" ? "dark" : "light";
  try { localStorage.setItem("griq-admin-theme", theme); } catch (e) { /* ignore */ }
  applyTheme(theme);
});
document.addEventListener("giq:lang", () => {
  applyTheme(theme); renderTabs();
  if (view.tab === "log") { if (log) renderLog(); }
  else if (form && document.getElementById("obs-form")) renderForm();
  else if (view.id && detail) renderDetail();
  else if (reg) renderReg();
});
route();
</script>
