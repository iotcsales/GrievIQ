<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GrievIQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<style>
  :root {
    --ink: #14181D;
    --paper: #ECEEF1;
    --card: #FFFFFF;
    --line: #D7DBE0;
    --steel: #3A4552;
    --steel-2: #59657A;
    --red: #C23B2C;
    --red-tint: #F7E4E0;
    --green: #2F6B4F;
    --green-tint: #E4EFE8;
    --gold: #A9822E;
    --gold-tint: #F5EDDD;
    --brand: #1B5FA8;
    --brand-tint: #E8F0FA;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Public Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .console-header {
    background: var(--card);
    border-bottom: 1px solid var(--line);
    padding: 16px 24px;
  }
  .console-header-inner {
    max-width: 760px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  .console-header-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .console-icon {
    width: 32px;
    height: 32px;
    border-radius: 6px;
    background: var(--brand);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .console-title {
    font-family: 'Source Serif 4', serif;
    font-weight: 600;
    font-size: 16px;
    margin: 0;
    color: var(--ink);
  }
  .console-subtitle {
    font-size: 12.5px;
    color: var(--steel-2);
    margin: 2px 0 0;
  }
  .console-header-right {
    text-align: right;
  }
  .console-ward {
    font-weight: 700;
    font-size: 14px;
    margin: 0;
    color: var(--ink);
  }
  .console-role {
    font-size: 12.5px;
    color: var(--steel-2);
    margin: 2px 0 0;
  }
  .tab-bar {
    max-width: 760px;
    margin: 0 auto;
    padding: 0 24px;
    display: flex;
    gap: 4px;
    border-bottom: 1px solid var(--line);
    background: var(--card);
  }
  .tab-btn {
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    color: var(--steel-2);
    background: none;
    border: none;
    border-bottom: 2.5px solid transparent;
    padding: 12px 6px;
    margin-bottom: -1px;
    cursor: pointer;
  }
  .tab-btn:hover { color: var(--ink); }
  .tab-btn.active {
    color: var(--brand);
    border-bottom-color: var(--brand);
  }
  .mandate-strip {
    max-width: 760px;
    margin: 0 auto;
    padding: 12px 24px 0;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }
    .mandate-chip {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 6px 12px;
    font-size: 13px;
    color: var(--steel);
    font-family: inherit;
    cursor: pointer;
  }
  .mandate-chip:hover { border-color: var(--brand); }
  .mandate-chip.active {
    background: var(--brand-tint);
    border-color: var(--brand);
    color: var(--brand);
  }
  .mandate-chip b { color: var(--ink); }
  .mandate-chip.active b { color: var(--brand); }
  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 8px 24px 60px;
  }
  .register-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 10px;
    margin-bottom: 4px;
  }
  .register-title {
    font-family: 'Source Serif 4', serif;
    font-weight: 600;
    font-size: 19px;
    margin: 0;
  }
  .register-count {
    font-size: 13px;
    color: var(--steel-2);
  }
  .case-row {
    display: grid;
    grid-template-columns: 20px 1fr auto;
    gap: 16px;
    align-items: start;
    padding: 18px 0;
    border-bottom: 1px solid var(--line);
  }
  .signal-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    margin-top: 5px;
  }
  .signal-dot.red { background: var(--red); }
  .signal-dot.green { background: none; border: 2px solid var(--green); width: 8px; height: 8px; margin-top: 6px; }
  .signal-dot.gold { background: var(--gold); }
  .case-main .tracking-ref {
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.02em;
  }
  .case-main .category {
    color: var(--steel-2);
    font-size: 13px;
  }
  .case-main .description {
    margin: 6px 0 0;
    font-size: 14px;
    color: var(--steel);
    line-height: 1.5;
    max-width: 46ch;
  }
  .case-main .location-detail {
    margin: 4px 0 0;
    font-size: 12.5px;
    color: var(--steel-2);
    font-style: italic;
    max-width: 46ch;
  }
  .photo-thumbs {
    display: flex;
    gap: 6px;
    margin-top: 10px;
  }
  .photo-thumb {
    width: 52px;
    height: 52px;
    border-radius: 3px;
    overflow: hidden;
    border: 1px solid var(--line);
    display: block;
  }
  .photo-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .case-meta {
    text-align: right;
    min-width: 150px;
  }
  .elapsed {
    font-size: 13px;
    color: var(--steel-2);
    margin-bottom: 8px;
  }
  .elapsed.overdue { color: var(--red); font-weight: 600; }
  .ladder {
    display: flex;
    justify-content: flex-end;
    gap: 5px;
  }
  .ladder-step {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
  }
  .ladder-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--line);
  }
  .ladder-dot.filled { background: var(--red); }
  .ladder-dot.current { background: var(--ink); }
  .ladder-label {
    font-size: 9px;
    color: var(--steel-2);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 3px;
    margin-top: 4px;
  }
  .badge.escalated { background: var(--red-tint); color: var(--red); }
  .badge.resolved { background: var(--green-tint); color: var(--green); font-weight: 700; font-size: 12px; padding: 4px 9px; }
  .badge.pending { background: var(--gold-tint); color: var(--gold); }
  .dispute-note {
    margin: 8px 0 0;
    padding: 8px 10px;
    background: var(--red-tint);
    border-left: 3px solid var(--red);
    font-size: 12.5px;
    color: var(--steel);
    line-height: 1.5;
    max-width: 46ch;
  }
  .dispute-note b { color: var(--red); }
  .resolve-btn {
    margin-top: 10px;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink);
    background: var(--card);
    border: 1.5px solid var(--ink);
    border-radius: 4px;
    padding: 6px 12px;
    cursor: pointer;
  }
  .resolve-btn:hover { background: var(--ink); color: var(--paper); }
  .resolve-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    background: var(--card);
    color: var(--ink);
  }
  .resolve-error {
    margin-top: 6px;
    font-size: 12px;
    color: var(--red);
  }
  .empty-state {
    padding: 60px 0;
    text-align: center;
    color: var(--steel-2);
  }
  .empty-state p { font-size: 14px; margin: 0; }
  .report-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 10px;
    margin-bottom: 20px;
  }
  .report-title {
    font-family: 'Source Serif 4', serif;
    font-weight: 600;
    font-size: 19px;
    margin: 0;
  }
  .report-subtitle {
    font-size: 13px;
    color: var(--steel-2);
    margin: 3px 0 0;
  }
  .export-pdf-btn {
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    color: #fff;
    background: var(--brand);
    border: none;
    border-radius: 4px;
    padding: 8px 14px;
    cursor: pointer;
  }
  .export-pdf-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 28px;
  }
  .stat-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 14px 16px;
  }
  .stat-number {
    font-family: 'Source Serif 4', serif;
    font-weight: 700;
    font-size: 26px;
    color: var(--ink);
  }
  .stat-label {
    font-size: 12px;
    color: var(--steel-2);
    margin-top: 3px;
  }
  .report-list-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--steel-2);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin: 0 0 8px;
  }
  .report-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 11px 0;
    border-bottom: 1px solid var(--line);
    font-size: 13.5px;
  }
  .report-row .report-ref {
    font-weight: 600;
    margin-right: 8px;
  }
  .report-row .report-cat {
    color: var(--steel-2);
  }
  .followup-count {
    font-size: 12px;
    font-weight: 600;
    padding: 2px 8px;
    border-radius: 3px;
    background: var(--paper);
    color: var(--steel-2);
  }
  .followup-count.has-followups {
    background: var(--green-tint);
    color: var(--green);
  }
  .notice {
    max-width: 520px;
    margin: 80px auto;
    padding: 0 24px;
    text-align: center;
  }
  .notice h1 {
    font-family: 'Source Serif 4', serif;
    font-size: 22px;
  }
  .notice p { color: var(--steel); font-size: 14px; line-height: 1.6; }
</style>
</head>
<body>

<div id="app"></div>

<script>
const TIER_LABELS = { LOCAL: 'Local', MAYOR: 'Mayor', MLA: 'MLA', MP: 'MP' };
const DISPUTE_REASON_LABELS = {
  NOT_FIXED: 'Citizen says: not fixed at all',
  PARTIALLY_FIXED: 'Citizen says: partially fixed',
  CAME_BACK: 'Citizen says: fixed, but came back',
  WRONG_ISSUE: 'Citizen says: wrong issue was fixed',
  OTHER: 'Citizen disputed resolution',
};
const LAYERS_ICON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 3L3 8l9 5 9-5-9-5z" fill="white"/><path d="M3 12.5L12 17.5L21 12.5" stroke="white" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 16.5L12 21.5L21 16.5" stroke="white" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';

var activeTab = 'cases';
var activeMandateId = null;
var currentMe = null;
var currentCases = [];

function formatDate(iso) {
  if (!iso) return '';
  var d = new Date(iso);
  return d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }) +
    ', ' + d.toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit' });
}

function timeAgo(days) {
  if (days < 1) return 'Filed today';
  if (days === 1) return 'Filed 1 day ago';
  return 'Filed ' + Math.floor(days) + ' days ago';
}

function renderLadder(chainTierList, currentTierIndex, viewingAsTier) {
  return '<div class="ladder">' + chainTierList.map(function(tier, i) {
    var filled = i <= currentTierIndex;
    var isCurrent = tier === viewingAsTier;
    var dotClass = 'ladder-dot' + (filled ? ' filled' : '') + (isCurrent ? ' current' : '');
    return '<div class="ladder-step"><div class="' + dotClass + '"></div>' +
      '<div class="ladder-label">' + TIER_LABELS[tier] + '</div></div>';
  }).join('') + '</div>';
}

function renderPhotoThumbs(photoUrls) {
  if (!photoUrls || photoUrls.length === 0) return '';
  return '<div class="photo-thumbs">' + photoUrls.map(function(url) {
    return '<a class="photo-thumb" href="' + url + '" target="_blank" rel="noopener">' +
      '<img src="' + url + '" alt="Grievance photo" loading="lazy"></a>';
  }).join('') + '</div>';
}

function renderDisputeNote(c) {
  if (!c.citizenDisputeReason) return '';
  var label = DISPUTE_REASON_LABELS[c.citizenDisputeReason] || 'Citizen disputed resolution';
  var note = c.citizenDisputeNote
    ? ' &mdash; "' + c.citizenDisputeNote + '"'
    : '';
  var when = c.citizenDisputeAt ? ' <span style="color:var(--steel-2);font-weight:400;">(' + formatDate(c.citizenDisputeAt) + ')</span>' : '';
  return '<div class="dispute-note"><b>' + label + '</b>' + when + note + '</div>';
}

function renderResolveControl(c) {
  var isFinal = c.status === 'RESOLVED' || c.status === 'CLOSED';
  var isPending = c.status === 'PENDING_CONFIRMATION';
  if (isFinal || isPending) return '';
  return '<button class="resolve-btn" data-id="' + c.id + '">Mark resolved</button>' +
    '<div class="resolve-error" id="resolve-error-' + c.id + '"></div>';
}
function renderFollowupControl(c) {
  var deptLine = c.currentDepartment
    ? '<p class="location-detail">Forwarded to: <b>' + c.currentDepartment + '</b></p>'
    : '';
  var history = (c.followupHistory || []).map(function(f) {
    var noteText = f.note ? ' — ' + f.note : '';
    return '<div class="dispute-note"><b>' + f.department + '</b>' + noteText +
      ' <span style="color:var(--steel-2);font-weight:400;">(' + formatDate(f.createdAt) + ')</span></div>';
  }).join('');
  var options = ['Water Supply','Electricity','Sanitation / Garbage','Roads & Public Works','Health','Legal / Land Records','Other']
    .map(function(d) { return '<option value="' + d + '">' + d + '</option>'; }).join('');
  return deptLine + history +
    '<select class="followup-dept" id="followup-dept-' + c.id + '">' + options + '</select> ' +
    '<input class="followup-note" id="followup-note-' + c.id + '" type="text" placeholder="Note (optional)" /> ' +
    '<button class="resolve-btn followup-btn" data-id="' + c.id + '">Log follow-up</button>' +
    '<div class="resolve-error followup-error" id="followup-error-' + c.id + '"></div>';
}
function renderAcknowledgeControl(c) {
  if (c.acknowledgedAt) {
    return '<span class="badge acknowledged">acknowledged ' + formatDate(c.acknowledgedAt) + '</span>';
  }
  var overdueNote = c.ackOverdue ? ' <span class="badge escalated">ack overdue</span>' : '';
  return '<button class="resolve-btn ack-btn" data-id="' + c.id + '">Acknowledge</button>' +
    '<div class="resolve-error ack-error" id="ack-error-' + c.id + '"></div>' + overdueNote;
}

function renderCase(c) {
  var dotClass = 'signal-dot green';
  if (c.status === 'PENDING_CONFIRMATION') dotClass = 'signal-dot gold';
  else if (c.isRedIndicator) dotClass = 'signal-dot red';

  var elapsedClass = c.ackOverdue || c.isRedIndicator ? 'elapsed overdue' : 'elapsed';
  var badge = '';
  if (c.status === 'RESOLVED' || c.status === 'CLOSED') {
    var resolvedWhen = c.resolvedAt ? ' &middot; ' + formatDate(c.resolvedAt) : '';
    badge = '<span class="badge resolved">' + c.status.toLowerCase() + resolvedWhen + '</span>';
  } else if (c.status === 'PENDING_CONFIRMATION') {
    badge = '<span class="badge pending">awaiting citizen confirmation</span>';
  } else if (c.hasEscalatedPastMyTier) {
    badge = '<span class="badge escalated">now with ' + TIER_LABELS[c.currentTopTier] + '</span>';
  }
  var locationLine = c.locationDetail
    ? '<p class="location-detail">' + c.locationDetail + '</p>'
    : '';
  return '<div class="case-row">' +
    '<div class="' + dotClass + '"></div>' +
    '<div class="case-main">' +
      '<div class="tracking-ref">' + c.trackingRef + '</div>' +
      '<div class="category">' + c.category.name + ' &middot; ' + c.localUnit.name + '</div>' +
      '<p class="description">' + c.description + '</p>' +
      locationLine +
      renderPhotoThumbs(c.photoUrls) +
      badge +
        renderDisputeNote(c) +
        renderFollowupControl(c) +
        renderAcknowledgeControl(c) +
        renderResolveControl(c) +
    '</div>' +
    '<div class="case-meta">' +
      '<div class="' + elapsedClass + '">' + timeAgo(c.elapsedDays) + '</div>' +
      renderLadder(c.chainTierList, c.currentTierIndex, c.viewingAsTier) +
    '</div>' +
  '</div>';
}

function renderMandateChips(mandates) {
  var allActive = activeMandateId === null ? ' active' : '';
  var allChip = '<button type="button" class="mandate-chip' + allActive + '" data-mandate-id="">All wards</button>';
  var chips = mandates.map(function(m) {
    var isActive = activeMandateId === m.id ? ' active' : '';
    return '<button type="button" class="mandate-chip' + isActive + '" data-mandate-id="' + m.id + '">' +
      m.name + ' &mdash; <b>' + m.label + '</b></button>';
  }).join('');
  return allChip + chips;
}

function renderReportTab(cases, me) {
  var scopeName = 'All wards';
  if (activeMandateId !== null) {
    var activeMandate = me.mandates.find(function(m) { return m.id === activeMandateId; });
    if (activeMandate) scopeName = activeMandate.name;
  }

  var total = cases.length;
  var resolvedCount = cases.filter(function(c) {
    return c.status === 'RESOLVED' || c.status === 'CLOSED';
  }).length;
  var escalatedCount = cases.filter(function(c) { return c.currentTierIndex > 0; }).length;
  var noFollowupCount = cases.filter(function(c) {
    return !c.followupHistory || c.followupHistory.length === 0;
  }).length;
  var escalationRate = total > 0 ? Math.round((escalatedCount / total) * 100) : 0;

  var html =
    '<div class="report-header">' +
      '<div><h2 class="report-title">Performance report</h2>' +
      '<p class="report-subtitle">' + scopeName + ' &middot; All time</p></div>' +
      '<button type="button" class="export-pdf-btn" id="export-pdf-btn">Export PDF</button>' +
    '</div>' +
    '<div class="stat-grid">' +
      '<div class="stat-card"><div class="stat-number">' + total + '</div><div class="stat-label">Total cases</div></div>' +
      '<div class="stat-card"><div class="stat-number">' + escalationRate + '%</div><div class="stat-label">Escalation rate</div></div>' +
      '<div class="stat-card"><div class="stat-number">' + resolvedCount + '</div><div class="stat-label">Resolved</div></div>' +
      '<div class="stat-card"><div class="stat-number">' + noFollowupCount + '</div><div class="stat-label">No follow-up</div></div>' +
    '</div>';

  if (total === 0) {
    html += '<div class="empty-state"><p>No cases in this scope yet.</p></div>';
    return html;
  }

  html += '<p class="report-list-title">Case activity</p>';
  html += cases.map(function(c) {
    var count = (c.followupHistory || []).length;
    var countClass = count > 0 ? 'followup-count has-followups' : 'followup-count';
    var countLabel = count + (count === 1 ? ' follow-up' : ' follow-ups');
    return '<div class="report-row">' +
      '<div><span class="report-ref">' + c.trackingRef + '</span>' +
      '<span class="report-cat">' + c.category.name + '</span></div>' +
      '<span class="' + countClass + '">' + countLabel + '</span>' +
    '</div>';
  }).join('');

  return html;
}

function renderNotice(title, message) {
  document.getElementById('app').innerHTML =
    '<div class="notice"><h1>' + title + '</h1><p>' + message + '</p></div>';
}

function renderApp() {
  var me = currentMe;
  var cases = activeMandateId === null
    ? currentCases
    : currentCases.filter(function(c) { return c.mandateId === activeMandateId; });
  var redCount = cases.filter(function(c) { return c.isRedIndicator; }).length;
  var primaryMandate = me.mandates[0];

  var html =
    '<div class="console-header"><div class="console-header-inner">' +
      '<div class="console-header-left">' +
        '<div class="console-icon">' + LAYERS_ICON + '</div>' +
        '<div><p class="console-title">GrievIQ Representative console</p><p class="console-subtitle">Grievance escalation service</p></div>' +
      '</div>' +
      '<div class="console-header-right">' +
        '<p class="console-ward">' + primaryMandate.name + '</p>' +
        '<p class="console-role">' + primaryMandate.label + '</p>' +
      '</div>' +
    '</div></div>' +
    '<div class="mandate-strip">' + renderMandateChips(me.mandates) + '</div>' +
    '<div class="tab-bar">' +
      '<button class="tab-btn' + (activeTab === 'cases' ? ' active' : '') + '" data-tab="cases">Cases</button>' +
      '<button class="tab-btn' + (activeTab === 'report' ? ' active' : '') + '" data-tab="report">Report</button>' +
    '</div>' +
    '<main>';

  if (activeTab === 'cases') {
    html +=
      '<div class="register-header">' +
        '<h2 class="register-title">Case register</h2>' +
        '<span class="register-count">' + cases.length + ' case' + (cases.length === 1 ? '' : 's') +
          (redCount > 0 ? ' &middot; ' + redCount + ' need attention' : '') + '</span>' +
      '</div>';
    if (cases.length === 0) {
      html += '<div class="empty-state"><p>No cases currently in your jurisdiction.</p></div>';
    } else {
      html += cases.map(renderCase).join('');
    }
   } else {
    html += renderReportTab(cases, me);
  }

  html += '</main>';
  document.getElementById('app').innerHTML = html;

  attachTabHandlers();
  attachMandateHandlers();
  if (activeTab === 'cases') {
    attachResolveHandlers();
    attachAcknowledgeHandlers();
    attachFollowupHandlers();
  } else if (activeTab === 'report') {
    attachExportPdfHandler();
  }
}

function attachExportPdfHandler() {
  var btn = document.getElementById('export-pdf-btn');
  if (!btn) return;
  btn.addEventListener('click', function() {
    generateReportPdf();
  });
}

function generateReportPdf() {
  var me = currentMe;
  var cases = activeMandateId === null
    ? currentCases
    : currentCases.filter(function(c) { return c.mandateId === activeMandateId; });

  var scopeName = 'All wards';
  if (activeMandateId !== null) {
    var activeMandate = me.mandates.find(function(m) { return m.id === activeMandateId; });
    if (activeMandate) scopeName = activeMandate.name;
  }

  var total = cases.length;
  var resolvedCount = cases.filter(function(c) {
    return c.status === 'RESOLVED' || c.status === 'CLOSED';
  }).length;
  var escalatedCount = cases.filter(function(c) { return c.currentTierIndex > 0; }).length;
  var noFollowupCount = cases.filter(function(c) {
    return !c.followupHistory || c.followupHistory.length === 0;
  }).length;
  var escalationRate = total > 0 ? Math.round((escalatedCount / total) * 100) : 0;

  var jsPDFCtor = window.jspdf.jsPDF;
  var doc = new jsPDFCtor();

  doc.setFont('helvetica', 'bold');
  doc.setFontSize(16);
  doc.text('GrievIQ Performance Report', 14, 18);

  doc.setFont('helvetica', 'normal');
  doc.setFontSize(11);
  doc.text(scopeName + ' - All time', 14, 26);
  doc.setFontSize(9);
  doc.setTextColor(100);
  doc.text('Generated ' + new Date().toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }), 14, 32);
  doc.setTextColor(0);

  var statY = 42;
  var stats = [
    ['Total cases', String(total)],
    ['Escalation rate', escalationRate + '%'],
    ['Resolved', String(resolvedCount)],
    ['No follow-up', String(noFollowupCount)]
  ];
  var colWidth = 46;
  stats.forEach(function(s, i) {
    var x = 14 + i * colWidth;
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(14);
    doc.text(s[1], x, statY);
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(8);
    doc.setTextColor(100);
    doc.text(s[0], x, statY + 5);
    doc.setTextColor(0);
  });

  var tableRows = cases.map(function(c) {
    var count = (c.followupHistory || []).length;
    return [c.trackingRef, c.category.name, count + (count === 1 ? ' follow-up' : ' follow-ups')];
  });

  doc.autoTable({
    head: [['Tracking ref', 'Category', 'Follow-ups']],
    body: tableRows,
    startY: statY + 14,
    styles: { fontSize: 9 },
    headStyles: { fillColor: [27, 95, 168] }
  });

  var fileScope = scopeName.replace(/[^a-z0-9]+/gi, '-').toLowerCase();
  doc.save('grieviq-report-' + fileScope + '.pdf');
}

function attachMandateHandlers() {
  document.querySelectorAll('.mandate-chip').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var id = btn.getAttribute('data-mandate-id');
      activeMandateId = id === '' ? null : id;
      renderApp();
    });
  });
}

function attachTabHandlers() {
  document.querySelectorAll('.tab-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      activeTab = btn.getAttribute('data-tab');
      renderApp();
    });
  });
}

function attachAcknowledgeHandlers() {
  document.querySelectorAll('.ack-btn').forEach(function(btn) {
    btn.addEventListener('click', async function() {
      var id = btn.getAttribute('data-id');
      var errorEl = document.getElementById('ack-error-' + id);
      errorEl.textContent = '';
      btn.disabled = true;
      btn.textContent = 'Acknowledging…';
      try {
        var res = await fetch('/api/grievances/' + id + '/acknowledge', { method: 'POST' });
        var data = await res.json();
        if (!res.ok || data.error) {
          errorEl.textContent = data.error || 'Something went wrong. Please try again.';
          btn.disabled = false;
          btn.textContent = 'Acknowledge';
          return;
        }
        await init();
      } catch (err) {
        errorEl.textContent = 'Could not reach GrievIQ. Check your connection and try again.';
        btn.disabled = false;
        btn.textContent = 'Acknowledge';
      }
    });
  });
}
function attachFollowupHandlers() {
  document.querySelectorAll('.followup-btn').forEach(function(btn) {
    btn.addEventListener('click', async function() {
      var id = btn.getAttribute('data-id');
      var dept = document.getElementById('followup-dept-' + id).value;
      var note = document.getElementById('followup-note-' + id).value;
      var errorEl = document.getElementById('followup-error-' + id);
      errorEl.textContent = '';
      btn.disabled = true;
      btn.textContent = 'Logging…';
      try {
        var res = await fetch('/api/grievances/' + id + '/add-followup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ department: dept, note: note })
        });
        var data = await res.json();
        if (!res.ok || data.error) {
          errorEl.textContent = data.error || 'Something went wrong. Please try again.';
          btn.disabled = false;
          btn.textContent = 'Log follow-up';
          return;
        }
        await init();
      } catch (err) {
        errorEl.textContent = 'Could not reach GrievIQ. Check your connection and try again.';
        btn.disabled = false;
        btn.textContent = 'Log follow-up';
      }
    });
  });
}
function attachResolveHandlers() {
  document.querySelectorAll('.resolve-btn').forEach(function(btn) {
    btn.addEventListener('click', async function() {
      var id = btn.getAttribute('data-id');
      var errorEl = document.getElementById('resolve-error-' + id);
      errorEl.textContent = '';
      btn.disabled = true;
      btn.textContent = 'Marking resolved…';
      try {
        var res = await fetch('/api/grievances/' + id + '/mark-resolved', { method: 'POST' });
        var data = await res.json();
        if (!res.ok || data.error) {
          errorEl.textContent = data.error || 'Something went wrong. Please try again.';
          btn.disabled = false;
          btn.textContent = 'Mark resolved';
          return;
        }
        if (data.warning) {
          errorEl.textContent = data.warning;
        }
        await init();
      } catch (err) {
        errorEl.textContent = 'Could not reach GrievIQ. Check your connection and try again.';
        btn.disabled = false;
        btn.textContent = 'Mark resolved';
      }
    });
  });
}

async function init() {
  var meRes = await fetch('/api/me');
  if (!meRes.ok) {
    if (meRes.status === 403) {
      renderNotice('Not yet provisioned', 'This account is not currently registered as a representative in GrievIQ. Contact your administrator to be added to a jurisdiction.');
    } else {
      renderNotice('Session issue', 'Your login could not be verified. Please refresh the page.');
    }
    return;
  }
  currentMe = await meRes.json();

  var casesRes = await fetch('/api/grievances');
  var casesData = await casesRes.json();
  currentCases = casesData.grievances || [];

  renderApp();
}

init();
</script>

</body>
</html>
