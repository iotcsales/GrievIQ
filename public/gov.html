<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Government dashboard (grieviq-49). Same colours as the department
     dashboard; theme.css gives the dark version (WCAG 2.2 AA in both).
     GIGW 3.0: bilingual, accessible, no personal data. */
  :root {
    --paper: #F6F5F1; --card: #FFFFFF; --ink: #22201C; --ink-soft: #69635A; --teal: #1F4A8A; --teal-dark: #13233F; --teal-tint: #E9EEF7;
    --brick: #B3362A; --brick-dim: #FBE8E5; --grey-line: #D8D3C6; --border: #E7E4DC; --green: #1E6B3E; --gold: #7A5A12; --gold-tint: #FBF1D6;
    --link: #1F4A8A; --line: #D8D3C6; --steel-2: #5A6472;
    --gc-ink: var(--ink); --gc-muted: var(--ink-soft); --gc-line: var(--border); --gc-card: var(--card);
    --gc-s1: #2a78d6; --gc-s2: #c4501f; --gc-bar: #2a78d6; --gc-a1: #86b6ef; --gc-a2: #3987e5; --gc-a3: #1c5cab; --gc-a4: #0d366b;
  }
  :root[data-theme="dark"] { --link: #A9C6F2; --gold: #E0B860; --gold-tint: #33291A; --gc-s1: #3987e5; --gc-s2: #d95926; --gc-bar: #3987e5; --gc-a1: #184f95; --gc-a2: #2a78d6; --gc-a3: #5598e7; --gc-a4: #9ec5f4; }
  @media screen and (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --link: #A9C6F2; --gold: #E0B860; --gold-tint: #33291A; --gc-s1: #3987e5; --gc-s2: #d95926; --gc-bar: #3987e5; --gc-a1: #184f95; --gc-a2: #2a78d6; --gc-a3: #5598e7; --gc-a4: #9ec5f4; } }
  a { color: var(--link); }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: 'Inter', system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  html[lang='hi'] body { font-family: 'Noto Sans Devanagari', 'Inter', system-ui, sans-serif; }
  .trust-strip { background: var(--teal-dark); color: #E3E0D8; font-size: 12px; padding: 7px 16px; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  :root[data-theme="dark"] .trust-strip { background: #0E1A2E; }
  @media screen and (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .trust-strip { background: #0E1A2E; } }
  .lang-toggle { background: none; border: 1px solid rgba(255,255,255,.45); color: #fff; border-radius: 6px; font: inherit; font-size: 12.5px; padding: 4px 10px; min-height: 30px; cursor: pointer; }
  .demo-bar { position: sticky; top: 0; z-index: 20; background: var(--gold-tint); color: var(--ink); border-bottom: 2px solid var(--gold); padding: 8px 16px; font-size: 14px; text-align: center; }
  .demo-bar b { color: var(--ink); }
  .shell { max-width: 1120px; margin: 0 auto; padding: 18px 16px 60px; }
  header.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .brand { display: flex; align-items: center; gap: 10px; font-family: 'Source Serif 4', Georgia, serif; font-weight: 700; font-size: 20px; color: var(--teal-dark); }
  .brand small { display: block; font-family: 'Inter', sans-serif; font-weight: 500; font-size: 12.5px; color: var(--ink-soft); }
  .mark { width: 34px; height: 34px; border-radius: 9px; background: #13233F; display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .who { font-size: 13px; color: var(--ink-soft); text-align: right; }
  .who b { color: var(--ink); }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-bottom: 14px; }
  h1 { font-family: 'Source Serif 4', Georgia, serif; font-size: 26px; margin: 0 0 4px; color: var(--teal-dark); }
  h2 { font-size: 18px; margin: 0 0 8px; }
  p { line-height: 1.5; }
  .lede { color: var(--ink-soft); margin: 0 0 14px; font-size: 14.5px; }
  label { display: block; font-weight: 600; font-size: 14px; margin: 12px 0 4px; }
  input[type=email], input[type=text], input[type=search], select { width: 100%; max-width: 480px; font: inherit; font-size: 16px; padding: 10px 12px; border: 1.5px solid var(--grey-line); border-radius: 10px; background: var(--card); color: var(--ink); }
  [aria-invalid="true"] { border-color: var(--brick) !important; }
  .hint { color: var(--ink-soft); font-size: 13px; margin: 0 0 4px; }
  .err { color: var(--brick); font-size: 13.5px; font-weight: 600; margin-top: 4px; }
  .err:empty { display: none; }
  button, .btn { font: inherit; font-size: 14.5px; font-weight: 600; min-height: 44px; padding: 0 16px; border-radius: 10px; cursor: pointer; border: 1.5px solid var(--teal); background: var(--card); color: var(--teal-dark); }
  button.primary { background: var(--teal); color: #fff; border-color: var(--teal); }
  button:disabled { opacity: .6; cursor: default; }
  button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible, [tabindex]:focus-visible { outline: 3px solid #FFDD00; outline-offset: 2px; }
  .linkish { background: none; border: 0; padding: 0; min-height: 28px; color: var(--link); text-decoration: underline; font-weight: 600; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 14px; }
  .msg { padding: 10px 12px; border-radius: 10px; font-size: 14px; margin-bottom: 12px; }
  .msg.ok { background: var(--teal-tint); color: var(--teal-dark); }
  .msg.bad { background: var(--brick-dim); color: var(--brick); font-weight: 600; }
  .otp { font-size: 22px !important; letter-spacing: 6px; max-width: 220px !important; text-align: center; }
  .note-box { background: var(--teal-tint); border-radius: 10px; padding: 10px 12px; font-size: 13.5px; color: var(--teal-dark); margin-top: 12px; }
  .demo-link { margin-top: 16px; font-size: 14.5px; }
  .demo-link a { font-weight: 600; display: inline-block; min-height: 24px; padding-top: 2px; }
  /* dashboard */
  nav.crumbs ol { list-style: none; display: flex; flex-wrap: wrap; gap: 4px 6px; padding: 0; margin: 0 0 10px; font-size: 14px; }
  nav.crumbs li + li::before { content: "›"; margin-right: 6px; color: var(--ink-soft); }
  nav.crumbs a { display: inline-block; min-height: 24px; padding-top: 2px; font-weight: 600; }
  .scope-sub { color: var(--ink-soft); font-size: 14px; margin: 0 0 12px; }
  .controls { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 12px; }
  .controls > div { min-width: 200px; }
  .controls label { margin-top: 0; font-size: 13px; }
  .controls select { font-size: 15px; padding: 8px 10px; }
  .summary { font-size: 15.5px; background: var(--card); border: 1px solid var(--border); border-left: 4px solid var(--teal); border-radius: 10px; padding: 12px 14px; margin: 0 0 14px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin: 0 0 16px; padding: 0; list-style: none; }
  .tile { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
  .tile .n { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .tile .n.small { font-size: 16px; font-weight: 600; color: var(--ink-soft); }
  .tile .l { font-size: 13.5px; font-weight: 600; margin-top: 2px; }
  .tile .c { font-size: 12.5px; color: var(--ink-soft); margin-top: 4px; }
  .sec { margin-top: 22px; }
  .sec > h2 { margin-bottom: 4px; }
  .sec > p.lede { margin-bottom: 10px; }
  .tbl-tools { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 8px; }
  .tbl-tools label { margin: 0 0 4px; font-size: 13px; }
  .tbl-tools input { max-width: 320px; font-size: 15px; padding: 8px 10px; }
  .tbl-wrap { overflow-x: auto; background: var(--card); border: 1px solid var(--border); border-radius: 12px; }
  table.data { width: 100%; border-collapse: collapse; font-size: 14px; }
  table.data caption { text-align: left; padding: 10px 12px 0; font-size: 13px; color: var(--ink-soft); }
  table.data th, table.data td { padding: 9px 10px; border-bottom: 1px solid var(--border); text-align: right; white-space: nowrap; }
  table.data th:first-child, table.data td:first-child { text-align: left; white-space: normal; min-width: 160px; }
  table.data thead th { font-size: 12.5px; color: var(--ink-soft); font-weight: 600; vertical-align: bottom; }
  table.data thead th button { background: none; border: 0; padding: 4px 0; min-height: 32px; font: inherit; color: inherit; font-weight: 700; cursor: pointer; text-align: inherit; white-space: normal; }
  table.data thead th button::after { content: " ↕"; color: var(--ink-soft); }
  table.data thead th[aria-sort=ascending] button::after { content: " ▲"; color: var(--ink); }
  table.data thead th[aria-sort=descending] button::after { content: " ▼"; color: var(--ink); }
  table.data tbody tr:last-child td, table.data tbody tr:last-child th { border-bottom: 0; }
  table.data tbody th { font-weight: 600; text-align: left; }
  table.data .sub { display: block; font-size: 12px; color: var(--ink-soft); font-weight: 400; }
  table.data a { font-weight: 600; display: inline-block; min-height: 24px; padding-top: 2px; }
  .lt { color: var(--ink-soft); font-size: 12.5px; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(420px, 100%), 1fr)); gap: 14px; }
  .plain { list-style: none; padding: 0; margin: 0; font-size: 14.5px; }
  .plain li { padding: 6px 0; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; gap: 10px; }
  .plain li:last-child { border-bottom: 0; }
  .shared-tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: var(--teal-tint); color: var(--teal-dark); margin-left: 6px; }
  .to-reports a { display: inline-flex; align-items: center; min-height: 44px; font-weight: 600; }
  ul.reports { list-style: none; margin: 0; padding: 0; }
  ul.reports li { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 10px 0; border-bottom: 1px solid var(--border); }
  ul.reports li:last-child { border-bottom: 0; }
  ul.reports b { display: block; font-size: 15px; } ul.reports .lt { display: block; }
  .rp-links { display: flex; gap: 8px; }
  .rp-links a { display: inline-flex; align-items: center; min-height: 40px; padding: 0 14px; border: 1.5px solid var(--teal); border-radius: 10px; font-weight: 600; text-decoration: none; }
  fieldset.rp-mail { border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; margin: 14px 0 0; }
  fieldset.rp-mail legend { font-weight: 700; font-size: 14.5px; padding: 0 4px; }
  label.chk { display: flex; gap: 10px; align-items: center; font-weight: 500; min-height: 40px; margin: 2px 0; }
  label.chk input { width: 20px; height: 20px; margin: 0; accent-color: var(--teal); flex: none; }
  details.about { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; margin-top: 22px; }
  details.about summary { cursor: pointer; font-weight: 700; min-height: 32px; display: flex; align-items: center; }
  details.about dl { display: grid; grid-template-columns: minmax(150px, max-content) 1fr; gap: 6px 14px; font-size: 14px; margin: 10px 0 0; }
  details.about dt { font-weight: 600; } details.about dd { margin: 0; }
  @media (max-width: 560px) { details.about dl { grid-template-columns: 1fr; } details.about dd { margin-bottom: 8px; } .tile .n { font-size: 22px; } h1 { font-size: 22px; } }
  .gc-more summary { cursor: pointer; font-size: 13.5px; font-weight: 600; min-height: 32px; display: flex; align-items: center; }
  .gc-more table { border-collapse: collapse; font-size: 13.5px; } .gc-more th, .gc-more td { padding: 4px 10px; text-align: left; border-bottom: 1px solid var(--border); } .gc-more .n { text-align: right; }
  .empty { color: var(--ink-soft); font-size: 14.5px; }
  .sr-only { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  footer { text-align: center; font-size: 12.5px; color: var(--ink-soft); margin-top: 28px; }
  footer a { color: var(--link); display: inline-block; min-height: 24px; padding-top: 3px; }
  [hidden] { display: none !important; }
  @media print { .trust-strip, .controls, .tbl-tools, header .who button, footer { display: none !important; } .demo-bar { position: static; } }
</style>

<body>
<div class="trust-strip"><span data-i18n="gv.strip">GrievIQ for state and district governments</span><button type="button" class="lang-toggle" data-lang-toggle lang="hi">हिन्दी</button></div>
<div class="demo-bar" id="demo-bar" role="note" hidden></div>
<div class="shell">
  <header class="top">
    <div class="brand"><span class="mark" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" focusable="false"><path d="M34.3 11.7A16 16 0 1 0 40 25H33"/><path d="M12.7 35.3 8 43l9.2-4.5z" fill="#fff"/><path d="M20 22l6 6 15-17" stroke="#E8B631"/></svg></span>
      <span>GrievIQ<small data-i18n="gv.brand_sub">Government dashboard</small></span></div>
    <div class="who" id="who" hidden></div>
  </header>
  <main id="main" tabindex="-1"><p class="empty" data-i18n="gv.loading">Loading…</p></main>
  <footer><span data-i18n="gv.foot">No citizen's name, phone number or complaint text is shown here.</span> · <a href="/privacy" data-i18n="gv.privacy">Privacy</a> · <a href="/accessibility" data-i18n="gv.accessibility">Accessibility</a></footer>
</div>
<script>
(function () {
  function T(k, v) { return window.GIQ ? GIQ.t(k, v) : k; }
  function loc() { return window.GIQ ? GIQ.locale() : "en-IN"; }
  function hi() { return window.GIQ && GIQ.lang === "hi"; }
  function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;"); }
  async function api(url, opts) {
    try { var r = await fetch(url, Object.assign({ credentials: "same-origin", cache: "no-store" }, opts || {})); var b = await r.json().catch(function () { return {}; }); return { ok: r.ok, status: r.status, body: b }; }
    catch (e) { return { ok: false, status: 0, body: {} }; }
  }
  var main = document.getElementById("main");
  var params = new URLSearchParams(location.search);
  var DEMO = params.get("demo") === "1";
  var S = { screen: "loading", email: "", emailErr: "", codeErr: "", msg: null, busy: false, me: null, data: null,
    month: params.get("month") || "", state: params.get("state") || "", district: params.get("district") || "", dept: params.get("dept") || "", sort: { key: null, dir: -1 }, q: "", loadErr: "" };

  // ---- numbers (the small-number rule is applied by the server) ----
  function num(v) { return v === "<10" ? T("gv.lt10") : v == null ? "—" : Number(v).toLocaleString(loc()); }
  function pct(v) { return v == null ? null : Number(v).toLocaleString(loc(), { maximumFractionDigits: 1 }) + "%"; }
  function days(v) { return v == null ? null : T("gv.n_days", { n: Number(v).toLocaleString(loc(), { maximumFractionDigits: 1 }) }); }
  function sortVal(v) { return v === "<10" ? 5 : v == null ? -1 : Number(v); }
  function nm(x) { return x ? (hi() && x.nameHi ? x.nameHi : x.nameEn) : ""; }
  function monthName(mo, long) { return new Date(mo + "-01T00:00:00+05:30").toLocaleDateString(loc(), { month: long === false ? "short" : "long", year: "numeric", timeZone: "Asia/Kolkata" }); }
  function themeName(t) { return t === "OTHER" ? T("gv.theme_other") : T("theme." + t); }

  // ---- address bar keeps the view (back button works) ----
  function url() {
    var p = new URLSearchParams();
    if (DEMO) p.set("demo", "1");
    if (S.state) p.set("state", S.state);
    if (S.district) p.set("district", S.district);
    if (S.dept) p.set("dept", S.dept);
    if (S.month) p.set("month", S.month);
    var q = p.toString(); return location.pathname + (q ? "?" + q : "");
  }
  window.addEventListener("popstate", function () {
    var p = new URLSearchParams(location.search);
    S.state = p.get("state") || ""; S.district = p.get("district") || ""; S.dept = p.get("dept") || ""; S.month = p.get("month") || "";
    if (S.me) loadStats("h1", true);
  });

  function setWho() {
    var w = document.getElementById("who"), bar = document.getElementById("demo-bar");
    bar.hidden = !DEMO;
    if (DEMO) bar.innerHTML = "<b>" + esc(T("gv.demo_bar_b")) + "</b> " + esc(T("gv.demo_bar")) + ' <a href="/gov">' + esc(T("gv.demo_leave")) + "</a>";
    if (!S.me || DEMO) { w.hidden = true; return; }
    w.hidden = false;
    var u = S.me.user;
    w.innerHTML = "<b>" + esc(u.name) + "</b> · " + esc(u.designation) + "<br>" + esc(scopeLabel()) +
      ' · <button type="button" class="linkish" id="sign-out">' + esc(T("gv.sign_out")) + "</button>";
    document.getElementById("sign-out").addEventListener("click", signOut);
  }
  function scopeLabel() {
    var me = S.me; if (!me) return "";
    if (me.user.level === "NATIONAL") return T("gv.scope_country", { c: nm(me.country) });
    return me.user.level === "DISTRICT" && me.district ? T("gv.scope_district", { d: nm(me.district), s: nm(me.state) }) : T("gv.scope_state", { s: nm(me.state) });
  }
  // The level now shown: "country", "state" or "district" (from the server's answer).
  function level() { var pl = S.data && S.data.place; return !pl ? "country" : pl.district ? "district" : pl.state ? "state" : "country"; }
  function msgHtml() { return S.msg ? '<div class="msg ' + (S.msg.bad ? "bad" : "ok") + '" id="msg" tabindex="-1" role="' + (S.msg.bad ? "alert" : "status") + '">' + esc(S.msg.text) + "</div>" : ""; }
  function show(focusId) {
    setWho();
    if (S.screen === "email") main.innerHTML = renderEmail();
    else if (S.screen === "code") main.innerHTML = renderCode();
    else if (S.screen === "dash") main.innerHTML = renderDash();
    else if (S.screen === "error") main.innerHTML = '<div class="card"><p class="msg bad" role="alert">' + esc(S.loadErr) + '</p><button type="button" id="retry">' + esc(T("gv.retry")) + "</button></div>";
    else main.innerHTML = '<p class="empty">' + esc(T("gv.loading")) + "</p>";
    wire();
    if (S.screen === "dash" && window.GIQC) GIQC.attach(main, { loc: loc(), received: T(S.dept ? "gv.t_forwarded" : "gv.t_received"), resolved: T(S.dept ? "gv.t_done" : "gv.t_resolved") });
    var el = focusId && document.getElementById(focusId);
    if (el) el.focus();
  }

  // ---------------- sign in ----------------
  function renderEmail() {
    return '<div class="card"><h1 id="h" tabindex="-1">' + esc(T("gv.signin_h")) + '</h1><p class="lede">' + esc(T("gv.signin_lede")) + "</p>" + msgHtml() +
      '<form id="f-email" novalidate><label for="email">' + esc(T("gv.email")) + '</label><p class="hint" id="email-hint">' + esc(T("gv.email_hint")) + "</p>" +
      '<input type="email" id="email" autocomplete="email" maxlength="200" value="' + esc(S.email) + '" aria-describedby="email-hint email-err"' + (S.emailErr ? ' aria-invalid="true"' : "") + ">" +
      '<div class="err" id="email-err" role="alert">' + esc(S.emailErr) + "</div>" +
      '<div class="row"><button type="submit" class="primary" id="send"' + (S.busy ? " disabled" : "") + ">" + esc(T("dd.send_code")) + "</button></div></form>" +
      '<p class="note-box">' + esc(T("gv.signin_note")) + "</p>" +
      '<p class="demo-link"><a href="/gov?demo=1">' + esc(T("gv.demo_link")) + "</a></p></div>";
  }
  function renderCode() {
    return '<div class="card"><h1 id="h" tabindex="-1">' + esc(T("dd.code_h")) + '</h1><p class="lede">' + esc(T("dd.code_lede", { email: S.email })) + "</p>" + msgHtml() +
      '<form id="f-code" novalidate><label for="code">' + esc(T("dd.code")) + '</label><input type="text" id="code" class="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" aria-describedby="code-err"' + (S.codeErr ? ' aria-invalid="true"' : "") + ">" +
      '<div class="err" id="code-err" role="alert">' + esc(S.codeErr) + "</div>" +
      '<div class="row"><button type="submit" class="primary" id="verify"' + (S.busy ? " disabled" : "") + ">" + esc(T("dd.sign_in")) + '</button><button type="button" id="again">' + esc(T("dd.new_code")) + '</button><button type="button" class="linkish" id="other-email">' + esc(T("dd.other_email")) + "</button></div></form></div>";
  }
  async function sendCode(ev) {
    if (ev) ev.preventDefault();
    var e = document.getElementById("email"); if (e) S.email = e.value.trim();

    return h + '<ul class="plain">' + list.map(function (o) {
      return "<li><span><b>" + esc(o.name) + '</b><span class="shared-tag">' + esc(T("gv.shared_tag")) + '</span><br><span class="lt">' +
        esc(T("gv.reps_line", { r: num(o.received), f: num(o.resolved), p: num(o.pending) })) + (o.within != null ? " · " + esc(T("gv.reps_within", { v: pct(o.within) })) : "") + "</span></span></li>";
    }).join("") + "</ul>";
  }
  function renderDept(x) {
    var h = '<p class="summary">' + esc(T("gv.dept_sum", { m: monthName(S.data.month), f: num(x.forwarded), w: num(x.withNow), l: num(x.overdueNow) })) + "</p>";
    h += '<ul class="tiles" aria-label="' + esc(T("gv.key_figures")) + '">' +
      tile(T("gv.col_forwarded"), num(x.forwarded)) + tile(T("gv.col_with_now"), num(x.withNow)) + tile(T("gv.col_late_now"), num(x.overdueNow)) +
      pctTile(T("gv.col_on_time"), x.onTime, x.prevOnTime) +
      (x.firstReplyDays == null ? tile(T("gv.t_first_reply"), T("gv.not_enough"), null, true) : tile(T("gv.t_first_reply"), days(x.firstReplyDays))) +
      pctTile(T("gv.t_fixed_first"), x.fixedFirst) + pctTile(T("gv.t_reopened"), x.reopened) + pctTile(T("gv.col_satisfied"), x.rating) +
      tile(T("gv.t_not_ours"), num(x.notOurs)) + "</ul>";
    h += '<section class="sec card" aria-labelledby="dtrend-h">' + trendHtml(x.trend, "dtrend-h", "gv.dtrend_h", "gv.t_forwarded", "gv.t_done", "gv.dtrend_sum") + "</section>";
    return h;
  }
  function about() {
    var items = ["received", "resolved", "pending", "ages", "within", "avg", "reopened", "satisfied", "moved", "dept", "located", "small", "reps", "lgd"];
    return '<details class="about" id="about"><summary>' + esc(T("gv.about_h")) + "</summary><dl>" +
      items.map(function (k) { return "<dt>" + esc(T("gv.ab_" + k + "_t")) + "</dt><dd>" + esc(T("gv.ab_" + k)) + "</dd>"; }).join("") + "</dl></details>";
  }

  function wire() {
    var f = document.getElementById("f-email"); if (f) f.addEventListener("submit", sendCode);
    var fc = document.getElementById("f-code"); if (fc) fc.addEventListener("submit", verify);
    var ag = document.getElementById("again"); if (ag) ag.addEventListener("click", function () { sendCode(); });
    var oe = document.getElementById("other-email"); if (oe) oe.addEventListener("click", function () { S.screen = "email"; S.msg = null; show("email"); });
    var rt = document.getElementById("retry"); if (rt) rt.addEventListener("click", function () { start("h1"); });
    var m = document.getElementById("month"); if (m) m.addEventListener("change", function () { S.month = m.value; loadStats("month"); });
    var pl = (S.data && S.data.place) || {};
    var stId = pl.state ? pl.state.id : "", dId = pl.district ? pl.district.id : "";
    main.querySelectorAll("[data-go]").forEach(function (a) { a.addEventListener("click", function (e) { e.preventDefault(); var g = a.getAttribute("data-go"); go(g === "country" ? "" : stId, g === "district" ? dId : "", ""); }); });
    main.querySelectorAll("[data-state]").forEach(function (a) { a.addEventListener("click", function (e) { e.preventDefault(); go(a.getAttribute("data-state"), "", ""); }); });
    main.querySelectorAll("[data-district]").forEach(function (a) { a.addEventListener("click", function (e) { e.preventDefault(); go(stId, a.getAttribute("data-district"), ""); }); });
    main.querySelectorAll("[data-dept]").forEach(function (a) { a.addEventListener("click", function (e) { e.preventDefault(); go(stId, dId, a.getAttribute("data-dept")); }); });
    main.querySelectorAll("[data-sort]").forEach(function (b) {
      b.addEventListener("click", function () {
        var k = b.getAttribute("data-sort");
        S.sort = S.sort.key === k ? { key: k, dir: -S.sort.dir } : { key: k, dir: k === "name" ? 1 : -1 };
        var y = window.scrollY; show(); window.scrollTo(0, y);
        var nb = main.querySelector('[data-sort="' + k + '"]'); if (nb) nb.focus();
      });
    });
    ["mail-monthly", "mail-weekly"].forEach(function (id) { var c = document.getElementById(id); if (c) c.addEventListener("change", savePrefs); });
    var tr = document.getElementById("to-reports"); if (tr) tr.addEventListener("click", function (e) { e.preventDefault(); var r = document.getElementById("reports"); r.scrollIntoView(); r.focus({ preventScroll: true }); });
    var rq = document.getElementById("rows-q");
    if (rq) rq.addEventListener("input", function () {
      S.q = rq.value; var pos = rq.selectionStart, y = window.scrollY; show(); window.scrollTo(0, y);
      var n = document.getElementById("rows-q"); n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) {}
    });
  }
  document.addEventListener("giq:lang", function () { show(); });
  start();
})();
</script>
</body>
</html>
