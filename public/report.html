<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GrievIQ — Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #14181D; --paper: #ECEEF1; --card: #FFFFFF; --line: #D7DBE0;
    --steel: #3A4552; --steel-2: #59657A; --red: #C23B2C; --red-tint: #F7E4E0;
    --green: #2F6B4F; --green-tint: #E4EFE8; --gold: #A9822E; --gold-tint: #F5EDDD;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font-family: 'Public Sans', sans-serif; -webkit-font-smoothing: antialiased; }
  .masthead { background: var(--ink); color: var(--paper); padding: 28px 24px 22px; }
  .masthead-inner { max-width: 760px; margin: 0 auto; }
  .masthead-title { font-family: 'Source Serif 4', serif; font-weight: 700; font-size: 26px; margin: 0 0 4px; }
  .masthead-sub { font-size: 14px; color: #B9C0C9; margin: 0; }
  main { max-width: 760px; margin: 0 auto; padding: 24px 24px 60px; }
  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-end; margin-bottom: 24px; padding: 16px; background: var(--card); border: 1px solid var(--line); border-radius: 6px; }
  .field { display: flex; flex-direction: column; gap: 4px; }
  .field label { font-size: 12px; color: var(--steel-2); font-weight: 600; }
  .field input, .field select { font-family: inherit; font-size: 13px; padding: 7px 9px; border: 1px solid var(--line); border-radius: 4px; }
  .btn { font-family: inherit; font-size: 13px; font-weight: 600; padding: 8px 14px; border-radius: 4px; cursor: pointer; border: 1.5px solid var(--ink); background: var(--card); color: var(--ink); }
  .btn:hover { background: var(--ink); color: var(--paper); }
  .btn.primary { background: var(--ink); color: var(--paper); }
  .btn.primary:hover { background: var(--steel); }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 24px; }
  .stat-card { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 14px; }
  .stat-value { font-family: 'Source Serif 4', serif; font-size: 26px; font-weight: 700; }
  .stat-label { font-size: 12px; color: var(--steel-2); margin-top: 2px; }
  .section-title { font-family: 'Source Serif 4', serif; font-weight: 600; font-size: 17px; border-bottom: 2px solid var(--ink); padding-bottom: 8px; margin: 28px 0 12px; }
  .breakdown-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
  table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 8px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--steel-2); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; }
  .tag { display: inline-block; font-size: 10.5px; font-weight: 600; padding: 2px 6px; border-radius: 3px; }
  .tag.resolved { background: var(--green-tint); color: var(--green); }
  .tag.pending { background: var(--gold-tint); color: var(--gold); }
  .tag.open { background: var(--red-tint); color: var(--red); }
  .tag.disputed { background: var(--red-tint); color: var(--red); margin-left: 4px; }
  .footer-note { margin-top: 28px; font-size: 11.5px; color: var(--steel-2); }
  @media print {
    .controls, .no-print { display: none !important; }
    body { background: white; }
    .masthead { background: white; color: var(--ink); border-bottom: 2px solid var(--ink); }
    .masthead-sub { color: var(--steel-2); }
  }
</style>
</head>
<body>
<div id="app"></div>
<script>
const TIER_LABELS = { LOCAL: 'Local', MAYOR: 'Mayor', MLA: 'MLA', MP: 'MP' };

function fmtHours(h) {
  if (h === null || h === undefined) return '—';
  if (h < 24) return Math.round(h) + ' hrs';
  return Math.round((h / 24) * 10) / 10 + ' days';
}

function fmtDate(iso) {
  if (!iso) return '—';
  var d = new Date(iso);
  return d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
}

function statusTag(status) {
  var cls = status === 'RESOLVED' || status === 'CLOSED' ? 'resolved' : status === 'PENDING_CONFIRMATION' ? 'pending' : 'open';
  return '<span class="tag ' + cls + '">' + status.toLowerCase().replace('_', ' ') + '</span>';
}

function renderBreakdown(obj) {
  var entries = Object.entries(obj);
  if (entries.length === 0) return '<p style="font-size:13px;color:var(--steel-2);">No data.</p>';
  return entries.map(function(e) {
    return '<div class="breakdown-row"><span>' + e[0] + '</span><span><b>' + e[1] + '</b></span></div>';
  }).join('');
}

function toCsv(cases) {
  var headers = ['Tracking Ref','Category','Local Unit','Status','Created At','Acknowledged At','Resolved At','Disputed'];
  var rows = cases.map(function(c) {
    return [c.trackingRef, c.category, c.localUnit, c.status, c.createdAt, c.acknowledgedAt || '', c.resolvedAt || '', c.disputed ? 'Yes' : 'No']
      .map(function(v) { return '"' + String(v).replace(/"/g, '""') + '"'; }).join(',');
  });
  return headers.join(',') + '\n' + rows.join('\n');
}

function downloadCsv(cases, mandate) {
  var csv = toCsv(cases);
  var blob = new Blob([csv], { type: 'text/csv' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'grieviq-report-' + mandate.id + '-' + new Date().toISOString().slice(0,10) + '.csv';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

async function loadReport(mandateId, from, to) {
  var qs = new URLSearchParams();
  if (mandateId) qs.set('mandateId', mandateId);
  if (from) qs.set('from', from);
  if (to) qs.set('to', to);
  var res = await fetch('/api/grievances/report?' + qs.toString());
  return res.json();
}

function renderControls(mandates, selectedMandateId, from, to) {
  var options = mandates.map(function(m) {
    var sel = m.id === selectedMandateId ? ' selected' : '';
    return '<option value="' + m.id + '"' + sel + '>' + m.name + ' — ' + m.label + '</option>';
  }).join('');
  return '<div class="controls no-print">' +
    (mandates.length > 1 ? '<div class="field"><label>Jurisdiction</label><select id="mandate-select">' + options + '</select></div>' : '') +
    '<div class="field"><label>From</label><input type="date" id="from-input" value="' + (from || '') + '"></div>' +
    '<div class="field"><label>To</label><input type="date" id="to-input" value="' + (to || '') + '"></div>' +
    '<button class="btn" id="apply-btn">Apply</button>' +
    '<button class="btn primary" id="pdf-btn">Download PDF</button>' +
    '<button class="btn" id="csv-btn">Download CSV</button>' +
  '</div>';
}

function renderReport(data) {
  var s = data.stats;
  var rangeLabel = (data.from ? fmtDate(data.from) : 'All time') + ' – ' + (data.to ? fmtDate(data.to) : 'Present');

  var rows = data.cases.map(function(c) {
    return '<tr><td>' + c.trackingRef + '</td><td>' + c.category + '</td><td>' + c.localUnit + '</td>' +
      '<td>' + statusTag(c.status) + (c.disputed ? '<span class="tag disputed">disputed</span>' : '') + '</td>' +
      '<td>' + fmtDate(c.createdAt) + '</td><td>' + fmtDate(c.resolvedAt) + '</td><td>' + (c.followupCount > 0 ? c.followupCount : '<span class="tag disputed">none</span>') + '</t
  }).join('');

  return '<main>' +
    '<h2 style="font-family:\'Source Serif 4\',serif;font-size:19px;margin-bottom:2px;">Performance Report</h2>' +
    '<p style="color:var(--steel-2);font-size:13px;margin-top:0;">' + data.mandate.name + ' — ' + data.mandate.label + ' &middot; ' + rangeLabel + '</p>' +
    '<div class="stat-grid">' +
      '<div class="stat-card"><div class="stat-value">' + s.totalCases + '</div><div class="stat-label">Total cases</div></div>' +
      '<div class="stat-card"><div class="stat-value">' + fmtHours(s.avgResolveHours) + '</div><div class="stat-label">Avg. time to resolve</div></div>' +
      '<div class="stat-card"><div class="stat-value">' + (s.disputeRate === null ? '—' : s.disputeRate + '%') + '</div><div class="stat-label">Dispute rate</div></div>' +
      '<div class="stat-card"><div class="stat-value">' + fmtHours(s.avgAckHours) + '</div><div class="stat-label">Avg. time to acknowledge</div></div>' +
      '<div class="stat-card"><div class="stat-value">' + s.resolvedCount + '</div><div class="stat-label">Resolved cases</div></div>' +
      '<div class="stat-card"><div class="stat-value">' + (s.escalationRate === null ? '—' : s.escalationRate + '%') + '</div><div class="stat-label">Escalation rate</div></div>' +
      '<div class="stat-card"><div class="stat-value">' + s.noFollowupCount + '</div><div class="stat-label">No follow-up yet</div></div>' +
    '</div>' +
    '<h3 class="section-title">By category</h3>' + renderBreakdown(s.byCategory) +
    '<h3 class="section-title">By status</h3>' + renderBreakdown(s.byStatus) +
    '<h3 class="section-title">Case detail</h3>' +
    '<table><thead><tr><th>Ref</th><th>Category</th><th>Unit</th><th>Status</th><th>Filed</th><th>Resolved</th></tr></thead><tbody>' + rows + '</tbody></table>' +
    '<p class="footer-note">Dispute and escalation rates reflect the complete, permanent case history and cannot be filtered out of this report. Generated ' + new Date().toLocaleString('en-IN') + '.</p>' +
  '</main>';
}

async function init() {
  var meRes = await fetch('/api/me');
  var me = await meRes.json();
  var mandates = me.mandates;

  var urlParams = new URLSearchParams(window.location.search);
  var mandateId = urlParams.get('mandateId') || mandates[0].id;
  var from = urlParams.get('from') || '';
  var to = urlParams.get('to') || '';

  var data = await loadReport(mandateId, from, to);

  var html =
    '<div class="masthead"><div class="masthead-inner">' +
      '<p class="masthead-title">GrievIQ</p>' +
      '<p class="masthead-sub">Report generation</p>' +
    '</div></div>' +
    renderControls(mandates, mandateId, from, to) +
    renderReport(data);

  document.getElementById('app').innerHTML = html;

  document.getElementById('apply-btn').addEventListener('click', function() {
    var newMandate = mandates.length > 1 ? document.getElementById('mandate-select').value : mandateId;
    var newFrom = document.getElementById('from-input').value;
    var newTo = document.getElementById('to-input').value;
    var qs = new URLSearchParams();
    qs.set('mandateId', newMandate);
    if (newFrom) qs.set('from', newFrom);
    if (newTo) qs.set('to', newTo);
    window.location.search = qs.toString();
  });

  document.getElementById('pdf-btn').addEventListener('click', function() {
    window.print();
  });

  document.getElementById('csv-btn').addEventListener('click', function() {
    downloadCsv(data.cases, data.mandate);
  });
}

init();
</script>
</body>
</html>
