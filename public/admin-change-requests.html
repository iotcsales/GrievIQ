  html.light-theme .st-PENDING { background: #fbf1d6; color: #7a5c1c; } html.light-theme .st-APPROVED { background: #e6f4ea; color: #1f7a3a; }
  html.light-theme .st-REJECTED { background: #fbe7e5; color: #b23a30; } html.light-theme .st-WITHDRAWN, html.light-theme .st-OUT_OF_DATE { background: #eef0f3; color: #5b6472; }
  table.cmp { margin-top: 10px; }

<script>
// ---- Language (English / Hindi): text lives in /i18n.js (keys "adm.*") ----
function T(key, vars) { return window.GIQ ? window.GIQ.t(key, vars) : key; }
function isHi() { return !!(window.GIQ && window.GIQ.lang === "hi"); }
function loc() { return window.GIQ ? window.GIQ.locale() : "en-IN"; }
function timeOpts() { return isHi() ? { hour: "2-digit", minute: "2-digit", hourCycle: "h23" } : { hour: "numeric", minute: "2-digit" }; }

function esc(s) {
  return String(s === null || s === undefined ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function fmtDate(iso) {
  if (!iso) return "";
  var s = String(iso);
  var d = new Date(s.indexOf("T") !== -1 ? s : s.replace(" ", "T") + "Z");
  if (isNaN(d)) return s;
  return d.toLocaleDateString(loc(), { day: "numeric", month: "short", year: "numeric" }) + ", " +
    d.toLocaleTimeString(loc(), timeOpts());
}
// The record label is stored in English ("Ward representative — Aishbagh",
// "New ward under ..."); show it in the page language, keeping the name.
function labelText(r) {
  var lbl = String(r.targetLabel || "");
  // Departments (Oct 2026): an office in the department directory.
  if (r.kind === "dept_office") {
    var nvd = r.newValues || {};
    return T("adm.c_lbl_dept_" + (nvd.op || "update"), { name: (nvd.values && nvd.values.nameEn) || nvd.name || lbl });
  }
  if (r.kind === "dept_type") {
    var nvt = r.newValues || {};
    return T("adm.c_lbl_dtype_" + (nvt.op || "rename"), { name: nvt.name || lbl });
  }
  if (r.kind === "dept_import") return T("adm.c_lbl_dept_import", { n: ((r.newValues || {}).rows || []).length });
  if (r.kind === "add_unit") {
    var m = lbl.match(/^New (ward|village) under (.*)$/);
    return m ? T(m[1] === "village" ? "adm.c_lbl_new_village" : "adm.c_lbl_new_ward", { mla: m[2] }) : lbl;
  }
  var i = lbl.indexOf(" — ");
  var place = i >= 0 ? lbl.slice(i + 3) : lbl;
  var k = "adm.c_lbl_" + r.targetType;
  var who = T(k);
  return who === k ? lbl : who + " — " + place;
}
function statusText(st) { var k = "adm.c_st_" + st; var v = T(k); return v === k ? st : v; }
function fieldText(f) { var k = "adm.f_" + f; var v = T(k); return v === k ? f : v; }
var ADD_FIELDS = [["name", "adm.c_add_ward"], ["unitType", "adm.c_add_type"], ["repName", "adm.c_add_rep"], ["repPhone", "adm.f_phone"], ["repEmail", "adm.f_email"], ["localities", "adm.c_add_localities"]];

var state = { data: null, view: "pending" };

function val(v) { return v === null || v === undefined || v === "" ? '<span class="muted">' + T("adm.blank") + '</span>' : esc(v); }
function sourceHtml(src) {
  if (!src) return '<span class="muted">' + T("adm.c_none_given") + '</span>';
  if (/^https?:\/\/\S+$/i.test(src)) return '<a class="src" href="' + esc(src) + '" target="_blank" rel="noopener noreferrer">' + esc(src) + "</a>";
  return esc(src);
}

var DEPT_FIELDS = ["nameEn", "nameHi", "departments", "wards", "helpline", "officePhone", "officeEmail", "whatsapp", "website", "address", "hours",
  "officerName", "officerPhone", "officerConsentDate", "officerConsentHow", "source", "lastChecked", "notes"];
function deptVal(f, v) {
  if (f === "departments") return v && v.length ? esc(v.map(function (d) { return window.GIQ ? GIQ.dept(d) : d; }).join(", ")) : val(null);
  if ((f === "lastChecked" || f === "officerConsentDate") && /^\d{4}-\d{2}-\d{2}$/.test(v || "")) {
    return esc(new Date(v + "T00:00:00+05:30").toLocaleDateString(loc(), { day: "numeric", month: "short", year: "numeric", timeZone: "Asia/Kolkata" }));
  }
  if (f === "wards") return v && v.length ? esc(T("adm.c_dept_n_wards", { n: v.length })) : esc(T("adm.c_dept_whole_area"));
  return val(v);
}
function typeTable(r) {
  var nv = r.newValues || {};
  if (nv.op !== "add" && nv.op !== "rename") return "";
  var after = nv.values || {}, before = nv.before;
  var rows = [["nameEn", "adm.dp_lbl_typeNameEn"], ["nameHi", "adm.dp_lbl_typeNameHi"], ["description", "adm.dp_lbl_typeDescription"], ["targetDays", "adm.dp_lbl_typeTargetDays"]].filter(function (f) {
    return before ? (before[f[0]] || null) !== (after[f[0]] || null) : !!after[f[0]];
  }).map(function (f) {
    return "<tr><td>" + esc(T(f[1])) + "</td>" + (before ? "<td>" + val(before[f[0]]) + "</td>" : "") + '<td class="changed">' + val(after[f[0]]) + "</td></tr>";
  }).join("");
  return '<table class="cmp"><thead><tr><th scope="col">' + T("adm.c_detail") + "</th>" + (before ? '<th scope="col">' + T("adm.c_before") + "</th>" : "") + '<th scope="col">' + T("adm.c_requested") + "</th></tr></thead><tbody>" + rows + "</tbody></table>";
}
function deptTable(r) {
  if (r.kind === "dept_type") return typeTable(r);
  var nv = r.newValues || {};
  if (r.kind === "dept_import") {
    return '<table class="cmp"><thead><tr><th scope="col">' + T("adm.dp_up_office") + '</th><th scope="col">' + T("adm.dp_lbl_departments") + '</th><th scope="col">' + T("adm.dp_lbl_wards") + "</th></tr></thead><tbody>" +
      (nv.rows || []).map(function (v) { return "<tr><td class=\"changed\">" + esc(v.nameEn) + "</td><td>" + deptVal("departments", v.departments) + "</td><td>" + deptVal("wards", v.wards) + "</td></tr>"; }).join("") + "</tbody></table>";
  }
  if (nv.op === "retire" || nv.op === "restore") return "";
  var after = nv.values || {}, before = nv.before;
  var rows = DEPT_FIELDS.filter(function (f) {
    if (!before) return after[f] != null && !(Array.isArray(after[f]) && !after[f].length && f !== "wards");
    return JSON.stringify(before[f] == null ? null : before[f]) !== JSON.stringify(after[f] == null ? null : after[f]);
  }).map(function (f) {
    return "<tr><td>" + esc(T("adm.dp_lbl_" + f)) + "</td>" + (before ? "<td>" + deptVal(f, before[f]) + "</td>" : "") + '<td class="changed">' + deptVal(f, after[f]) + "</td></tr>";
  }).join("");
  return '<table class="cmp"><thead><tr><th scope="col">' + T("adm.c_detail") + "</th>" + (before ? '<th scope="col">' + T("adm.c_before") + "</th>" : "") + '<th scope="col">' + T("adm.c_requested") + "</th></tr></thead><tbody>" + rows + "</tbody></table>";
}

function compareTable(r) {
  if (r.kind === "dept_office" || r.kind === "dept_import" || r.kind === "dept_type") return deptTable(r);
  if (r.kind === "add_unit") {
    var v = r.newValues || {};
    return '<table class="cmp"><thead><tr><th scope="col">' + T("adm.c_detail") + '</th><th scope="col">' + T("adm.c_requested") + '</th></tr></thead><tbody>' +
      ADD_FIELDS.map(function (f) {
        var shown = f[0] === "unitType" && v.unitType ? (v.unitType === "URBAN" ? T("adm.urban_ward") : v.unitType === "RURAL" ? T("adm.rural_village") : v.unitType) : v[f[0]];
        return "<tr><td>" + T(f[1]) + '</td><td class="changed">' + val(shown) + "</td></tr>";
      }).join("") +
      "</tbody></table>";
  }
  var nv = r.newValues || {}, ov = r.oldValues || {}, live = r.liveValues;
  var rows = Object.keys(nv).map(function (f) {
    var current = live ? live[f] : ov[f];
    var changedSince = live && (live[f] ?? null) !== (ov[f] ?? null);
    return "<tr><td>" + esc(fieldText(f)) + "</td><td>" + val(current) +
      (changedSince ? '<div class="was">' + esc(T("adm.c_when_requested", { v: ov[f] ? ov[f] : T("adm.blank") })) + "</div>" : "") +
      '</td><td class="changed">' + val(nv[f]) + "</td></tr>";
  }).join("");
  return '<table class="cmp"><thead><tr><th scope="col">' + T("adm.c_detail") + '</th><th scope="col">' + (live ? T("adm.c_current") : T("adm.c_before")) +
    '</th><th scope="col">' + T("adm.c_requested") + '</th></tr></thead><tbody>' + rows + "</tbody></table>";
}

function isOutOfDate(r) {
  if (r.status !== "PENDING" || r.kind !== "contact" || !r.liveValues) return false;
  var ov = r.oldValues || {};
  return Object.keys(r.newValues || {}).some(function (f) { return (r.liveValues[f] ?? null) !== (ov[f] ?? null); });
}

function renderCard(r, approver, viewer) {
  var own = approver && r.requestedBy === state.data.email;
  var pending = r.status === "PENDING";
  var ood = isOutOfDate(r);
  var html = '<div class="req" id="req-' + esc(r.id) + '">' +
    '<div class="req-head">' +
      (approver && pending && !own && !ood ? '<input type="checkbox" class="pick" data-id="' + esc(r.id) + '" aria-label="' + esc(T("adm.c_select", { label: labelText(r) })) + '">' : "") +
      '<div class="req-title">' + esc(labelText(r)) + (r.kind === "add_unit" ? "" : "") +
        '<div class="req-meta">' + esc(viewer ? T("adm.c_requested_by", { who: r.requestedBy, date: fmtDate(r.requestedAt) }) : T("adm.c_sent_on", { date: fmtDate(r.requestedAt) })) +
        (r.reviewedAt && !pending ? esc(r.status === "WITHDRAWN" ? T("adm.c_withdrawn", { date: fmtDate(r.reviewedAt) })
          : r.reviewedBy ? T("adm.c_decided_by", { date: fmtDate(r.reviewedAt), who: r.reviewedBy }) : T("adm.c_decided", { date: fmtDate(r.reviewedAt) })) : "") +
        "</div></div>" +
      '<span class="status-tag st-' + esc(r.status) + '">' + esc(statusText(r.status)) + "</span>" +
    "</div>" +
    compareTable(r) +
    (ood ? '<div class="ood">' + T("adm.c_ood") + '</div>' : "") +
    '<div class="why"><b>' + T("adm.c_reason") + '</b> ' + esc(r.reason) + '<br><b>' + T("adm.c_source") + '</b> ' + sourceHtml(r.source) +
      (r.reviewNote ? '<br><b>' + (r.status === "REJECTED" ? T("adm.c_why_rejected") : T("adm.c_note")) + "</b> " + esc(r.reviewNote) : "") + "</div>";
  if (pending && approver && !own) {
    html += '<div class="req-actions">' +
      (ood ? "" : '<button class="primary approve-one" data-id="' + esc(r.id) + '">' + T("adm.c_approve") + '</button>') +
      '<button class="danger reject-open" data-id="' + esc(r.id) + '">' + T("adm.c_reject") + '</button>' +
      '<div class="reject-box" id="rb-' + esc(r.id) + '"><label for="note-' + esc(r.id) + '">' + T("adm.c_reject_label") + '</label>' +
        '<textarea id="note-' + esc(r.id) + '" maxlength="500"></textarea>' +
        '<div class="req-actions"><button class="danger reject-send" data-id="' + esc(r.id) + '">' + T("adm.c_reject_send") + '</button></div></div>' +
    "</div>";
  } else if (pending && approver && own) {
    html += '<div class="req-meta">' + T("adm.c_own_note") + '</div>';
  } else if (pending && !approver && state.data.canRequest) {
    html += '<div class="req-actions"><button class="withdraw" data-id="' + esc(r.id) + '">' + T("adm.c_withdraw") + '</button></div>';
  }
  html += '<div class="row-msg" id="msg-' + esc(r.id) + '" role="status" aria-live="polite"></div></div>';
  return html;
}

function setRowMsg(id, msg, type) {
  var el = document.getElementById("msg-" + id);
  if (el) { el.textContent = msg; el.className = "row-msg " + (type || ""); }
}
function setSummary(msg, type) {
  var el = document.getElementById("summary");
  el.textContent = msg || ""; el.className = type || "";
}

function render() {
  var d = state.data;
  var approver = d.canApprove;
  // The auditor sees every request and decision, read-only.
  var viewer = approver || d.canView;
  document.getElementById("page-title").textContent = viewer ? T("adm.c_title") : T("adm.c_title_own");
  document.getElementById("page-sub").textContent = approver ? T("adm.c_sub") : viewer ? T("adm.c_sub_view") : T("adm.c_sub_own");
  var tb = document.getElementById("toolbar");
  if (viewer) {
    tb.hidden = false;
    tb.innerHTML = '<div class="tabs" role="group" aria-label="' + esc(T("adm.c_show")) + '">' +
        '<button id="tab-pending" aria-pressed="' + (state.view === "pending") + '">' + esc(T("adm.c_tab_waiting", { n: d.pendingCount })) + "</button>" +
        '<button id="tab-decided" aria-pressed="' + (state.view === "decided") + '">' + T("adm.c_tab_decided") + '</button></div>' +
      (approver && state.view === "pending" && d.requests.length ? '<label class="muted"><input type="checkbox" id="pick-all"> ' + T("adm.c_select_all") + '</label>' +
        '<button class="primary" id="approve-picked">' + T("adm.c_approve_selected") + '</button>' : "");
    document.getElementById("tab-pending").onclick = function () { state.view = "pending"; setSummary(""); load(); };
    document.getElementById("tab-decided").onclick = function () { state.view = "decided"; setSummary(""); load(); };
  } else {
    tb.hidden = true;
  }
  var list = document.getElementById("list");
  if (!d.requests.length) {
    list.innerHTML = '<p class="empty">' + (viewer ? (state.view === "pending" ? T("adm.c_empty_pending") : T("adm.c_empty_decided")) : T("adm.c_empty_own")) + "</p>";
    return;
  }
  list.innerHTML = d.requests.map(function (r) { return renderCard(r, approver, viewer); }).join("");
  wire();
}

async function post(body) {
  var res = await fetch("/api/admin/change-requests", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  var data = await res.json().catch(function () { return {}; });
  return { ok: res.ok, data: data };
}

function resultText(r) {
  var k = { rejected: "adm.c_res_rejected", already_decided: "adm.c_res_decided", own_request: "adm.c_res_own" }[r];
  return k ? T(k) : r;
}

async function approve(ids) {
  setSummary(T("adm.c_approving", { n: ids.length }), "");
  try {
    var r = await post({ action: "approve", ids: ids });
    if (!r.ok) { setSummary(r.data.error === "INSUFFICIENT_ROLE" ? T("adm.c_err_role") : (r.data.error || T("adm.c_err_failed")), "error"); return; }
    var counts = {};
    r.data.results.forEach(function (x) { counts[x.result] = (counts[x.result] || 0) + 1; });
    var parts = [];
    if (counts.approved) parts.push(T("adm.c_r_approved", { n: counts.approved }));
    if (counts.out_of_date) parts.push(T("adm.c_r_ood", { n: counts.out_of_date }));
    if (counts.invalid) parts.push(T("adm.c_r_invalid", { n: counts.invalid }));
    if (counts.already_decided) parts.push(T("adm.c_r_decided", { n: counts.already_decided }));
    if (counts.own_request) parts.push(T("adm.c_r_own", { n: counts.own_request }));
    var fails = r.data.results.filter(function (x) { return x.result !== "approved"; });
    await load();
    setSummary(parts.join(", ") + (isHi() ? "।" : ".") + (fails.length && fails[0].error ? " " + fails[0].error : ""), counts.approved === ids.length ? "success" : "error");
  } catch (e) { setSummary(T("adm.c_err_network_approve"), "error"); }
}

function wire() {
  document.querySelectorAll(".approve-one").forEach(function (b) { b.onclick = function () { approve([b.dataset.id]); }; });
  document.querySelectorAll(".reject-open").forEach(function (b) {
    b.onclick = function () { var box = document.getElementById("rb-" + b.dataset.id); box.classList.add("open"); document.getElementById("note-" + b.dataset.id).focus(); };
  });
  document.querySelectorAll(".reject-send").forEach(function (b) {
    b.onclick = async function () {
      var id = b.dataset.id, note = document.getElementById("note-" + id).value.trim();
      if (note.length < 3) { setRowMsg(id, T("adm.c_need_note"), "error"); document.getElementById("note-" + id).focus(); return; }
      b.disabled = true;
      try {
        var r = await post({ action: "reject", ids: [id], note: note });
        if (!r.ok) { setRowMsg(id, r.data.error || T("adm.c_err_failed"), "error"); b.disabled = false; return; }
        var res = r.data.results[0];
        await load();
        setSummary(resultText(res.result), res.result === "rejected" ? "success" : "error");
      } catch (e) { setRowMsg(id, T("adm.c_err_network"), "error"); b.disabled = false; }
    };
  });
  document.querySelectorAll(".withdraw").forEach(function (b) {
    b.onclick = async function () {
      var id = b.dataset.id;
      if (!confirm(T("adm.c_withdraw_confirm"))) return;
      b.disabled = true;
      try {
        var r = await post({ action: "withdraw", id: id });
        if (!r.ok) { setRowMsg(id, r.data.error || T("adm.c_err_failed"), "error"); b.disabled = false; return; }
        await load(); setSummary(T("adm.c_withdrawn_ok"), "success");
      } catch (e) { setRowMsg(id, T("adm.c_err_network"), "error"); b.disabled = false; }
    };
  });
  var all = document.getElementById("pick-all");
  if (all) all.onchange = function () { document.querySelectorAll(".pick").forEach(function (c) { c.checked = all.checked; }); };
  var ap = document.getElementById("approve-picked");
  if (ap) ap.onclick = function () {
    var ids = Array.prototype.map.call(document.querySelectorAll(".pick:checked"), function (c) { return c.dataset.id; });
    if (!ids.length) { setSummary(T("adm.c_tick_first"), "error"); return; }
    if (!confirm(T("adm.c_confirm_approve", { n: ids.length }))) return;
    approve(ids);
  };
}

async function load() {
  try {
    var res = await fetch("/api/admin/change-requests" + (state.view === "decided" ? "?view=decided" : ""));
    var data = await res.json();
    if (!res.ok) {
      document.getElementById("page-sub").textContent = "";
      document.getElementById("list").innerHTML = '<p class="empty">' +
        (data.error === "NOT_ADMIN" || data.error === "INSUFFICIENT_ROLE" ? T("adm.no_access") : esc(T("adm.c_err_load", { err: data.error || res.status }))) + "</p>";
      return;
    }
    if (data && data.deptNames && window.GIQ && GIQ.addDepts) GIQ.addDepts(data.deptNames);
    state.data = data;
    render();
  } catch (e) {
    document.getElementById("list").innerHTML = '<p class="empty">' + T("adm.network") + '</p>';
  }
}

function applyTheme(theme) {
  document.documentElement.classList.toggle("light-theme", theme === "light");
  document.getElementById("theme-toggle").textContent = theme === "light" ? T("adm.theme_dark") : T("adm.theme_light");
}
var savedTheme = "dark";
try { savedTheme = localStorage.getItem("griq-admin-theme") || "dark"; } catch (e) {}
applyTheme(savedTheme);
document.getElementById("theme-toggle").addEventListener("click", function () {
  var current = "dark";
  try { current = localStorage.getItem("griq-admin-theme") || "dark"; } catch (e) {}
  var next = current === "light" ? "dark" : "light";
  try { localStorage.setItem("griq-admin-theme", next); } catch (e) {}
  applyTheme(next);
});

// Switching हिन्दी / English redraws from the data already loaded.
document.addEventListener("giq:lang", function () {
  var th = "dark"; try { th = localStorage.getItem("griq-admin-theme") || "dark"; } catch (e) {}
  applyTheme(th);
  if (state.data) render();
});

load();
</script>
