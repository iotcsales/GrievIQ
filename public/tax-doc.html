<style>
  :root {
    --paper: #F6F5F1; --card: #FFFFFF; --ink: #22201C; --ink-soft: #746E63;
    --teal: #1F4A8A; --teal-dark: #13233F; --teal-tint: #E9EEF7;
    --border: #E7E4DC; --radius: 14px;
    --shadow: 0 2px 4px rgba(34,32,28,0.04), 0 8px 24px rgba(34,32,28,0.07);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased; min-height: 100vh;
  }
  .trust-strip {
    background: var(--ink); color: #C7C2B8; font-size: 11px; padding: 7px 20px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .card-shell { max-width: 560px; margin: 0 auto; padding: 20px 20px 60px; min-height: 100vh; }
  .app-card {
    background: var(--card); border-radius: 22px; box-shadow: var(--shadow);
    border: 1px solid var(--border); padding: 28px 24px 26px; margin-top: 20px;
  }
  header.brand { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  header.brand .logo-mark {
    width: 32px; height: 32px; border-radius: 9px; background: #13233F;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  header.brand .logo-mark svg { width: 24px; height: 24px; }
  header.brand span.brand-name { font-family: 'Source Serif 4', serif; font-weight: 700; font-size: 17px; }
  .back-link { display: inline-block; font-size: 12.5px; color: var(--teal-dark); text-decoration: none; margin-bottom: 16px; }
  .back-link:hover { text-decoration: underline; }
  h1 { font-family: 'Source Serif 4', serif; font-weight: 700; font-size: 23px; line-height: 1.3; margin: 18px 0 8px; }
  h2 { font-family: 'Source Serif 4', serif; font-weight: 700; font-size: 16px; margin: 24px 0 8px; }
  p { font-size: 14px; line-height: 1.65; color: var(--ink-soft); margin: 0 0 14px; }
  .note-box {
    background: var(--teal-tint); border-radius: 12px; padding: 14px 16px;
    font-size: 13px; color: var(--teal-dark); margin: 18px 0;
  }
  .footer-block { margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--border); text-align: center; }
  .footer-links { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 14px; font-size: 11.5px; color: var(--teal-dark); margin-bottom: 8px; }
  .footer-links a { color: inherit; text-decoration: none; }
  .footer-links a:hover { text-decoration: underline; }
  .footer-note { font-size: 10.5px; color: var(--ink-soft); line-height: 1.5; max-width: 340px; margin: 0 auto; }
  h3 { font-size: 14px; font-weight: 600; margin: 16px 0 6px; color: var(--ink); }
  ul.plain { margin: 0 0 14px; padding-left: 20px; }
  ul.plain li { font-size: 14px; line-height: 1.65; color: var(--ink-soft); margin: 0 0 6px; }
  p a, li a { color: var(--teal-dark); }
  .card-shell { max-width: 820px; }
  .bp-tools { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 0 0 16px; }
  .bp-btn { font: inherit; font-size: 14px; font-weight: 600; min-height: 44px; padding: 8px 18px; border-radius: 10px; border: 1px solid var(--teal); background: var(--teal); color: #fff; cursor: pointer; }
  .bp-btn:focus-visible, .bp-tools a:focus-visible { outline: 3px solid #F2B705; outline-offset: 2px; }
  .bp-doc { background: #fff; color: #1b1f24; border: 1px solid var(--border); border-radius: 12px; padding: 28px; }
  .bp-top { display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap; border-bottom: 2px solid #13233F; padding-bottom: 14px; }
  .bp-brand { display: flex; align-items: center; gap: 10px; font-family: 'Source Serif 4', serif; font-weight: 700; font-size: 22px; color: #13233F; }
  .bp-brand .iq { color: #9a6f0c; }
  .bp-kind { text-align: right; }
  .bp-kind h1 { margin: 0; font-size: 22px; color: #13233F; }
  .bp-kind .sub { font-size: 12.5px; color: #4a5360; margin-top: 4px; }
  .bp-two { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 18px 0; }
  .bp-two h2 { font-family: inherit; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: #4a5360; margin: 0 0 6px; }
  .bp-two p { color: #1b1f24; margin: 0; font-size: 14px; line-height: 1.55; }
  table.bp-t { width: 100%; border-collapse: collapse; font-size: 14px; margin: 8px 0 14px; }
  table.bp-t th, table.bp-t td { border-bottom: 1px solid #d5dae1; padding: 8px 6px; text-align: left; vertical-align: top; color: #1b1f24; }
  table.bp-t th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: #4a5360; }
  table.bp-t td.num, table.bp-t th.num { text-align: right; white-space: nowrap; }
  table.bp-t tr.total td { font-weight: 700; font-size: 15px; border-bottom: 2px solid #13233F; }
  .bp-status { display: inline-block; font-weight: 700; font-size: 13px; padding: 3px 12px; border-radius: 999px; border: 1px solid #1b1f24; }
  .bp-note { font-size: 12.5px; color: #4a5360; line-height: 1.55; margin: 6px 0 0; }
  .bp-msg { font-size: 14px; color: var(--ink); }
  .bp-tools .bp-note { color: var(--ink-soft); margin: 0; }
  @media (max-width: 560px) { .bp-two { grid-template-columns: 1fr; } .bp-kind { text-align: left; } .bp-doc { padding: 18px; } }
  @media print {
    @page { size: A4; margin: 14mm; }
    body { background: #fff !important; }
    .trust-strip, .back-link, .bp-tools, .footer-block, header.brand, .skip-link, #giq-footer, footer { display: none !important; }
    .card-shell { max-width: none; padding: 0; }
    .app-card { box-shadow: none; border: 0; padding: 0; margin: 0; }
    .bp-doc { border: 0; padding: 0; }
  }
</style>

<body>
<div class="trust-strip"><span data-i18n="common.strip">Independent citizen grievance escalation & redressal platform</span><button type="button" class="lang-toggle" data-lang-toggle lang="hi">हिन्दी</button></div>
  <div class="card-shell">
    <main class="app-card" id="main" tabindex="-1">
      <div class="bp-tools"><button type="button" class="bp-btn" id="bp-print" data-i18n="bp.print">Print or save as PDF</button><span class="bp-note" data-i18n="bp.print_h">To save a PDF, choose "Save as PDF" as the printer.</span></div>
      <div id="bp-doc" aria-live="polite"><p class="bp-msg" data-i18n="bp.loading">Loading…</p></div>
    </main>
  </div>
<script>
// grieviq-76: one GST document (tax invoice, credit note, receipt voucher,
// refund voucher) as a printable A4 page. For its payer through the
// private link in their email (?id=&k=), or for staff (?id=&src=admin).
(function () {
  "use strict";
  function T(k, v) { return window.GIQ ? window.GIQ.t(k, v) : k; }
  function hi() { return window.GIQ && window.GIQ.lang === "hi"; }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function inr(n) { return "₹" + Number(n || 0).toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function dateText(s) { if (!s) return ""; var d = new Date(s.length === 10 ? s + "T00:00:00+05:30" : s); return isNaN(d) ? s : d.toLocaleDateString(hi() ? "hi-IN" : "en-IN", { day: "numeric", month: "short", year: "numeric", timeZone: "Asia/Kolkata" }); }
  // Amount in words (Indian numbering), English.
  var ONES = ["", "one", "two", "three", "four", "five", "six", "seven", "eight", "nine", "ten", "eleven", "twelve", "thirteen", "fourteen", "fifteen", "sixteen", "seventeen", "eighteen", "nineteen"];
  var TENS = ["", "", "twenty", "thirty", "forty", "fifty", "sixty", "seventy", "eighty", "ninety"];
  function two(n) { return n < 20 ? ONES[n] : TENS[Math.floor(n / 10)] + (n % 10 ? "-" + ONES[n % 10] : ""); }
  function three(n) { return (n >= 100 ? ONES[Math.floor(n / 100)] + " hundred" + (n % 100 ? " and " : "") : "") + (n % 100 ? two(n % 100) : ""); }
  function words(n) {
    if (n === 0) return "zero";
    var out = [], cr = Math.floor(n / 1e7), l = Math.floor(n / 1e5) % 100, th = Math.floor(n / 1000) % 100, rest = n % 1000;
    if (cr) out.push(words(cr) + " crore"); if (l) out.push(two(l) + " lakh"); if (th) out.push(two(th) + " thousand"); if (rest) out.push(three(rest));
    return out.join(" ");
  }
  function inWords(x) { var r = Math.floor(x + 1e-9), p = Math.round((x - r) * 100); var s = "Rupees " + words(r) + (p ? " and " + words(p) + " paise" : "") + " only"; return s.charAt(0).toUpperCase() + s.slice(1); }
  var q = new URLSearchParams(location.search), id = q.get("id") || "", k = q.get("k") || "", src = q.get("src");
  var data = null, err = null;
  var MARK = '<svg width="40" height="40" viewBox="0 0 48 48" aria-hidden="true" focusable="false"><rect width="48" height="48" rx="11" fill="#13233F"/><g transform="translate(6 6) scale(0.75)" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M34.3 11.7A16 16 0 1 0 40 25H33"/><path d="M12.7 35.3 8 43l9.2-4.5z" fill="#fff"/><path d="M20 22l6 6 15-17" stroke="#E8B631"/></g></svg>';
  function render() {
    var box = document.getElementById("bp-doc");
    if (err) { box.innerHTML = '<p class="bp-msg" role="alert">' + esc(T(err)) + "</p>"; return; }
    if (!data) return;
    var d = data.doc, s = d.supplier || {}, ref = data.ref, kind = d.kind;
    var intra = d.cgst > 0 || d.sgst > 0, half = d.rate / 2;
    document.title = T("td.k_" + kind) + " " + d.number + " — GrievIQ";
    var rows = "<tr><td>" + esc(d.description) + (d.periodFrom ? '<br><span class="bp-note">' + esc(T("bp.period", { from: dateText(d.periodFrom), to: dateText(d.periodTo) })) + "</span>" : "") +
      '</td><td>' + esc(d.sac) + '</td><td class="num">' + esc(inr(d.taxable)) + "</td></tr>" +
      (intra ? "<tr><td>" + esc(T("td.cgst", { r: half })) + '</td><td></td><td class="num">' + esc(inr(d.cgst)) + "</td></tr><tr><td>" + esc(T("td.sgst", { r: half })) + '</td><td></td><td class="num">' + esc(inr(d.sgst)) + "</td></tr>"
        : "<tr><td>" + esc(T("td.igst", { r: d.rate })) + '</td><td></td><td class="num">' + esc(inr(d.igst)) + "</td></tr>") +
      '<tr class="total"><td colspan="2">' + esc(T("td.total")) + '</td><td class="num">' + esc(inr(d.total)) + "</td></tr>";
    box.innerHTML = '<article class="bp-doc" aria-labelledby="bp-h">' +
      '<div class="bp-top"><div class="bp-brand">' + MARK + '<span>Griev<span class="iq">IQ</span></span></div>' +
      '<div class="bp-kind"><h1 id="bp-h">' + esc(T("td.k_" + kind)) + '</h1><div class="sub">' + esc(T("td.no")) + " <b>" + esc(d.number) + "</b> · " + esc(dateText(d.date)) + "</div>" +
        (kind === "INVOICE" && !d.b2b ? '<div class="sub">' + esc(T("td.b2c")) + "</div>" : "") + "</div></div>" +
      '<div class="bp-two"><div><h2>' + esc(T("td.supplier")) + "</h2><p><b>" + esc(s.legalName) + "</b><br>" + esc(s.address || "") + "<br>" + esc(T("bp.gstin")) + " " + esc(s.gstin || "") + "</p></div>" +
      "<div><h2>" + esc(T("td.recipient")) + "</h2><p><b>" + esc(d.partyName) + "</b><br>" + (d.partyGstin ? esc(T("bp.gstin")) + " " + esc(d.partyGstin) : esc(T("td.unregistered"))) +
        "<br>" + esc(T("td.state")) + " " + esc((d.partyStateName || "") + (d.partyState ? " (" + d.partyState + ")" : "")) + "</p></div></div>" +
      '<div class="bp-two"><div><h2>' + esc(T("td.place")) + "</h2><p>" + esc(d.placeName + " (" + d.placeCode + ")") + "<br>" + esc(T("td.rcm")) + "</p></div>" +
      "<div><h2>" + esc(T(ref ? "td.against" : "td.date")) + "</h2><p>" + (ref ? esc(T("td.k_" + ref.kind)) + " " + esc(ref.number) + " · " + esc(dateText(ref.date)) : esc(dateText(d.date))) +
        (d.reason ? "<br>" + esc(T("td.reason")) + " " + esc(d.reason) : "") + "</p></div></div>" +
      '<table class="bp-t"><caption class="bp-note" style="text-align:left;caption-side:top">' + esc(T("td.cap")) + '</caption><thead><tr><th scope="col">' + esc(T("bp.desc")) + '</th><th scope="col">' + esc(T("td.sac")) + '</th><th scope="col" class="num">' + esc(T("bp.amount")) + "</th></tr></thead><tbody>" + rows + "</tbody></table>" +
      '<p class="bp-note"><b>' + esc(T("td.words")) + "</b> " + esc(inWords(d.total)) + "</p>" +
      (kind === "RECEIPT_VOUCHER" ? '<p class="bp-note">' + esc(T("td.rv_note")) + "</p>" : "") +
      (kind === "REFUND_VOUCHER" ? '<p class="bp-note">' + esc(T("td.rf_note")) + "</p>" : "") +
      '<p class="bp-note">' + esc(T("td.esign")) + "</p></article>";
  }
  function fail(key) { err = key; render(); }
  var url = src === "admin" ? "/api/admin/accounts?doc=" + encodeURIComponent(id) : "/api/tax-doc?id=" + encodeURIComponent(id) + "&k=" + encodeURIComponent(k);
  if (!id || (src !== "admin" && !k)) fail("td.e_link");
  else fetch(url, { cache: "no-store" }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); }).then(function (x) {
    if (!x.ok) return fail(x.j && x.j.error === "NOT_FOUND" ? "td.e_none" : "bp.e_access");
    data = { doc: x.j.doc, ref: x.j.ref ? { number: x.j.ref.number, date: x.j.ref.date, kind: x.j.ref.kind } : null };
    try { history.replaceState(null, "", location.pathname + (src === "admin" ? "?id=" + encodeURIComponent(id) + "&src=admin" : location.search)); } catch (e) {}
    render();
  }).catch(function () { fail("bp.e_load"); });
  document.getElementById("bp-print").addEventListener("click", function () { window.print(); });
  document.addEventListener("giq:lang", render);
})();
</script>
