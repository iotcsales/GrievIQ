<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
<meta name="theme-color" content="#13233F">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/theme.css?v=22">
<script src="/theme.js?v=22"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="dd.page_title">Department dashboard — GrievIQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Department dashboard (grieviq-32). Same colours as the citizen pages, so
     theme.css gives the dark version (WCAG 2.2 AA in both). */
  :root {
    --paper: #F6F5F1; --card: #FFFFFF; --ink: #22201C; --ink-soft: #69635A; --teal: #1F4A8A; --teal-dark: #13233F; --teal-tint: #E9EEF7;
    --brick: #B3362A; --brick-dim: #FBE8E5; --grey-line: #D8D3C6; --border: #E7E4DC; --green: #1E6B3E; --gold: #7A5A12; --gold-tint: #FBF1D6;
    --link: #1F4A8A;
  }
  /* Links: 4.5:1 in dark mode too (theme.css darkens --teal for buttons). */
  :root[data-theme="dark"] { --link: #A9C6F2; }
  @media screen and (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --link: #A9C6F2; } }
  a { color: var(--link); }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: 'Inter', system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }
  html[lang='hi'] body { font-family: 'Noto Sans Devanagari', 'Inter', system-ui, sans-serif; }
  .trust-strip { background: var(--teal-dark); color: #E3E0D8; font-size: 12px; padding: 7px 16px; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .lang-toggle { background: none; border: 1px solid rgba(255,255,255,.45); color: #fff; border-radius: 6px; font: inherit; font-size: 12.5px; padding: 4px 10px; min-height: 30px; cursor: pointer; }
  .shell { max-width: 960px; margin: 0 auto; padding: 18px 16px 60px; }
  header.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .brand { display: flex; align-items: center; gap: 10px; font-family: 'Source Serif 4', Georgia, serif; font-weight: 700; font-size: 20px; color: var(--teal-dark); }
  .brand small { display: block; font-family: 'Inter', sans-serif; font-weight: 500; font-size: 12.5px; color: var(--ink-soft); }
  .mark { width: 34px; height: 34px; border-radius: 9px; background: #13233F; display: inline-flex; align-items: center; justify-content: center; flex: none; }
  .who { font-size: 13px; color: var(--ink-soft); text-align: right; }
  .who b { color: var(--ink); }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-bottom: 14px; }
  h1 { font-family: 'Source Serif 4', Georgia, serif; font-size: 24px; margin: 0 0 6px; color: var(--teal-dark); }
  h2 { font-size: 17px; margin: 0 0 10px; }
  h3 { font-size: 15px; margin: 16px 0 8px; }
  p { line-height: 1.5; }
  .lede { color: var(--ink-soft); margin: 0 0 14px; font-size: 14.5px; }
  label { display: block; font-weight: 600; font-size: 14px; margin: 12px 0 4px; }
  input[type=email], input[type=text], input[type=date], select, textarea { width: 100%; max-width: 480px; font: inherit; font-size: 16px; padding: 10px 12px; border: 1.5px solid var(--grey-line); border-radius: 10px; background: var(--card); color: var(--ink); }
  textarea { min-height: 84px; resize: vertical; }
  [aria-invalid="true"] { border-color: var(--brick) !important; }
  .hint { color: var(--ink-soft); font-size: 13px; margin: 0 0 4px; }
  .err { color: var(--brick); font-size: 13.5px; font-weight: 600; margin-top: 4px; }
  .err:empty { display: none; }
  button, .btn { font: inherit; font-size: 14.5px; font-weight: 600; min-height: 44px; padding: 0 16px; border-radius: 10px; cursor: pointer; border: 1.5px solid var(--teal); background: var(--card); color: var(--teal-dark); }
  button.primary { background: var(--teal); color: #fff; border-color: var(--teal); }
  button:disabled { opacity: .6; cursor: default; }
  button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, summary:focus-visible, [tabindex]:focus-visible { outline: 3px solid #FFDD00; outline-offset: 2px; }
  .linkish { background: none; border: 0; padding: 0; min-height: 28px; color: var(--link); text-decoration: underline; font-weight: 600; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 14px; }
  .msg { padding: 10px 12px; border-radius: 10px; font-size: 14px; margin-bottom: 12px; }
  .msg.ok { background: var(--teal-tint); color: var(--teal-dark); }
  .msg.bad { background: var(--brick-dim); color: var(--brick); font-weight: 600; }
  .otp { font-size: 22px !important; letter-spacing: 6px; max-width: 220px !important; text-align: center; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin: 4px 0 16px; }
  .tile { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
  .tile .n { font-size: 26px; font-weight: 700; }
  .tile .l { font-size: 13px; color: var(--ink-soft); margin-top: 2px; }
  .tile.late .n { color: var(--brick); }
  .filters { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 10px; }
  .filters > div { min-width: 180px; flex: 1 1 180px; }
  .filters label { margin-top: 0; font-size: 13px; }
  .filters select { font-size: 15px; padding: 8px 10px; }
  .list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .case { background: var(--card); border: 1px solid var(--border); border-left: 5px solid var(--teal); border-radius: 12px; padding: 12px 14px; }
  .case.late { border-left-color: var(--brick); }
  .case.closed { border-left-color: var(--grey-line); }
  .case h3 { margin: 0 0 4px; font-size: 15.5px; }
  .case h3 a { color: var(--link); display: inline-block; min-height: 26px; padding: 2px 0; }
  .case .meta { font-size: 13px; color: var(--ink-soft); }
  .case .sum { font-size: 14px; margin: 6px 0; overflow-wrap: anywhere; }
  .pill { display: inline-block; font-size: 12.5px; font-weight: 700; padding: 2px 9px; border-radius: 999px; background: var(--teal-tint); color: var(--teal-dark); margin-right: 6px; }
  .pill.late { background: var(--brick-dim); color: var(--brick); }
  .pill.gold { background: var(--gold-tint); color: var(--gold); }
  .empty { color: var(--ink-soft); font-size: 14.5px; }
  dl.facts { display: grid; grid-template-columns: max-content 1fr; gap: 6px 14px; margin: 0; font-size: 14.5px; }
  dl.facts dt { color: var(--ink-soft); }
  dl.facts dd { margin: 0; overflow-wrap: anywhere; }
  @media (max-width: 560px) { dl.facts { grid-template-columns: 1fr; } dl.facts dd { margin-bottom: 6px; } }
  .desc { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--paper); border-radius: 10px; padding: 10px 12px; font-size: 14.5px; }
  .photos { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  .photos img { width: 104px; height: 104px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); display: block; }
  ol.steps { list-style: none; margin: 0; padding: 0 0 0 4px; border-left: 2px solid var(--grey-line); }
  ol.steps li { position: relative; padding: 2px 0 12px 16px; font-size: 14px; }
  ol.steps li::before { content: ""; position: absolute; left: -7px; top: 6px; width: 12px; height: 12px; border-radius: 50%; background: var(--teal); }
  ol.steps .w { display: block; font-size: 12.5px; color: var(--ink-soft); }
  ol.steps .n { display: block; margin-top: 2px; overflow-wrap: anywhere; }
  fieldset { border: 0; padding: 0; margin: 10px 0 0; }
  legend { font-weight: 700; font-size: 14.5px; margin-bottom: 6px; padding: 0; }
  .opt { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 8px 12px; border: 1.5px solid var(--border); border-radius: 10px; margin-bottom: 6px; font-size: 14.5px; cursor: pointer; background: var(--card); }
  .opt:has(input:checked) { border-color: var(--teal); font-weight: 700; }
  .opt input { width: 20px; height: 20px; margin: 0; accent-color: var(--teal); flex: none; }
  .state { font-weight: 700; font-size: 15px; margin: 0 0 4px; }
  .state.late { color: var(--brick); }
  .note-box { background: var(--teal-tint); border-radius: 10px; padding: 10px 12px; font-size: 13.5px; color: var(--teal-dark); margin-top: 12px; }
  .sr-only { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  footer { text-align: center; font-size: 12.5px; color: var(--ink-soft); margin-top: 28px; }
  footer a { color: var(--link); display: inline-block; min-height: 24px; padding-top: 3px; }
  [hidden] { display: none !important; }
</style>
<script src="/i18n.js?v=32"></script>
</head>
<body>
<div class="trust-strip"><span data-i18n="dd.strip">GrievIQ for government departments</span><button type="button" class="lang-toggle" data-lang-toggle lang="hi">हिन्दी</button></div>
<div class="shell">
  <header class="top">
    <div class="brand"><span class="mark" aria-hidden="true"><svg width="22" height="22" viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" focusable="false"><path d="M34.3 11.7A16 16 0 1 0 40 25H33"/><path d="M12.7 35.3 8 43l9.2-4.5z" fill="#fff"/><path d="M20 22l6 6 15-17" stroke="#E8B631"/></svg></span>
      <span>GrievIQ<small data-i18n="dd.brand_sub">Department dashboard</small></span></div>
    <div class="who" id="who" hidden></div>
  </header>
  <main id="main" tabindex="-1"><p class="empty" data-i18n="dd.loading">Loading…</p></main>
  <footer><a href="/privacy" data-i18n="common.privacy">Privacy policy</a> · <a href="mailto:support@grieviq.in">support@grieviq.in</a></footer>
</div>
<script>
(function () {
  function T(k, v) { return window.GIQ ? GIQ.t(k, v) : k; }
  function loc() { return window.GIQ ? GIQ.locale() : "en-IN"; }
  function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;"); }
  function day(d) { if (!d) return ""; var x = new Date(String(d).length === 10 ? d + "T00:00:00+05:30" : d); return isNaN(x) ? d : x.toLocaleDateString(loc(), { day: "numeric", month: "short", year: "numeric", timeZone: "Asia/Kolkata" }); }
  function dayTime(d) { var x = new Date(d); return isNaN(x) ? "" : x.toLocaleString(loc(), { day: "numeric", month: "short", hour: "numeric", minute: "2-digit", timeZone: "Asia/Kolkata" }); }
  function dept(k) { return window.GIQ ? GIQ.dept(k) : k; }
  function cat(c) { return window.GIQ ? GIQ.category(c.id, c.name) : c.name; }
  async function api(url, opts) {
    try { var r = await fetch(url, Object.assign({ credentials: "same-origin", cache: "no-store" }, opts || {})); var b = await r.json().catch(function () { return {}; }); return { ok: r.ok, status: r.status, body: b }; }
    catch (e) { return { ok: false, status: 0, body: {} }; }
  }
  var main = document.getElementById("main");
  var S = { screen: "loading", email: "", emailErr: "", codeErr: "", msg: null, busy: false, data: null, filter: { ward: "", type: "", show: "OPEN" }, kase: null, reply: null };

  function today() { return new Date(Date.now() + 5.5 * 3600000).toISOString().slice(0, 10); }
  function setWho() {
    var w = document.getElementById("who");
    if (!S.data) { w.hidden = true; return; }
    var o = S.data.office;
    w.hidden = false;
    w.innerHTML = "<b>" + esc(S.data.me.name) + "</b> · " + esc(S.data.me.designation) + "<br>" + esc(GIQ.lang === "hi" && o.nameHi ? o.nameHi : o.nameEn) +
      ' · <button type="button" class="linkish" id="sign-out">' + esc(T("dd.sign_out")) + "</button>";
    document.getElementById("sign-out").addEventListener("click", signOut);
  }
  function show(focusId) {
    setWho();
    if (S.screen === "email") main.innerHTML = renderEmail();
    else if (S.screen === "code") main.innerHTML = renderCode();
    else if (S.screen === "list") main.innerHTML = renderList();
    else if (S.screen === "case") main.innerHTML = renderCase();
    else main.innerHTML = '<p class="empty">' + esc(T("dd.loading")) + "</p>";
    wire();
    var el = focusId && document.getElementById(focusId);
    if (el) el.focus();
  }
  function msgHtml() { return S.msg ? '<div class="msg ' + (S.msg.bad ? "bad" : "ok") + '" id="msg" tabindex="-1" role="' + (S.msg.bad ? "alert" : "status") + '">' + esc(S.msg.text) + "</div>" : ""; }

  // ---------------- sign in
  function renderEmail() {
    return '<div class="card"><h1 id="h">' + esc(T("dd.signin_h")) + '</h1><p class="lede">' + esc(T("dd.signin_lede")) + "</p>" + msgHtml() +
      '<form id="f-email" novalidate><label for="email">' + esc(T("dd.email")) + '</label><p class="hint" id="email-hint">' + esc(T("dd.email_hint")) + "</p>" +
      '<input type="email" id="email" autocomplete="email" maxlength="200" value="' + esc(S.email) + '" aria-describedby="email-hint email-err"' + (S.emailErr ? ' aria-invalid="true"' : "") + ">" +
      '<div class="err" id="email-err" role="alert">' + esc(S.emailErr) + "</div>" +
      '<div class="row"><button type="submit" class="primary" id="send"' + (S.busy ? " disabled" : "") + ">" + esc(T("dd.send_code")) + "</button></div></form>" +
      '<p class="note-box">' + esc(T("dd.signin_note")) + "</p></div>";
  }
  function renderCode() {
    return '<div class="card"><h1 id="h">' + esc(T("dd.code_h")) + '</h1><p class="lede">' + esc(T("dd.code_lede", { email: S.email })) + "</p>" + msgHtml() +
      '<form id="f-code" novalidate><label for="code">' + esc(T("dd.code")) + '</label><input type="text" id="code" class="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" aria-describedby="code-err"' + (S.codeErr ? ' aria-invalid="true"' : "") + ">" +
      '<div class="err" id="code-err" role="alert">' + esc(S.codeErr) + "</div>" +
      '<div class="row"><button type="submit" class="primary" id="verify"' + (S.busy ? " disabled" : "") + ">" + esc(T("dd.sign_in")) + '</button><button type="button" id="again">' + esc(T("dd.new_code")) + '</button><button type="button" class="linkish" id="other-email">' + esc(T("dd.other_email")) + "</button></div></form></div>";
  }
  async function sendCode(ev) {
    if (ev) ev.preventDefault();
    var e = document.getElementById("email");
    if (e) S.email = e.value.trim();
    S.emailErr = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(S.email) ? "" : T("dd.e_email");
    if (S.emailErr) { show("email"); return; }
    S.busy = true; show();
    var r = await api("/api/dept/code", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email: S.email }) });
    S.busy = false;
    if (r.status === 429) { S.msg = { bad: true, text: T("dd.e_too_many", { n: r.body.minutes || 15 }) }; S.screen = S.screen === "code" ? "code" : "email"; show("msg"); return; }
    if (!r.ok) { S.msg = { bad: true, text: r.status === 0 ? T("dd.e_network") : r.body.error === "NOT_SET_UP" ? T("dd.e_not_set_up") : T("dd.e_generic") }; show("msg"); return; }
    S.msg = { text: T("dd.code_sent") }; S.codeErr = ""; S.screen = "code"; show("code");
  }
  async function verify(ev) {
    ev.preventDefault();
    var code = (document.getElementById("code").value || "").replace(/\D/g, "");
    if (code.length !== 6) { S.codeErr = T("dd.e_code_format"); S.msg = null; show("code"); return; }
    S.busy = true; show();
    var r = await api("/api/dept/verify", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email: S.email, code: code }) });
    S.busy = false;
    if (!r.ok) {
      var c = r.body.error;
      S.msg = null;
      S.codeErr = r.status === 0 ? T("dd.e_network") : c === "INCORRECT" ? T("dd.e_code_wrong", { n: r.body.triesLeft }) : c === "TOO_MANY_TRIES" ? T("dd.e_code_tries") : T("dd.e_code_expired");
      show("code"); return;
    }
    S.msg = null; await loadList("h");
  }
  async function signOut() {
    await api("/api/dept/signout", { method: "POST" });
    S.data = null; S.kase = null; S.reply = null; S.screen = "email"; S.msg = { text: T("dd.signed_out") }; history.replaceState(null, "", location.pathname); show("msg");
  }

  // ---------------- list
  async function loadList(focusId) {
    var r = await api("/api/dept/cases");
    if (r.status === 401) { S.data = null; S.screen = "email"; show(focusId === "h" ? "email" : null); return; }
    if (!r.ok) { S.screen = "email"; S.msg = { bad: true, text: r.status === 0 ? T("dd.e_network") : T("dd.e_generic") }; show("msg"); return; }
    S.data = r.body;
    if (GIQ.addDepts && S.data.deptNames) GIQ.addDepts(S.data.deptNames);
    var m = /#case=([^&]+)/.exec(location.hash);
    if (m) { await openCase(decodeURIComponent(m[1])); return; }
    S.screen = "list"; show(focusId || null);
  }
  function stateLine(st, bucket) {
    if (bucket === "CLOSED") return { t: T("dd.s_closed"), cls: "" };
    if (st.phase === "NEEDS_CHECK") return { t: T("dd.s_waiting_check"), cls: "gold" };
    if (st.phase === "CANT_DO") return { t: T("dd.s_cant_do"), cls: "" };
    if (st.phase === "NEEDS_FORWARD") return { t: T("dd.s_not_ours"), cls: "" };
    if (st.overdue) return { t: T("dd.s_overdue", { n: st.overdueDays }), cls: "late" };
    return { t: T("dd.s_day", { day: Math.min(st.dayOf || 1, st.days || 7), days: st.days || 7 }) + (st.expectedDate ? " · " + T("dd.s_date", { date: day(st.expectedDate) }) : ""), cls: "" };
  }
  function renderList() {
    var d = S.data, t = d.tiles, f = S.filter;
    var tile = function (n, l, late) { return '<div class="tile' + (late && n ? " late" : "") + '"><div class="n">' + n + '</div><div class="l">' + esc(l) + "</div></div>"; };
    var wards = {}, types = {};
    d.cases.forEach(function (c) { wards[c.ward.id] = c.ward.name; types[c.category.id] = cat(c.category); });
    var opt = function (map, cur) { return Object.keys(map).sort(function (a, b) { return String(map[a]).localeCompare(String(map[b])); }).map(function (k) { return '<option value="' + esc(k) + '"' + (k === cur ? " selected" : "") + ">" + esc(map[k]) + "</option>"; }).join(""); };
    var rows = d.cases.filter(function (c) {
      if (f.ward && c.ward.id !== f.ward) return false;
      if (f.type && c.category.id !== f.type) return false;
      if (f.show === "OPEN" && c.bucket === "CLOSED") return false;
      if (f.show === "CLOSED" && c.bucket !== "CLOSED") return false;
      return true;
    });
    var BK = { NEW: "dd.b_new", SENT_BACK: "dd.b_sent_back", WITH_US: "dd.b_with_us", WAITING_CHECK: "dd.b_waiting_check", OTHER: "dd.b_other", CLOSED: "dd.b_closed" };
    var list = rows.length ? '<ul class="list">' + rows.map(function (c) {
      var s = stateLine(c.state, c.bucket);
      return '<li class="case' + (c.state.overdue && c.bucket !== "CLOSED" ? " late" : "") + (c.bucket === "CLOSED" ? " closed" : "") + '"><h3><a href="#case=' + encodeURIComponent(c.id) + '" data-open="' + esc(c.id) + '">' + esc(c.trackingRef) + "</a> · " + esc(cat(c.category)) + "</h3>" +
        '<div class="meta">' + esc(c.ward.name) + " · " + esc(T("dd.forwarded_on", { date: day(c.forwardedAt) })) + "</div>" +
        (c.summary ? '<p class="sum">' + esc(c.summary) + (c.summary.length >= 160 ? "…" : "") + "</p>" : "") +
        '<span class="pill' + (s.cls ? " " + s.cls : "") + '">' + esc(T(BK[c.bucket])) + "</span><span class=\"meta\">" + esc(s.t) + "</span></li>";
    }).join("") + "</ul>" : '<p class="empty">' + esc(T(d.cases.length ? "dd.none_match" : "dd.none_yet")) + "</p>";
    return msgHtml() + '<h1 id="h" tabindex="-1">' + esc(T("dd.list_h")) + '</h1><p class="lede">' + esc(T("dd.list_lede")) + "</p>" +
      '<div class="tiles">' + tile(t.newCases, T("dd.t_new")) + tile(t.withUs, T("dd.t_with_us")) + tile(t.overdue, T("dd.t_overdue"), true) + tile(t.waitingCheck, T("dd.t_waiting_check")) + tile(t.sentBack, T("dd.t_sent_back"), true) + "</div>" +
      '<div class="filters"><div><label for="f-show">' + esc(T("dd.f_show")) + '</label><select id="f-show"><option value="OPEN"' + (f.show === "OPEN" ? " selected" : "") + ">" + esc(T("dd.f_open")) + '</option><option value="CLOSED"' + (f.show === "CLOSED" ? " selected" : "") + ">" + esc(T("dd.f_closed")) + '</option><option value="ALL"' + (f.show === "ALL" ? " selected" : "") + ">" + esc(T("dd.f_all")) + "</option></select></div>" +
      '<div><label for="f-ward">' + esc(T("dd.f_ward")) + '</label><select id="f-ward"><option value="">' + esc(T("dd.f_any")) + "</option>" + opt(wards, f.ward) + "</select></div>" +
      '<div><label for="f-type">' + esc(T("dd.f_type")) + '</label><select id="f-type"><option value="">' + esc(T("dd.f_any")) + "</option>" + opt(types, f.type) + "</select></div></div>" +
      '<h2 id="count" aria-live="polite">' + esc(T("dd.count", { n: rows.length })) + "</h2>" + list;
  }

  // ---------------- one case
  async function openCase(id, focusId) {
    var r = await api("/api/dept/case?id=" + encodeURIComponent(id));
    if (r.status === 401) { S.screen = "email"; show(); return; }
    if (!r.ok) { S.screen = "list"; S.msg = { bad: true, text: r.status === 404 ? T("dd.e_case_gone") : T("dd.e_generic") }; history.replaceState(null, "", location.pathname); show("msg"); return; }
    S.kase = r.body.case;
    if (!S.reply || S.reply.id !== id) S.reply = { id: id, kind: "", date: "", sugg: "", note: "", photos: [], errors: {}, busy: false };
    S.screen = "case";
    if (location.hash !== "#case=" + encodeURIComponent(id)) history.pushState(null, "", "#case=" + encodeURIComponent(id));
    show(focusId || "case-h");
  }
  function stepText(s) {
    var who = s.officeName || dept(s.department);
    var v = { who: who, date: day(s.expectedDate), ch: s.channel ? T("rep.ch_" + s.channel) : "", sugg: s.suggestedDepartment ? dept(s.suggestedDepartment) : "" };
    var t = T("rep.ds_k_" + s.kind, v);
    if (s.kind === "NOT_OURS" && s.suggestedDepartment) t += " " + T("rep.ds_k_sugg", v);
    return t;
  }
  function renderCase() {
    var c = S.kase, r = S.reply, e = r.errors || {}, st = c.state;
    var s = stateLine(st, c.status === "OPEN" || c.status === "ACKNOWLEDGED" ? "" : "CLOSED");
    var photos = c.photos && c.photos.length ? '<div class="photos">' + c.photos.map(function (p, i) { return p.thumbUrl ? '<a href="' + esc(p.url || p.thumbUrl) + '" target="_blank" rel="noopener noreferrer"><img src="' + esc(p.thumbUrl) + '" alt="' + esc(T("dd.photo_alt", { n: i + 1 })) + '" loading="lazy"></a>' : ""; }).join("") + "</div>" : '<span class="empty">' + esc(T("dd.no_photos")) + "</span>";
    var map = c.pin ? '<a href="https://www.google.com/maps?q=' + c.pin.lat + "," + c.pin.lng + '" target="_blank" rel="noopener noreferrer">' + esc(T("dd.open_map")) + '<span class="sr-only"> ' + esc(T("dd.new_tab")) + "</span></a>" : esc(T("dd.no_pin"));
    var steps = '<ol class="steps">' + c.steps.map(function (x) {
      var by = x.by === "DEPARTMENT" ? T("dd.by_officer", { name: x.byName || "" }) : T("dd.by_office");
      var ph = (x.photos || []).length ? '<div class="photos">' + x.photos.map(function (p, i) { return p.thumbUrl ? '<a href="' + esc(p.url || p.thumbUrl) + '" target="_blank" rel="noopener noreferrer"><img src="' + esc(p.thumbUrl) + '" alt="' + esc(T("dd.work_photo_alt", { n: i + 1 })) + '" loading="lazy"></a>' : ""; }).join("") + "</div>" : "";
      return "<li>" + esc(stepText(x)) + '<span class="w">' + esc(dayTime(x.at) + " · " + by) + "</span>" + (x.note ? '<span class="n">' + esc(x.note) + "</span>" : "") + ph + "</li>";
    }).join("") + "</ol>";
    var form = "";
    if (c.canReply) {
      var kinds = ["SCHEDULED", "IN_PROGRESS", "DONE_CLAIMED", "NOT_OURS", "CANT_DO"];
      form = '<div class="card"><h2 id="reply-h">' + esc(T("dd.reply_h")) + "</h2>" + (S.msg && S.screen === "case" ? msgHtml() : "") +
        '<form id="f-reply" novalidate><fieldset aria-describedby="kind-err"><legend>' + esc(T("dd.reply_what")) + "</legend>" +
        kinds.map(function (k) { return '<label class="opt"><input type="radio" name="kind" value="' + k + '"' + (r.kind === k ? " checked" : "") + "> " + esc(T("dd.k_" + k)) + "</label>"; }).join("") +
        '<div class="err" id="kind-err" role="alert">' + esc(e.kind || "") + "</div></fieldset>" +
        (r.kind === "SCHEDULED" ? '<label for="r-date">' + esc(T("dd.r_date")) + '</label><input type="date" id="r-date" min="' + today() + '" value="' + esc(r.date) + '" aria-describedby="date-err"' + (e.date ? ' aria-invalid="true"' : "") + '><div class="err" id="date-err" role="alert">' + esc(e.date || "") + "</div>" : "") +
        (r.kind === "NOT_OURS" ? '<label for="r-sugg">' + esc(T("dd.r_sugg")) + '</label><select id="r-sugg"><option value="">' + esc(T("dd.r_sugg_none")) + "</option>" + S.data.departments.map(function (k) { return '<option value="' + esc(k) + '"' + (r.sugg === k ? " selected" : "") + ">" + esc(dept(k)) + "</option>"; }).join("") + "</select>" : "") +
        (r.kind === "DONE_CLAIMED" ? '<label for="r-photo">' + esc(T("dd.r_photos")) + '</label><p class="hint" id="photo-hint">' + esc(T("dd.r_photos_hint")) + '</p><input type="file" id="r-photo" accept="image/jpeg,image/png,image/webp" aria-describedby="photo-hint photo-err"' + (r.photos.length >= 3 ? " disabled" : "") + ">" +
          '<div class="err" id="photo-err" role="alert">' + esc(e.photos || "") + "</div>" +
          (r.photos.length ? '<div class="photos">' + r.photos.map(function (p, i) { return '<div><img src="' + esc(p.thumbUrl || p.url) + '" alt="' + esc(T("dd.work_photo_alt", { n: i + 1 })) + '"><button type="button" class="linkish" data-rm-photo="' + i + '">' + esc(T("dd.r_remove_photo")) + '<span class="sr-only"> ' + (i + 1) + "</span></button></div>"; }).join("") + "</div>" : "") : "") +
        (r.kind ? '<label for="r-note">' + esc(T(r.kind === "CANT_DO" ? "dd.r_reason" : "dd.r_note")) + '</label><p class="hint" id="note-hint">' + esc(T(r.kind === "CANT_DO" ? "dd.r_reason_hint" : "dd.r_note_hint")) + '</p><textarea id="r-note" maxlength="500" aria-describedby="note-hint note-err"' + (e.note ? ' aria-invalid="true"' : "") + ">" + esc(r.note) + '</textarea><div class="err" id="note-err" role="alert">' + esc(e.note || "") + "</div>" : "") +
        '<div class="row"><button type="submit" class="primary" id="r-send"' + (r.busy ? " disabled" : "") + ">" + esc(T("dd.r_send")) + "</button></div></form>" +
        '<p class="note-box">' + esc(T("dd.reply_note")) + "</p></div>";
    } else {
      form = '<div class="card"><p class="empty" style="margin:0">' + esc(T(c.status === "OPEN" || c.status === "ACKNOWLEDGED" ? "dd.no_reply_reforward" : "dd.no_reply_closed")) + "</p></div>";
    }
    return '<p><button type="button" class="linkish" id="back">' + esc(T("dd.back")) + "</button></p>" + (S.msg && !c.canReply ? msgHtml() : "") +
      '<div class="card"><h1 id="case-h" tabindex="-1">' + esc(c.trackingRef) + " · " + esc(cat(c.category)) + "</h1>" +
      '<p class="state' + (s.cls === "late" ? " late" : "") + '">' + esc(s.t) + "</p>" +
      '<dl class="facts"><dt>' + esc(T("dd.k_ward")) + "</dt><dd>" + esc(c.ward.name) + "</dd><dt>" + esc(T("dd.k_place")) + "</dt><dd>" + (c.locationDetail ? esc(c.locationDetail) + "<br>" : "") + map + "</dd>" +
      "<dt>" + esc(T("dd.k_filed")) + "</dt><dd>" + esc(day(c.createdAt)) + "</dd></dl>" +
      "<h3>" + esc(T("dd.k_complaint")) + "</h3>" + (c.retentionRemoved ? '<p class="empty">' + esc(T("dd.removed")) + "</p>" : '<div class="desc">' + esc(c.description) + "</div>") +
      "<h3>" + esc(T("dd.k_photos")) + "</h3>" + photos +
      '<p class="note-box">' + esc(T("dd.contact_note")) + "</p></div>" +
      form + '<div class="card"><h2>' + esc(T("dd.history_h")) + "</h2>" + steps + "</div>";
  }
  function readReply() {
    var r = S.reply;
    var k = document.querySelector('input[name="kind"]:checked'); if (k) r.kind = k.value;
    var d = document.getElementById("r-date"); if (d) r.date = d.value;
    var g = document.getElementById("r-sugg"); if (g) r.sugg = g.value;
    var n = document.getElementById("r-note"); if (n) r.note = n.value;
  }
  async function addPhoto(input) {
    var file = input.files && input.files[0];
    if (!file) return;
    var r = S.reply;
    r.errors.photos = "";
    if (file.size > 5 * 1024 * 1024) { r.errors.photos = T("dd.e_photo_big"); show("r-photo"); return; }
    var fd = new FormData(); fd.append("photo", file);
    input.disabled = true;
    var res;
    try { var x = await fetch("/api/dept/photo?id=" + encodeURIComponent(S.kase.id), { method: "POST", body: fd, credentials: "same-origin" }); res = { ok: x.ok, status: x.status, body: await x.json().catch(function () { return {}; }) }; }
    catch (e) { res = { ok: false, status: 0, body: {} }; }
    if (!res.ok) { r.errors.photos = res.status === 0 ? T("dd.e_network") : res.body.code === "BAD_TYPE" ? T("dd.e_photo_type") : res.body.code === "TOO_BIG" ? T("dd.e_photo_big") : T("dd.e_photo_failed"); show("r-photo"); return; }
    r.photos.push({ id: res.body.id, url: res.body.url, thumbUrl: res.body.thumbUrl });
    show("r-photo");
  }
  async function sendReply(ev) {
    ev.preventDefault();
    readReply();
    var r = S.reply, e = {};
    if (!r.kind) e.kind = T("dd.e_kind");
    if (r.kind === "SCHEDULED" && !r.date) e.date = T("dd.e_date");
    else if (r.kind === "SCHEDULED" && r.date < today()) e.date = T("dd.e_date_past");
    if (r.kind === "CANT_DO" && r.note.trim().length < 10) e.note = T("dd.e_reason");
    r.errors = e;
    if (Object.keys(e).length) { S.msg = null; show(e.kind ? null : e.date ? "r-date" : "r-note"); if (e.kind) { var first = document.querySelector('input[name="kind"]'); if (first) first.focus(); } return; }
    r.busy = true; show();
    var body = { id: S.kase.id, kind: r.kind, note: r.note };
    if (r.kind === "SCHEDULED") body.expectedDate = r.date;
    if (r.kind === "NOT_OURS" && r.sugg) body.suggestedDepartment = r.sugg;
    if (r.kind === "DONE_CLAIMED") body.photoIds = r.photos.map(function (p) { return p.id; });
    var res = await api("/api/dept/reply", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    r.busy = false;
    if (res.status === 401) { S.screen = "email"; show(); return; }
    if (!res.ok) {
      var f = res.body.fields || {};
      if (f.expectedDate) e.date = T(f.expectedDate === "PAST" ? "dd.e_date_past" : f.expectedDate === "TOO_FAR" ? "dd.e_date_far" : "dd.e_date");
      if (f.note) e.note = T(f.note === "REASON" ? "dd.e_reason" : "dd.e_note_long");
      if (f.photos) e.photos = T("dd.e_photo_failed");
      r.errors = e;
      S.msg = Object.keys(e).length ? null : { bad: true, text: res.status === 0 ? T("dd.e_network") : res.body.code === "CLOSED" ? T("dd.e_closed") : res.body.code === "REFORWARD" ? T("dd.no_reply_reforward") : T("dd.e_generic") };
      show(S.msg ? "msg" : e.date ? "r-date" : e.note ? "r-note" : "r-photo");
      return;
    }
    S.reply = null;
    S.msg = { text: T("dd.sent_" + body.kind) };
    var r2 = await api("/api/dept/cases"); if (r2.ok) S.data = r2.body;
    await openCase(S.kase.id, "msg");
  }

  function wire() {
    var on = function (id, ev, fn) { var el = document.getElementById(id); if (el) el.addEventListener(ev, fn); };
    on("f-email", "submit", sendCode);
    on("f-code", "submit", verify);
    on("again", "click", function () { sendCode(); });
    on("other-email", "click", function () { S.screen = "email"; S.msg = null; S.codeErr = ""; show("email"); });
    on("f-show", "change", function (e) { S.filter.show = e.target.value; show("f-show"); });
    on("f-ward", "change", function (e) { S.filter.ward = e.target.value; show("f-ward"); });
    on("f-type", "change", function (e) { S.filter.type = e.target.value; show("f-type"); });
    document.querySelectorAll("[data-open]").forEach(function (a) { a.addEventListener("click", function (e) { e.preventDefault(); S.msg = null; openCase(a.getAttribute("data-open")); }); });
    on("back", "click", backToList);
    var fr = document.getElementById("f-reply");
    if (fr) {
      fr.addEventListener("submit", sendReply);
      fr.addEventListener("change", function (e) {
        if (e.target.name === "kind") { readReply(); S.reply.errors = {}; show(); var c = document.querySelector('input[name="kind"]:checked'); if (c) c.focus(); }
        if (e.target.id === "r-photo") { readReply(); addPhoto(e.target); }
      });
      document.querySelectorAll("[data-rm-photo]").forEach(function (b) { b.addEventListener("click", function () { readReply(); S.reply.photos.splice(+b.getAttribute("data-rm-photo"), 1); show("r-photo"); }); });
    }
  }
  function backToList() {
    var id = S.kase && S.kase.id;
    S.screen = "list"; S.kase = null; S.msg = null; history.pushState(null, "", location.pathname); show();
    var a = id && document.querySelector('[data-open="' + id.replace(/"/g, "") + '"]'); if (a) a.focus(); else { var h = document.getElementById("h"); if (h) h.focus(); }
  }
  window.addEventListener("popstate", function () {
    var m = /#case=([^&]+)/.exec(location.hash);
    if (m && S.data) openCase(decodeURIComponent(m[1])); else if (S.data) { S.screen = "list"; S.kase = null; show(); }
  });
  document.addEventListener("giq:lang", function () { if (S.screen === "case") readReply(); show(); });
  loadList();
})();
</script>
</body>
</html>
