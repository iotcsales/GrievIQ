<style>
  :root {
    --paper: #F6F5F1; --card: #FFFFFF; --ink: #22201C; --ink-soft: #746E63;
    --teal: #1F4A8A; --teal-dark: #13233F; --teal-tint: #E9EEF7;
    --border: #E7E4DC; --radius: 14px;
    --shadow: 0 2px 4px rgba(34,32,28,0.04), 0 8px 24px rgba(34,32,28,0.07);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased; min-height: 100vh;
  }
  .trust-strip {
    background: var(--ink); color: #C7C2B8; font-size: 11px; padding: 7px 20px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .card-shell { max-width: 560px; margin: 0 auto; padding: 20px 20px 60px; min-height: 100vh; }
  .app-card {
    background: var(--card); border-radius: 22px; box-shadow: var(--shadow);
    border: 1px solid var(--border); padding: 28px 24px 26px; margin-top: 20px;
  }
  header.brand { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  header.brand .logo-mark {
    width: 32px; height: 32px; border-radius: 9px; background: #13233F;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  header.brand .logo-mark svg { width: 24px; height: 24px; }
  header.brand span.brand-name { font-family: 'Source Serif 4', serif; font-weight: 700; font-size: 17px; }
  .back-link { display: inline-block; font-size: 12.5px; color: var(--teal-dark); text-decoration: none; margin-bottom: 16px; }
  .back-link:hover { text-decoration: underline; }
  h1 { font-family: 'Source Serif 4', serif; font-weight: 700; font-size: 23px; line-height: 1.3; margin: 18px 0 8px; }
  h2 { font-family: 'Source Serif 4', serif; font-weight: 700; font-size: 16px; margin: 24px 0 8px; }
  p { font-size: 14px; line-height: 1.65; color: var(--ink-soft); margin: 0 0 14px; }
  .note-box {
    background: var(--teal-tint); border-radius: 12px; padding: 14px 16px;
    font-size: 13px; color: var(--teal-dark); margin: 18px 0;
  }
  .footer-block { margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--border); text-align: center; }
  .footer-links { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 14px; font-size: 11.5px; color: var(--teal-dark); margin-bottom: 8px; }
  .footer-links a { color: inherit; text-decoration: none; }
  .footer-links a:hover { text-decoration: underline; }
  .footer-note { font-size: 10.5px; color: var(--ink-soft); line-height: 1.5; max-width: 340px; margin: 0 auto; }
  h3 { font-size: 14px; font-weight: 600; margin: 16px 0 6px; color: var(--ink); }
  ul.plain { margin: 0 0 14px; padding-left: 20px; }
  ul.plain li { font-size: 14px; line-height: 1.65; color: var(--ink-soft); margin: 0 0 6px; }
  p a, li a { color: var(--teal-dark); }
  .policy-text p { white-space: pre-line; }
  .cs-box { border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin: 14px 0; }
  .cs-box p { color: var(--ink); }
  .cs-q { font-weight: 700; font-size: 15px; color: var(--ink); }
  .cs-acts { display: flex; flex-wrap: wrap; gap: 10px; margin: 14px 0; }
  .cs-acts button { min-height: 44px; padding: 10px 18px; border-radius: 10px; font: 600 15px/1.2 'Inter', system-ui, sans-serif; cursor: pointer; }
  .cs-yes { background: var(--teal); color: #fff; border: 2px solid var(--teal); }
  .cs-no { background: transparent; color: var(--teal-dark); border: 2px solid var(--teal); }
  .cs-acts button[disabled] { opacity: .65; }
  .cs-msg { border-left: 4px solid var(--teal); background: var(--teal-tint); border-radius: 8px; padding: 10px 14px; color: var(--ink); }
  .cs-msg.bad { border-left-color: var(--brick, #A5301F); }
  .footer-links a { display: inline-flex; align-items: center; min-height: 24px; }
  @media (max-width: 480px) { .cs-acts button { width: 100%; } }
</style>

<body>
  <div class="trust-strip"><span data-i18n="common.strip">Independent citizen grievance escalation & redressal platform</span><button type="button" class="lang-toggle" data-lang-toggle lang="hi">हिन्दी</button></div>
  <div class="card-shell">
    <main class="app-card" id="main" tabindex="-1">
      <header class="brand">
        <div class="logo-mark"><svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M34.3 11.7A16 16 0 1 0 40 25H33"/><path d="M12.7 35.3 8 43l9.2-4.5z" fill="#fff"/><path d="M20 22l6 6 15-17" stroke="#E8B631"/></svg></div>
        <span class="brand-text"><span class="brand-name">GrievIQ</span><span class="brand-tag" data-i18n="common.tagline">From complaint to resolution.</span></span>
      </header>
      <h1 data-i18n="cs.title">Did you ask for this complaint?</h1>
      <div id="cs-app" aria-live="polite"><p data-i18n="rf.loading">Loading…</p></div>
      <div class="footer-block">
        <div class="footer-links"></div>
        <div class="footer-note" data-i18n="common.footer_note">An independent civic-tech platform helping citizens route grievances to their elected representatives' public contact details.</div>
      </div>
    </main>
  </div>
<script>
// grieviq-73: the link in the email a citizen gets when a Community helper
// files a complaint for them: "Yes, send it" or "I didn't ask for this".
(function () {
  "use strict";
  function T(k, v) { return window.GIQ ? window.GIQ.t(k, v) : k; }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function dmy(s) { try { return new Date(s).toLocaleDateString(window.GIQ ? GIQ.locale() : "en-IN", { day: "numeric", month: "short", year: "numeric", timeZone: "Asia/Kolkata" }); } catch (e) { return s; } }
  var k = new URLSearchParams(location.search).get("k") || "";
  try { history.replaceState(null, "", "/consent"); } catch (e) {}
  var S = { d: null, err: null, done: null, busy: false, msg: null };
  function render(focus) {
    var app = document.getElementById("cs-app");
    if (S.done) {
      app.innerHTML = '<p class="cs-msg" id="cs-done" tabindex="-1">' + esc(S.done.ref ? T("cs.yes_done", { ref: S.done.ref }) : T("cs.no_done")) + "</p>" +
        (S.done.ref ? '<p><a href="/status?ref=' + encodeURIComponent(S.done.ref) + '">' + esc(T("cs.track")) + "</a></p>" : "");
    } else if (S.err) app.innerHTML = '<p class="cs-msg bad">' + esc(T(S.err)) + "</p>";
    else if (S.d) {
      var d = S.d;
      app.innerHTML = "<p>" + esc(T("cs.lede", { ref: d.helperRef, date: dmy(d.filedAt) })) + '</p><div class="cs-box"><p><b>' + esc(window.GIQ && GIQ.dept ? d.category : d.category) + "</b> · " + esc(d.unit) + "</p><p>" + esc(d.description) + "</p>" +
        (d.place ? '<p style="color:var(--ink-soft)">' + esc(d.place) + "</p>" : "") + '</div><p class="cs-q" id="cs-q" tabindex="-1">' + esc(T("cs.q")) + '</p><div class="cs-acts"><button type="button" class="cs-yes" data-a="YES"' + (S.busy ? " disabled" : "") + ">" + esc(T("cs.yes")) + '</button><button type="button" class="cs-no" data-a="NO"' + (S.busy ? " disabled" : "") + ">" + esc(T("cs.no")) + "</button></div>" +
        '<p style="color:var(--ink-soft)">' + esc(T("cs.note")) + "</p>" + (S.msg ? '<p class="cs-msg bad" role="alert">' + esc(S.msg) + "</p>" : "");
    }
    if (focus) { var el = document.getElementById(focus); if (el) el.focus(); }
  }
  if (!/^[A-Za-z0-9_-]{20,60}$/.test(k)) { S.err = "cs.gone"; render(); }
  else fetch("/api/helper-consent?k=" + encodeURIComponent(k), { cache: "no-store" }).then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
    .then(function (d) { S.d = d; render(); }, function () { S.err = "cs.gone"; render(); });
  document.addEventListener("click", function (e) {
    var b = e.target.closest("[data-a]"); if (!b || S.busy) return;
    S.busy = true; S.msg = null; render();
    fetch("/api/helper-consent", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ k: k, answer: b.getAttribute("data-a") }) })
      .then(function (r) { return r.json().then(function (j) { return { r: r, j: j }; }); })
      .then(function (x) { S.busy = false; if (x.r.ok) { S.done = { ref: x.j.trackingRef || null }; render("cs-done"); } else if (x.r.status === 404) { S.d = null; S.err = "cs.gone"; render(); } else { S.msg = T("common.generic_error"); render("cs-q"); } })
      .catch(function () { S.busy = false; S.msg = T("common.network_error"); render("cs-q"); });
  });
  document.addEventListener("giq:lang", function () { render(); });
})();
</script>
</body>
</html>
