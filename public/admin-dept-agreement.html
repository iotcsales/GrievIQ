<style>
  /* grieviq-37: the agreement for a department office to print and sign.
     A document: always dark text on white (on screen and on paper), so it
     looks the same printed; WCAG 2.2 AA contrast throughout. Both languages
     are always shown, as the signed paper must carry both. */
  :root { --ink: #1d1d1b; --soft: #4f4b45; --line: #b9b3a7; --accent: #1F4A8A; --paper: #ffffff; --bg: #ECEEF1; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: Georgia, "Times New Roman", "Noto Serif Devanagari", serif; }
  .bar { position: sticky; top: 0; z-index: 2; background: #13233F; color: #fff; padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
  .bar a { color: #fff; }
  .bar button { font: inherit; font-weight: 600; min-height: 44px; padding: 0 18px; border-radius: 8px; border: 0; background: #fff; color: #13233F; cursor: pointer; }
  .bar button:focus-visible, .bar a:focus-visible { outline: 3px solid #FFDD00; outline-offset: 2px; }
  .note { max-width: 820px; margin: 14px auto 0; padding: 10px 14px; border-radius: 8px; background: #fff7d6; color: #3d3214; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 14px; line-height: 1.5; }
  .sheet { max-width: 820px; margin: 14px auto 40px; background: var(--paper); padding: 40px 48px; box-shadow: 0 1px 4px rgba(0,0,0,.15); line-height: 1.55; font-size: 15px; }
  h1 { font-size: 22px; margin: 0 0 4px; color: var(--accent); }
  h2 { font-size: 16px; margin: 22px 0 6px; }
  .sub { color: var(--soft); font-size: 13.5px; margin: 0 0 14px; }
  p { margin: 0 0 8px; }
  .fill { display: inline-block; min-width: 180px; border-bottom: 1px solid var(--ink); }
  table { width: 100%; border-collapse: collapse; margin: 8px 0 12px; font-size: 14px; }
  th, td { border: 1px solid var(--line); padding: 8px; text-align: left; vertical-align: top; }
  th { background: #f3f1ec; }
  td.blank { height: 34px; }
  .sig td { height: 40px; }
  .hi { font-family: "Noto Serif Devanagari", "Noto Sans Devanagari", "Mangal", Georgia, serif; }
  .lang-break { page-break-before: always; break-before: page; }
  .err { max-width: 820px; margin: 30px auto; padding: 14px; background: #fff; border-left: 4px solid #B3362A; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
  @media (max-width: 600px) { .sheet { padding: 22px 16px; } .fill { min-width: 120px; } }
  @media print {
    body { background: #fff; }
    .bar, .note { display: none; }
    .sheet { box-shadow: none; margin: 0; max-width: none; padding: 0; font-size: 12pt; }
    @page { margin: 18mm 16mm; }
  }

<script>
(function () {
  "use strict";
  function T(k, v) { return window.GIQ ? GIQ.t(k, v) : k; }
  function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;"); }
  document.getElementById("print").addEventListener("click", function () { window.print(); });
  var office = new URLSearchParams(location.search).get("office") || "";
  var back = document.getElementById("back");
  back.href = "/admin-departments.html" + (office ? "?office=" + encodeURIComponent(office) : "");

  function dateEn(d) { return d.toLocaleDateString("en-IN", { day: "numeric", month: "long", year: "numeric", timeZone: "Asia/Kolkata" }); }
  function dateHi(d) { return d.toLocaleDateString("hi-IN", { day: "numeric", month: "long", year: "numeric", timeZone: "Asia/Kolkata" }); }
  var BL = '<span class="fill">&nbsp;</span>';

  function officerRows(list) {
    var rows = list.filter(function (x) { return x.status === "ACTIVE"; }).map(function (x) {
      return "<tr><td>" + esc(x.name) + "</td><td>" + esc(x.designation) + "</td><td>" + esc(x.email) + "</td><td></td></tr>";
    });
    var target = Math.max(3, rows.length + 2);   // room to add officers by hand
    while (rows.length < target) rows.push('<tr><td class="blank"></td><td></td><td></td><td></td></tr>');
    return rows.join("");
  }

  function render(d) {
    var o = d.office, now = new Date();
    var nameEn = esc(o.nameEn), nameHi = esc(o.nameHi || o.nameEn);
    var place = esc([o.address, o.areaName, o.state].filter(Boolean).join(", "));
    var court = esc(o.areaName || "Lucknow");
    var sig = '<table class="sig"><tr><th></th><th>For the Office / कार्यालय की ओर से</th><th>For IOTC / IOTC की ओर से</th></tr>' +
      ["Name / नाम", "Designation / पद", "Signature and stamp / हस्ताक्षर और मुहर", "Date / तिथि"].map(function (l) { return "<tr><th>" + l + "</th><td></td><td></td></tr>"; }).join("") + "</table>";
    var annexHead = "<tr><th>Name / नाम</th><th>Designation / पद</th><th>Official email / आधिकारिक ईमेल</th><th>Mobile (optional) / मोबाइल (वैकल्पिक)</th></tr>";
    var en =
      '<article class="sheet" lang="en"><h1>GrievIQ Department Participation Agreement</h1>' +
      '<p class="sub">Version 0.1 · Prepared on ' + esc(dateEn(now)) + " · Reference: " + BL + "</p>" +
      "<h2>1. Parties and purpose</h2><p>This agreement is between <b>" + nameEn + "</b>" + (place ? ", " + place : "") + ' ("the Office"); and <b>IOTC (Indus Overseas Tech. Corp.)</b>, ' + BL + ' ("IOTC"), which runs GrievIQ for the elected representatives who use it. Effective from ' + BL + ".</p>" +
      "<p>1.1 Citizens file complaints on GrievIQ with their elected representative's office. When a complaint is the Office's work, the representative's office forwards it to the Office on GrievIQ.</p>" +
      "<p>1.2 The Office's officers use the GrievIQ department dashboard only to see the complaints forwarded to the Office, do the work, and report what was done.</p>" +
      "<p>1.3 The Office will not use complaint details for any other purpose, including any election, political or commercial purpose.</p><p>1.4 There is no fee for the Office.</p>" +
      "<h2>2. Officers and sign-in</h2><p>2.1 Only officers named by the Office in Annexure A may use the dashboard. Each officer signs in with their own email and a one-time code. Shared or office-wide logins are not allowed.</p>" +
      "<p>2.2 The Office will tell IOTC at support@grieviq.in within <b>3 working days</b> when an officer leaves, is transferred, or should no longer have access. IOTC will remove access within <b>1 working day</b> of being told.</p>" +
      "<p>2.3 Officers must never share a sign-in code. GrievIQ never asks for it by phone, email or message. Each officer also accepts GrievIQ's \"Rules for officers\" when they first sign in.</p>" +
      "<p>2.4 GrievIQ records each case an officer opens and each reply they send. The Office and IOTC may use these records to check that access was proper.</p>" +
      "<h2>3. Confidentiality and contact with citizens</h2><p>3.1 Officers see the complaint, its ward and location, and its photos. They do not see the citizen's name, phone number or email, and will not try to find them out.</p>" +
      "<p>3.2 Officers will not copy, download, photograph, forward or publish complaint details or photos, except as needed inside the Office to do the work.</p>" +
      "<p>3.3 If an officer needs to reach the citizen, they contact the representative's office that forwarded the case. That office stays the citizen's point of contact.</p><p>3.4 These duties continue after this agreement ends.</p>" +
      "<h2>4. Security and breaches</h2><p>4.1 Officers use the dashboard only on devices with a screen lock, and sign out on shared computers.</p>" +
      "<p>4.2 If the Office suspects that complaint details were seen or shared by someone who should not have them, or that an officer's email was taken over, it tells IOTC at security@grieviq.in within <b>24 hours</b>.</p>" +
      "<p>4.3 IOTC protects the dashboard with encrypted connections, private photo links that expire, sessions that end after 60 minutes without activity, and records that cannot be altered.</p>" +
      "<p>4.4 IOTC will tell the Office within <b>24 hours</b> if a breach affects the Office's officers or the cases forwarded to it, and will report cyber incidents to CERT-In as the law requires.</p>" +
      "<h2>5. Honest replies and on-site photos</h2><p>5.1 Officers reply on each forwarded case: a date for the work, work started, work done, not this office's work, or cannot be done (with the reason).</p>" +
      "<p>5.2 Officers report \"work done\" only when the work is actually complete. Photos added as proof must be taken at the site, of that work.</p>" +
      "<p>5.3 GrievIQ records, with the officer's permission, where the phone was when each photo was added, and checks the photo's date and whether it was used before. The representative's office sees these checks.</p>" +
      "<p>5.4 The representative's team checks the work on site. Only the representative's office closes a case.</p>" +
      "<h2>6. Performance figures</h2><p>6.1 GrievIQ works out figures for the Office from its cases: cases received, first reply time, work done within the target time, fixed at the first check, and citizens' ratings.</p>" +
      "<p>6.2 These figures are shown to the Office's own officers, to the representatives' offices for their own cases, and to GrievIQ staff.</p>" +
      "<p>6.3 During the pilot, GrievIQ will not publish the figures or rank offices against each other without first telling the Office in writing.</p>" +
      "<h2>7. Records, ending the agreement, law</h2><p>7.1 The Office's replies and photos become part of the case record and are kept under GrievIQ's retention rules. The Office does not keep its own copies of complaint data.</p>" +
      "<p>7.2 Either side may end this agreement by written notice (email is enough). IOTC may suspend an officer's access at once if clause 2, 3 or 4 is broken, and will tell the Office why.</p>" +
      "<p>7.3 When the agreement ends, every officer of the Office loses access at once. Cases forwarded to the Office stay with the representatives' offices.</p>" +
      "<p>7.4 This agreement is governed by the laws of India. The courts at " + court + " have jurisdiction.</p>" +
      "<h2>Signatures</h2>" + sig +
      "<h2>Annexure A: Officers who may use the dashboard</h2><table>" + annexHead + officerRows(d.officers) + "</table>" +
      "<p>The Office updates this list by email to support@grieviq.in (clause 2.2).</p></article>";
    var hi =
      '<article class="sheet hi lang-break" lang="hi"><h1>GrievIQ विभाग सहभागिता समझौता</h1>' +
      '<p class="sub">संस्करण 0.1 · तैयार करने की तिथि ' + esc(dateHi(now)) + " · संदर्भ: " + BL + "</p>" +
      "<h2>1. पक्ष और उद्देश्य</h2><p>यह समझौता <b>" + nameHi + "</b>" + (place ? ", " + place : "") + ' ("कार्यालय") और <b>IOTC (Indus Overseas Tech. Corp.)</b>, ' + BL + ' ("IOTC") के बीच है, जो निर्वाचित जनप्रतिनिधियों के लिए GrievIQ चलाता है। प्रभावी तिथि: ' + BL + "।</p>" +
      "<p>1.1 नागरिक GrievIQ पर अपने निर्वाचित जनप्रतिनिधि के कार्यालय में शिकायत दर्ज करते हैं। जब कोई शिकायत कार्यालय के काम की होती है, तो जनप्रतिनिधि का कार्यालय उसे GrievIQ पर कार्यालय को भेजता है।</p>" +
      "<p>1.2 कार्यालय के अधिकारी GrievIQ विभाग डैशबोर्ड का उपयोग केवल कार्यालय को भेजी गई शिकायतें देखने, काम करने और किए गए काम की सूचना देने के लिए करेंगे।</p>" +
      "<p>1.3 कार्यालय शिकायत का विवरण किसी अन्य उद्देश्य के लिए उपयोग नहीं करेगा, जिसमें कोई चुनावी, राजनीतिक या व्यावसायिक उद्देश्य शामिल है।</p><p>1.4 कार्यालय से कोई शुल्क नहीं लिया जाएगा।</p>" +
      "<h2>2. अधिकारी और साइन-इन</h2><p>2.1 केवल अनुलग्नक A में कार्यालय द्वारा नामित अधिकारी डैशबोर्ड का उपयोग करेंगे। हर अधिकारी अपने ईमेल और एकबारी कोड से साइन इन करेगा। साझा या पूरे कार्यालय का एक लॉगिन अनुमत नहीं है।</p>" +
      "<p>2.2 किसी अधिकारी के जाने, स्थानांतरण या पहुँच की आवश्यकता न रहने पर कार्यालय <b>3 कार्य दिवस</b> में support@grieviq.in पर IOTC को बताएगा। सूचना मिलने के <b>1 कार्य दिवस</b> में IOTC पहुँच हटाएगा।</p>" +
      "<p>2.3 अधिकारी कभी भी साइन-इन कोड साझा नहीं करेंगे। GrievIQ कभी फ़ोन, ईमेल या संदेश से कोड नहीं माँगता। हर अधिकारी पहली बार साइन इन करते समय GrievIQ के \"अधिकारियों के लिए नियम\" भी स्वीकार करता है।</p>" +
      "<p>2.4 अधिकारी जो भी मामला खोलते हैं और जो भी उत्तर भेजते हैं, GrievIQ उसे दर्ज करता है। कार्यालय और IOTC इन अभिलेखों से जाँच सकते हैं कि पहुँच उचित थी।</p>" +
      "<h2>3. गोपनीयता और नागरिकों से संपर्क</h2><p>3.1 अधिकारी शिकायत, उसका वार्ड, स्थान और तस्वीरें देखते हैं। वे नागरिक का नाम, फ़ोन नंबर या ईमेल नहीं देखते, और उन्हें जानने का प्रयास नहीं करेंगे।</p>" +
      "<p>3.2 अधिकारी कार्यालय के भीतर काम के लिए आवश्यक सीमा के अलावा शिकायत का विवरण या तस्वीरें कॉपी, डाउनलोड, फ़ोटो, आगे या प्रकाशित नहीं करेंगे।</p>" +
      "<p>3.3 नागरिक से संपर्क की आवश्यकता होने पर अधिकारी मामला भेजने वाले जनप्रतिनिधि कार्यालय से संपर्क करेंगे। वही कार्यालय नागरिक का संपर्क-बिंदु रहता है।</p><p>3.4 ये दायित्व समझौता समाप्त होने के बाद भी लागू रहेंगे।</p>" +
      "<h2>4. सुरक्षा और उल्लंघन</h2><p>4.1 अधिकारी डैशबोर्ड का उपयोग केवल स्क्रीन-लॉक वाले उपकरण पर करेंगे और साझा कंप्यूटर पर साइन आउट करेंगे।</p>" +
      "<p>4.2 यदि कार्यालय को आशंका हो कि शिकायत का विवरण किसी अनधिकृत व्यक्ति ने देखा या साझा किया, या किसी अधिकारी का ईमेल किसी और के नियंत्रण में चला गया, तो वह <b>24 घंटे</b> में security@grieviq.in पर IOTC को बताएगा।</p>" +
      "<p>4.3 IOTC डैशबोर्ड को एन्क्रिप्टेड कनेक्शन, समय-सीमित निजी फ़ोटो लिंक, 60 मिनट निष्क्रियता पर समाप्त होने वाले सत्र और न बदले जा सकने वाले अभिलेखों से सुरक्षित रखता है।</p>" +
      "<p>4.4 कार्यालय के अधिकारियों या उसे भेजे गए मामलों को प्रभावित करने वाले उल्लंघन की सूचना IOTC <b>24 घंटे</b> में देगा, और कानून के अनुसार CERT-In को साइबर घटनाओं की रिपोर्ट करेगा।</p>" +
      "<h2>5. सच्चे उत्तर और मौके की तस्वीरें</h2><p>5.1 अधिकारी हर भेजे गए मामले पर उत्तर देंगे: काम की तिथि, काम शुरू, काम पूरा, यह इस कार्यालय का काम नहीं, या नहीं हो सकता (कारण सहित)।</p>" +
      "<p>5.2 अधिकारी \"काम पूरा\" केवल तब बताएँगे जब काम वास्तव में पूरा हो। प्रमाण की तस्वीरें मौके पर, उसी काम की ली गई होंगी।</p>" +
      "<p>5.3 GrievIQ अधिकारी की अनुमति से तस्वीर जोड़ते समय फ़ोन की लोकेशन दर्ज करता है, और तस्वीर की तिथि तथा पुनः उपयोग जाँचता है। जनप्रतिनिधि का कार्यालय ये जाँचें देखता है।</p>" +
      "<p>5.4 जनप्रतिनिधि की टीम मौके पर काम की जाँच करती है। मामला केवल जनप्रतिनिधि का कार्यालय बंद करता है।</p>" +
      "<h2>6. प्रदर्शन के आँकड़े</h2><p>6.1 GrievIQ कार्यालय के मामलों से आँकड़े बनाता है: प्राप्त मामले, पहले उत्तर का समय, समय-सीमा में काम, पहली जाँच में ठीक, और नागरिकों की रेटिंग।</p>" +
      "<p>6.2 ये आँकड़े कार्यालय के अपने अधिकारियों, जनप्रतिनिधि कार्यालयों (उनके अपने मामलों के लिए) और GrievIQ स्टाफ़ को दिखते हैं।</p>" +
      "<p>6.3 पायलट के दौरान GrievIQ कार्यालय को लिखित सूचना दिए बिना आँकड़े प्रकाशित नहीं करेगा और कार्यालयों की रैंकिंग नहीं करेगा।</p>" +
      "<h2>7. अभिलेख, समाप्ति, कानून</h2><p>7.1 कार्यालय के उत्तर और तस्वीरें मामले के अभिलेख का हिस्सा बनते हैं और GrievIQ के संग्रहण नियमों के अनुसार रखे जाते हैं। कार्यालय शिकायत डेटा की अपनी प्रतियाँ नहीं रखेगा।</p>" +
      "<p>7.2 कोई भी पक्ष लिखित सूचना (ईमेल पर्याप्त) से यह समझौता समाप्त कर सकता है। खंड 2, 3 या 4 के उल्लंघन पर IOTC कारण बताते हुए किसी अधिकारी की पहुँच तुरंत रोक सकता है।</p>" +
      "<p>7.3 समझौता समाप्त होने पर कार्यालय के सभी अधिकारियों की पहुँच तुरंत बंद हो जाती है। कार्यालय को भेजे गए मामले जनप्रतिनिधि कार्यालयों के पास रहते हैं।</p>" +
      "<p>7.4 यह समझौता भारत के कानूनों के अधीन है। " + court + " के न्यायालयों का क्षेत्राधिकार होगा।</p>" +
      "<p><i>अंग्रेज़ी और हिन्दी पाठ में अंतर होने पर अंग्रेज़ी पाठ मान्य होगा।</i></p>" +
      "<h2>हस्ताक्षर</h2>" + sig +
      "<h2>अनुलग्नक A: डैशबोर्ड का उपयोग करने वाले अधिकारी</h2><table>" + annexHead + officerRows(d.officers) + "</table>" +
      "<p>कार्यालय support@grieviq.in पर ईमेल करके यह सूची अद्यतन करता है (खंड 2.2)।</p></article>";
    document.getElementById("doc").innerHTML = en + hi;
    document.title = T("adm.ag_page_title") + " — " + o.nameEn;
  }

  fetch("/api/admin/dept-officers?office=" + encodeURIComponent(office), { credentials: "same-origin", cache: "no-store" })
    .then(function (r) { return r.json().then(function (b) { return { ok: r.ok, status: r.status, body: b }; }); })
    .then(function (r) {
      if (!r.ok) {
        document.getElementById("doc").innerHTML = '<p class="err" role="alert">' + esc(r.status === 404 ? T("adm.ag_e_office") : r.status === 403 ? T("adm.ag_e_role") : T("adm.ag_e_load")) + "</p>";
        return;
      }
      try { render(r.body); }
      catch (e) { document.getElementById("doc").innerHTML = '<p class="err" role="alert">' + esc(T("adm.ag_e_load")) + "</p>"; }
    })
    .catch(function () { document.getElementById("doc").innerHTML = '<p class="err" role="alert">' + esc(T("adm.network")) + "</p>"; });
})();
