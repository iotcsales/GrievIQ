<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Exceptions — GrievIQ Admin</title>
<script>try{if(localStorage.getItem("griq-admin-theme")==="light")document.documentElement.classList.add("light-theme");}catch(e){}</script><style>
  :root {
    --admin-bg: #14181f;
    --admin-panel: #1c222c;
    --admin-border: #2c3543;
    --admin-text: #e6e9ee;
    --admin-muted: #9aa4b2;
    --admin-accent: #4c7cf0;
    --admin-danger: #e2564f;
    --admin-danger-bg: #3a2323;
    --admin-success: #7fce8f;
    --admin-success-bg: #233a2b;
    --admin-warn: #d8c26f;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--admin-bg);
    color: var(--admin-text);
  }
  header {
    background: #0e1116;
    border-bottom: 1px solid var(--admin-border);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header .brand { font-weight: 600; font-size: 15px; letter-spacing: 0.02em; }
  header .brand span { color: var(--admin-accent); }
  nav a {
    color: var(--admin-muted);
    text-decoration: none;
    font-size: 14px;
    margin-left: 20px;
  }
  nav a.active { color: var(--admin-text); font-weight: 600; }
  main { max-width: 1150px; margin: 0 auto; padding: 32px 24px 60px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.subtitle { color: var(--admin-muted); margin: 0 0 24px; font-size: 14px; }
  .panel {
    background: var(--admin-panel);
    border: 1px solid var(--admin-border);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .filters { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; }
  .filters label { display: block; font-size: 13px; color: var(--admin-muted); margin-bottom: 6px; }
  select {
    background: #11151c;
    border: 1px solid var(--admin-border);
    color: var(--admin-text);
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 14px;
    min-width: 200px;
  }
  button {
    background: #232a36;
    border: 1px solid var(--admin-border);
    color: var(--admin-text);
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 14px;
    cursor: pointer;
  }
  button:hover { background: #2b3341; }
  .result-bar {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 14px; color: var(--admin-muted); margin: 4px 0 12px;
  }
  .result-bar b { color: var(--admin-text); }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th {
    text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--admin-muted); font-weight: 600; padding: 10px 12px;
    border-bottom: 1px solid var(--admin-border);
  }
  td { padding: 14px 12px; border-bottom: 1px solid var(--admin-border); vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  .case-ref { font-weight: 600; }
  .case-desc { color: var(--admin-muted); font-size: 13px; margin-top: 4px; line-height: 1.45; }
  .case-cat { font-size: 12px; color: var(--admin-muted); margin-top: 4px; }
  .days { font-weight: 600; white-space: nowrap; }
  .badge {
    display: inline-block; font-size: 12px; font-weight: 600;
    border: 1px solid currentColor; border-radius: 4px;
    padding: 2px 7px; margin: 0 4px 4px 0; white-space: nowrap;
  }
  .badge.ACK_OVERDUE { color: var(--admin-warn); }
  .badge.ESCALATED { color: var(--admin-danger); }
  .badge.DISPUTED { color: var(--admin-danger); }
  .badge.LEGAL_REVIEW { color: var(--admin-accent); }
  .dispute-detail { font-size: 12px; color: var(--admin-muted); margin-top: 2px; }
  .level-sub { font-size: 12px; color: var(--admin-muted); }
  .resp { font-size: 13px; line-height: 1.6; }
  .resp .role { color: var(--admin-muted); }
  .no-email { color: var(--admin-warn); font-size: 12px; }
  .nudge-info { font-size: 13px; color: var(--admin-muted); white-space: nowrap; }
  .empty, .error-msg { padding: 28px; text-align: center; font-size: 14px; color: var(--admin-muted); }
  .error-msg { color: var(--admin-danger); }
  html.light-theme {
    --admin-bg: #f4f5f7;
    --admin-panel: #ffffff;
    --admin-border: #dde1e6;
    --admin-text: #14181f;
    --admin-muted: #5b6472;
    --admin-accent: #3d6be0;
    --admin-danger: #c9463c;
    --admin-danger-bg: #fbe7e5;
    --admin-success: #2e7d45;
    --admin-success-bg: #e6f4ea;
    --admin-warn: #9a6700;
  }
  html.light-theme body { background: var(--admin-bg); color: var(--admin-text); }
  html.light-theme header { background: #ffffff; border-bottom-color: var(--admin-border); }
  html.light-theme header .brand { color: var(--admin-text); }
  html.light-theme nav a { color: var(--admin-muted); }
  html.light-theme nav a.active { color: var(--admin-text); }
  html.light-theme .panel { background: var(--admin-panel); border-color: var(--admin-border); }
  html.light-theme th, html.light-theme td { border-bottom-color: var(--admin-border); }
  html.light-theme select {
    background: #ffffff; border-color: var(--admin-border); color: var(--admin-text);
  }
  html.light-theme button { background: #eef0f3; border-color: var(--admin-border); color: var(--admin-text); }
  html.light-theme button:hover { background: #e2e5ea; }
  .theme-toggle {
    background: none; border: 1px solid var(--admin-border); border-radius: 6px;
    color: var(--admin-muted); font-size: 13px; padding: 5px 10px; cursor: pointer; margin-left: 20px;
  }
  .theme-toggle:hover { color: var(--admin-text); }
</style>
</head>
<body>

<header>
  <div class="brand">GrievIQ <span>Admin</span></div>
  <nav>
    <a href="/admin-import.html">Import</a>
    <a href="/admin-import-wards.html">Ward boundaries</a>
    <a href="/admin-jurisdiction.html">Jurisdiction</a>
    <a href="/admin-exceptions.html" class="active">Exceptions</a>
    <a href="/admin-staff.html">Staff</a> <button class="theme-toggle" id="theme-toggle">Light mode</button>
  </nav>
</header>

<main>
  <h1>Exceptions</h1>
  <p class="subtitle">Open cases across all wards that need attention: not acknowledged in time, escalated, disputed by the citizen, or awaiting legal review. Oldest first.</p>

  <div class="panel">
    <div class="filters">
      <div>
        <label for="f-issue">Issue</label>
        <select id="f-issue">
          <option value="">All issues</option>
          <option value="ACK_OVERDUE">Not acknowledged in time</option>
          <option value="ESCALATED">Escalated</option>
          <option value="DISPUTED">Citizen disputed</option>
          <option value="LEGAL_REVIEW">Legal review</option>
        </select>
      </div>
      <div>
        <label for="f-ward">Ward / village</label>
        <select id="f-ward"><option value="">All wards</option></select>
      </div>
      <div>
        <label for="f-level">Current level</label>
        <select id="f-level"><option value="">All levels</option></select>
      </div>
      <div>
        <button id="refresh-btn" type="button">Refresh</button>
      </div>
    </div>
  </div>

  <div class="result-bar">
    <span id="result-count">Loading…</span>
    <span id="updated-at"></span>
  </div>

  <div class="panel" style="padding:0;">
    <div class="table-wrap" id="table-area"></div>
  </div>
</main>

<script>
  const ISSUE_LABELS = {
    ACK_OVERDUE: "Not acknowledged in time",
    ESCALATED: "Escalated",
    DISPUTED: "Citizen disputed",
    LEGAL_REVIEW: "Legal review",
  };

  const DISPUTE_LABELS = {
    NOT_FIXED: "Not fixed",
    PARTIALLY_FIXED: "Partially fixed",
    CAME_BACK: "Problem came back",
    WRONG_ISSUE: "Wrong issue fixed",
    OTHER: "Other",
  };

  let allCases = [];

  function escapeHtml(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function toDate(s) {
    if (!s) return null;
    return s.indexOf("T") !== -1 ? new Date(s) : new Date(s.replace(" ", "T") + "Z");
  }

  function shortDate(s) {
    const d = toDate(s);
    if (!d || isNaN(d)) return "";
    return d.toLocaleDateString("en-IN", { day: "numeric", month: "short" });
  }

  function daysText(days) {
    if (days < 1) return "Under 1 day";
    const n = Math.floor(days);
    return n + (n === 1 ? " day" : " days");
  }

  function fillSelect(id, values, allLabel) {
    const sel = document.getElementById(id);
    const current = sel.value;
    sel.innerHTML = '<option value="">' + allLabel + '</option>' +
      values.map((v) => '<option value="' + escapeHtml(v) + '">' + escapeHtml(v) + '</option>').join("");
    if (values.includes(current)) sel.value = current;
  }

  function buildFilterOptions() {
    const wards = Array.from(new Set(allCases.map((c) => c.localUnit.name))).sort();
    const levels = Array.from(new Set(allCases.map((c) => c.currentTierLabel))).sort();
    fillSelect("f-ward", wards, "All wards");
    fillSelect("f-level", levels, "All levels");
  }

  function renderRow(c) {
    const badges = c.flags.map((f) =>
      '<span class="badge ' + f + '">' + escapeHtml(ISSUE_LABELS[f] || f) + '</span>'
    ).join("");

    let disputeDetail = "";
    if (c.disputeReason) {
      disputeDetail = '<div class="dispute-detail">' +
        escapeHtml(DISPUTE_LABELS[c.disputeReason] || c.disputeReason) +
        (c.disputeNote ? ' — "' + escapeHtml(c.disputeNote) + '"' : "") + '</div>';
    }

    const desc = c.description && c.description.length > 90
      ? c.description.slice(0, 90) + "…" : (c.description || "");

    const responsible = c.responsible.map((r) =>
      '<div>' + escapeHtml(r.name || ("Unnamed " + r.label)) +
      ' <span class="role">(' + escapeHtml(r.label) + ')</span>' +
      (r.hasEmail ? "" : ' <span class="no-email">· no email</span>') + '</div>'
    ).join("");

    const nudge = c.nudgeCount
      ? shortDate(c.lastNudgeAt) + (c.nudgeCount > 1 ? " (" + c.nudgeCount + " total)" : "")
      : "Never";

    return '<tr>' +
      '<td><div class="case-ref">' + escapeHtml(c.trackingRef) + '</div>' +
        '<div class="case-desc">' + escapeHtml(desc) + '</div>' +
        '<div class="case-cat">' + escapeHtml(c.category.name) + '</div></td>' +
      '<td>' + escapeHtml(c.localUnit.name) + '</td>' +
      '<td class="days">' + daysText(c.elapsedDays) + '</td>' +
      '<td>' + badges + disputeDetail + '</td>' +
      '<td>' + escapeHtml(c.currentTierLabel) +
        '<div class="level-sub">Level ' + (c.currentTierIndex + 1) + ' of ' + c.tierCount + '</div></td>' +
      '<td class="resp">' + responsible + '</td>' +
      '<td class="nudge-info">' + nudge + '</td>' +
    '</tr>';
  }

  function render() {
    const issue = document.getElementById("f-issue").value;
    const ward = document.getElementById("f-ward").value;
    const level = document.getElementById("f-level").value;

    const shown = allCases.filter((c) =>
      (!issue || c.flags.includes(issue)) &&
      (!ward || c.localUnit.name === ward) &&
      (!level || c.currentTierLabel === level)
    );

    document.getElementById("result-count").innerHTML =
      'Showing <b>' + shown.length + '</b> of <b>' + allCases.length + '</b> case' + (allCases.length === 1 ? '' : 's');

    const area = document.getElementById("table-area");
    if (allCases.length === 0) {
      area.innerHTML = '<div class="empty">No cases need attention right now.</div>';
      return;
    }
    if (shown.length === 0) {
      area.innerHTML = '<div class="empty">No cases match these filters.</div>';
      return;
    }

    area.innerHTML = '<table><thead><tr>' +
      '<th>Case</th><th>Ward / village</th><th>Open for</th><th>Issues</th>' +
      '<th>Current level</th><th>Responsible</th><th>Last nudge</th>' +
      '</tr></thead><tbody>' + shown.map(renderRow).join("") + '</tbody></table>';
  }

  async function load() {
    const area = document.getElementById("table-area");
    document.getElementById("result-count").textContent = "Loading…";
    try {
      const res = await fetch("/api/admin/exceptions");
      const data = await res.json();
      if (!res.ok) {
        let msg = data.error || "Could not load cases.";
        if (data.error === "NOT_ADMIN") msg = "Your account is not an admin.";
        if (data.error === "INSUFFICIENT_ROLE") msg = "Your role doesn't have access to the exceptions queue.";
        area.innerHTML = '<div class="error-msg">' + escapeHtml(msg) + '</div>';
        document.getElementById("result-count").textContent = "";
        return;
      }
      allCases = data.exceptions || [];
      buildFilterOptions();
      render();
      const when = toDate(data.generatedAt);
      document.getElementById("updated-at").textContent =
        when ? "Updated " + when.toLocaleTimeString("en-IN", { hour: "2-digit", minute: "2-digit" }) : "";
    } catch (err) {
      area.innerHTML = '<div class="error-msg">Could not load cases. Check your connection and press Refresh.</div>';
      document.getElementById("result-count").textContent = "";
    }
  }

  document.getElementById("f-issue").addEventListener("change", render);
  document.getElementById("f-ward").addEventListener("change", render);
  document.getElementById("f-level").addEventListener("change", render);
  document.getElementById("refresh-btn").addEventListener("click", load);

  function applyTheme(theme) {
    document.documentElement.classList.toggle("light-theme", theme === "light");
    document.getElementById("theme-toggle").textContent = theme === "light" ? "Dark mode" : "Light mode";
  }

  const savedTheme = localStorage.getItem("griq-admin-theme") || "dark";
  applyTheme(savedTheme);

  document.getElementById("theme-toggle").addEventListener("click", () => {
    const current = localStorage.getItem("griq-admin-theme") || "dark";
    const next = current === "light" ? "dark" : "light";
    localStorage.setItem("griq-admin-theme", next);
    applyTheme(next);
  });

  load();
</script>

</body>
</html>
