<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GrievIQ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<!-- GOV.UK accessible autocomplete v3.0.2, self-hosted (alphagov/accessible-autocomplete) -->
<link rel="stylesheet" href="/vendor/accessible-autocomplete/accessible-autocomplete.min.css">
<script src="/vendor/accessible-autocomplete/accessible-autocomplete.min.js"></script>
<style>
  :root {
    --ink: #14181D;
    --paper: #ECEEF1;
    --card: #FFFFFF;
    --line: #D7DBE0;
    --steel: #3A4552;
    --steel-2: #59657A;
    --red: #C23B2C;
    --red-tint: #F7E4E0;
    --green: #2F6B4F;
    --green-tint: #E4EFE8;
    --gold: #A9822E;
    --gold-tint: #F5EDDD;
    --brand: #1B5FA8;
    --brand-tint: #E8F0FA;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Public Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .console-header {
    background: var(--card);
    border-bottom: 1px solid var(--line);
    padding: 16px 24px;
  }
  .console-header-inner {
    max-width: 780px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  .console-header-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .console-icon {
    width: 32px;
    height: 32px;
    border-radius: 6px;
    background: var(--brand);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .console-title {
    font-family: 'Source Serif 4', serif;
    font-weight: 600;
    font-size: 16px;
    margin: 0;
    color: var(--ink);
  }
  .console-subtitle {
    font-size: 12.5px;
    color: var(--steel-2);
    margin: 2px 0 0;
  }
  .console-header-right {
    text-align: right;
  }
  .console-ward {
    font-weight: 700;
    font-size: 14px;
    margin: 0;
    color: var(--ink);
  }
  .console-role {
    font-size: 12.5px;
    color: var(--steel-2);
    margin: 2px 0 0;
  }
  .tab-bar {
    max-width: 780px;
    margin: 0 auto;
    padding: 0 24px;
    display: flex;
    gap: 4px;
    border-bottom: 1px solid var(--line);
    background: var(--card);
  }
  .tab-btn {
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    color: var(--steel-2);
    background: none;
    border: none;
    border-bottom: 2.5px solid transparent;
    padding: 12px 6px;
    margin-bottom: -1px;
    cursor: pointer;
  }
  .tab-btn:hover { color: var(--ink); }
  .tab-btn.active {
    color: var(--brand);
    border-bottom-color: var(--brand);
  }
  .mandate-strip {
    max-width: 780px;
    margin: 0 auto;
    padding: 12px 24px 0;
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }
  .mandate-chip {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 6px 12px;
    font-size: 13px;
    color: var(--steel);
    font-family: inherit;
    cursor: pointer;
  }
  .mandate-chip:hover { border-color: var(--brand); }
  .mandate-chip.active {
    background: var(--brand-tint);
    border-color: var(--brand);
    color: var(--brand);
  }
  .mandate-chip b { color: var(--ink); }
  .mandate-chip.active b { color: var(--brand); }
  main {
    max-width: 780px;
    margin: 0 auto;
    padding: 8px 24px 60px;
  }
  .register-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 10px;
    margin-bottom: 4px;
  }
  .register-title {
    font-family: 'Source Serif 4', serif;
    font-weight: 600;
    font-size: 19px;
    margin: 0;
  }
  .register-count {
    font-size: 13px;
    color: var(--steel-2);
  }
  .case-row {
    display: grid;
    grid-template-columns: 20px 1fr auto;
    gap: 16px;
    align-items: start;
    padding: 18px 0;
    border-bottom: 1px solid var(--line);
  }
  .signal-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    margin-top: 5px;
  }
  .signal-dot.red { background: var(--red); }
  .signal-dot.green { background: none; border: 2px solid var(--green); width: 8px; height: 8px; margin-top: 6px; }
  .signal-dot.gold { background: var(--gold); }
  .case-main .tracking-ref {
    font-weight: 600;
    font-size: 14px;
    letter-spacing: 0.02em;
  }
  .case-main .category {
    color: var(--steel-2);
    font-size: 13px;
  }
  .case-main .description {
    margin: 6px 0 0;
    font-size: 14px;
    color: var(--steel);
    line-height: 1.5;
    max-width: 46ch;
  }
  .case-main .location-detail {
    margin: 4px 0 0;
    font-size: 12.5px;
    color: var(--steel-2);
    font-style: italic;
    max-width: 46ch;
  }
  .photo-thumbs {
    display: flex;
    gap: 6px;
    margin-top: 10px;
  }
  .photo-thumb {
    width: 52px;
    height: 52px;
    border-radius: 3px;
    overflow: hidden;
    border: 1px solid var(--line);
    display: block;
  }
  .photo-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .case-meta {
    text-align: right;
    min-width: 150px;
  }
  .elapsed {
    font-size: 13px;
    color: var(--steel-2);
    margin-bottom: 8px;
  }
  .elapsed.overdue { color: var(--red); font-weight: 600; }
  .ladder {
    display: flex;
    justify-content: flex-end;
    gap: 5px;
  }
  .ladder-step {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
  }
  .ladder-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--line);
  }
  .ladder-dot.filled { background: var(--red); }
  .ladder-dot.current { background: var(--ink); }
  .ladder-label {
    font-size: 9px;
    color: var(--steel-2);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    padding: 2px 7px;
    border-radius: 3px;
    margin-top: 4px;
  }
  .badge.escalated { background: var(--red-tint); color: var(--red); }
  .badge.resolved { background: var(--green-tint); color: var(--green); font-weight: 700; font-size: 12px; padding: 4px 9px; }
  .badge.pending { background: var(--gold-tint); color: var(--gold); }
  .dispute-note {
    margin: 8px 0 0;
    padding: 8px 10px;
    background: var(--red-tint);
    border-left: 3px solid var(--red);
    font-size: 12.5px;
    color: var(--steel);
    line-height: 1.5;
    max-width: 46ch;
  }
  .dispute-note b { color: var(--red); }
  .resolve-btn {
    margin-top: 10px;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink);
    background: var(--card);
    border: 1.5px solid var(--ink);
    border-radius: 4px;
    padding: 6px 12px;
    cursor: pointer;
  }
  .resolve-btn:hover { background: var(--ink); color: var(--paper); }
  .resolve-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    background: var(--card);
    color: var(--ink);
  }
  .resolve-error {
    margin-top: 6px;
    font-size: 12px;
    color: var(--red);
  }
  .empty-state {
    padding: 60px 0;
    text-align: center;
    color: var(--steel-2);
  }
  .empty-state p { font-size: 14px; margin: 0; }
  .report-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    border-bottom: 2px solid var(--ink);
    padding-bottom: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    gap: 12px;
  }
  .report-title {
    font-family: 'Source Serif 4', serif;
    font-weight: 600;
    font-size: 19px;
    margin: 0;
  }
  .report-subtitle {
    font-size: 13px;
    color: var(--steel-2);
    margin: 3px 0 0;
  }
  .report-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .export-pdf-btn {
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    color: #fff;
    background: var(--brand);
    border: none;
    border-radius: 4px;
    padding: 8px 13px;
    cursor: pointer;
  }
  .export-pdf-btn.secondary-btn {
    background: var(--card);
    color: var(--brand);
    border: 1.5px solid var(--brand);
  }
  .export-pdf-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }
  .date-range-row {
    display: flex;
    gap: 12px;
    align-items: flex-end;
    flex-wrap: wrap;
    margin-bottom: 24px;
    padding: 12px 14px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 6px;
  }
  .date-range-row .field { display: flex; flex-direction: column; gap: 4px; }
  .date-range-row .field label { font-size: 11px; color: var(--steel-2); font-weight: 600; }
  .date-range-row .field input {
    font-family: inherit;
    font-size: 13px;
    padding: 6px 8px;
    border: 1px solid var(--line);
    border-radius: 4px;
  }
  .apply-btn {
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    color: #fff;
    background: var(--ink);
    border: none;
    border-radius: 4px;
    padding: 7px 14px;
    cursor: pointer;
  }
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 28px;
  }
  .stat-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 14px 16px;
  }
  .stat-number {
    font-family: 'Source Serif 4', serif;
    font-weight: 700;
    font-size: 24px;
    color: var(--ink);
  }
  .stat-label {
    font-size: 11.5px;
    color: var(--steel-2);
    margin-top: 3px;
  }
  .report-list-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--steel-2);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin: 0 0 8px;
  }
  .breakdown-row {
    display: flex;
    justify-content: space-between;
    padding: 6px 0;
    border-bottom: 1px solid var(--line);
    font-size: 13px;
  }
  .report-table { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 4px; }
  .report-table th, .report-table td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--line); }
  .report-table th { color: var(--steel-2); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; }
  .report-tag { display: inline-block; font-size: 10.5px; font-weight: 600; padding: 2px 6px; border-radius: 3px; }
  .report-tag.resolved { background: var(--green-tint); color: var(--green); }
  .report-tag.pending { background: var(--gold-tint); color: var(--gold); }
  .report-tag.open { background: var(--red-tint); color: var(--red); }
  .report-tag.disputed { background: var(--red-tint); color: var(--red); margin-left: 4px; }
  .footer-note {
    margin-top: 24px;
    font-size: 11.5px;
    color: var(--steel-2);
  }
  .notice {
    max-width: 520px;
    margin: 80px auto;
    padding: 0 24px;
    text-align: center;
  }
  .notice h1 {
    font-family: 'Source Serif 4', serif;
    font-size: 22px;
  }
  .notice p { color: var(--steel); font-size: 14px; line-height: 1.6; }
  /* ---- Rep console redesign (Sept 2026): viewing control, ward filter,
     time-limit states with words, labelled follow-up form, accessibility ---- */
  .visually-hidden { position: absolute !important; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
  .muted-inline { color: var(--steel-2); font-weight: 400; }
  .viewing-kicker { font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--steel-2); margin: 0 0 2px; }
  .mandate-strip-inner { display: flex; flex-wrap: wrap; gap: 10px; }
  .mandate-chip { min-height: 32px; }
  .control-box { max-width: 440px; }
  .control-label { display: block; font-size: 13px; font-weight: 600; color: var(--steel); margin-bottom: 4px; }
  .filter-box { padding-top: 14px; margin-bottom: 12px; }
  .autocomplete__wrapper { background: var(--card); }
  .autocomplete__input, .autocomplete__hint { height: 2.5rem; font-family: inherit; border: 2px solid var(--steel); }
  .autocomplete__option, .autocomplete__input { font-size: 15px !important; }
  #viewing-select, #ward-select, .followup-dept, .followup-note { font-family: inherit; font-size: 14px; min-height: 40px; padding: 6px 8px; border: 1.5px solid var(--steel); border-radius: 4px; background: var(--card); color: var(--ink); max-width: 100%; }
  .attention { color: var(--red); font-weight: 600; }
  .state-tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 3px; margin-bottom: 6px; }
  .state-tag.red { background: var(--red-tint); color: #A12F22; }
  .state-tag.green { background: var(--green-tint); color: var(--green); }
  .state-tag.gold { background: var(--gold-tint); color: #7A5C1C; }
  .state-tag.done { background: #E9ECEF; color: var(--steel); }
  .signal-dot.done { background: none; border: 2px solid var(--steel-2); width: 8px; height: 8px; margin-top: 6px; }
  .due-line { font-size: 12px; color: var(--steel-2); margin: 0 0 4px; }
  .ladder { margin-top: 6px; }
  .ladder-dot.future { background: none; border: 1.5px solid var(--line); }
  .ladder-dot.ok { background: var(--green); }
  .ladder-dot.late { background: var(--red); }
  .ladder-dot.done { background: var(--steel-2); }
  .ladder-dot.mine { outline: 2px solid var(--ink); outline-offset: 2px; }
  .followup-form { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; margin-top: 10px; }
  .followup-field label { display: block; font-size: 12px; font-weight: 600; color: var(--steel); margin-bottom: 3px; }
  .followup-form .resolve-btn { margin-top: 0; }
  .followup-dept[aria-invalid="true"] { border-color: var(--red); border-width: 2px; }
  .resolve-btn { min-height: 36px; margin-right: 8px; }
  .resolve-error:empty { display: none; }
  .table-scroll { overflow-x: auto; }
  button:focus-visible, a:focus-visible, select:focus-visible, input:focus-visible {
    outline: 3px solid #FFDD00; outline-offset: 0; box-shadow: 0 0 0 5px var(--ink);
  }
  @media (max-width: 600px) {
    .console-header { padding: 12px 16px; }
    .console-header-right { text-align: left; }
    .mandate-strip, .tab-bar, main { padding-left: 16px; padding-right: 16px; }
    .case-row { grid-template-columns: 14px 1fr; gap: 10px; }
    .signal-dot { grid-column: 1; grid-row: 1; }
    .case-meta { grid-column: 2; grid-row: 1; text-align: left; min-width: 0; }
    .case-main { grid-column: 2; grid-row: 2; }
    .ladder { justify-content: flex-start; }
    .followup-field, .followup-field select, .followup-field input { width: 100%; }
    .followup-form .resolve-btn { width: auto; }
  }
  @media print {
    .console-header, .tab-bar, .mandate-strip, .no-print, .export-pdf-btn { display: none !important; }
    body { background: white; }
  }
</style>
</head>
<body>

<div id="app"></div>

<script>
const TIER_LABELS = { LOCAL: 'Local', MAYOR: 'Mayor', MLA: 'MLA', MP: 'MP' };
const DISPUTE_REASON_LABELS = {
  NOT_FIXED: 'Citizen says: not fixed at all',
  PARTIALLY_FIXED: 'Citizen says: partially fixed',
  CAME_BACK: 'Citizen says: fixed, but came back',
  WRONG_ISSUE: 'Citizen says: wrong issue was fixed',
  OTHER: 'Citizen disputed resolution',
};
// Must match VALID_DEPARTMENTS in functions/api/grievances/[id]/add-followup.js
const DEPARTMENTS = ['Water Supply','Electricity','Sanitation / Garbage','Roads & Public Works','Health','Legal / Land Records','Other'];
const LAYERS_ICON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M12 3L3 8l9 5 9-5-9-5z" fill="white"/><path d="M3 12.5L12 17.5L21 12.5" stroke="white" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 16.5L12 21.5L21 16.5" stroke="white" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';

var activeTab = 'cases';
var activeMandateId = null;   // null = "All my areas"
var activeWardId = null;      // null = all wards in the current view
var currentMe = null;
var currentCases = [];

var reportData = null;
var reportFrom = '';
var reportTo = '';
var filterKey = '';           // which ward list the ward box was last built for

// Security (OWASP, cross-site scripting): EVERY piece of text that came from
// a citizen, a rep or the database goes through esc() before it is put into
// the page, so typed-in code is shown as text and never runs.
function esc(s) {
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function formatDate(iso) {
  if (!iso) return '';
  var d = new Date(iso);
  return d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }) +
    ', ' + d.toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit' });
}

function formatDateOnly(iso) {
  if (!iso) return '—';
  var d = new Date(iso);
  return d.toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
}

function fmtHours(h) {
  if (h === null || h === undefined) return '—';
  if (h < 24) return Math.round(h) + ' hrs';
  return Math.round((h / 24) * 10) / 10 + ' days';
}

function timeAgo(days) {
  if (days < 1) return 'Filed today';
  if (days === 1) return 'Filed 1 day ago';
  return 'Filed ' + Math.floor(days) + ' days ago';
}

function mandateIdForApi() {
  return activeMandateId === null ? 'all' : activeMandateId;
}

function hasAutocomplete() {
  return typeof window.accessibleAutocomplete !== 'undefined' &&
    typeof window.accessibleAutocomplete.enhanceSelectElement === 'function';
}

// ---- Time-limit state for one case, at this rep's own level ----
// Same rule as the citizen status page (functions/_shared/time-limits.js):
// green while within time, red once past it; gold while the citizen is
// asked to confirm; resolved cases are done. Colour is never the only
// signal (WCAG 2.2, 1.4.1) -- every state also has words.
function caseState(c) {
  if (c.status === 'RESOLVED' || c.status === 'CLOSED') return { key: 'done', text: 'Resolved' };
  if (c.status === 'PENDING_CONFIRMATION') return { key: 'gold', text: 'Awaiting citizen' };
  if (c.isLate) return { key: 'red', text: 'Past time limit' };
  return { key: 'green', text: 'Within time' };
}

function isAttention(c) {
  return c.isLate && c.status !== 'PENDING_CONFIRMATION' && c.status !== 'RESOLVED' && c.status !== 'CLOSED';
}

function renderLadder(c) {
  var isFinal = c.status === 'RESOLVED' || c.status === 'CLOSED';
  var late = c.tierLate || [];
  return '<div class="ladder" role="list" aria-label="Escalation levels">' + c.chainTierList.map(function(tier, i) {
    var reached = i <= c.currentTierIndex;
    var state, words;
    if (!reached) { state = 'future'; words = 'not reached'; }
    else if (isFinal) { state = 'done'; words = 'reached'; }
    else if (late[i]) { state = 'late'; words = 'past time limit'; }
    else { state = 'ok'; words = 'within time'; }
    var mine = tier === c.viewingAsTier;
    return '<div class="ladder-step" role="listitem"><div class="ladder-dot ' + state + (mine ? ' mine' : '') + '" aria-hidden="true"></div>' +
      '<div class="ladder-label">' + esc(TIER_LABELS[tier] || tier) + '</div>' +
      '<span class="visually-hidden">: ' + words + (mine ? ' (your level)' : '') + '</span></div>';
  }).join('') + '</div>';
}

function renderPhotoThumbs(photoUrls) {
  if (!photoUrls || photoUrls.length === 0) return '';
  return '<div class="photo-thumbs">' + photoUrls.map(function(url, i) {
    return '<a class="photo-thumb" href="' + esc(url) + '" target="_blank" rel="noopener">' +
      '<img src="' + esc(url) + '" alt="Photo ' + (i + 1) + ' attached by the citizen" loading="lazy"></a>';
  }).join('') + '</div>';
}

function renderDisputeNote(c) {
  if (!c.citizenDisputeReason) return '';
  var label = DISPUTE_REASON_LABELS[c.citizenDisputeReason] || 'Citizen disputed resolution';
  var note = c.citizenDisputeNote ? ' &mdash; "' + esc(c.citizenDisputeNote) + '"' : '';
  var when = c.citizenDisputeAt ? ' <span class="muted-inline">(' + formatDate(c.citizenDisputeAt) + ')</span>' : '';
  return '<div class="dispute-note"><b>' + esc(label) + '</b>' + when + note + '</div>';
}

function renderNudgeNote(c) {
  if (!c.adminNudges || !c.adminNudges.length) return '';
  var n = c.adminNudges[c.adminNudges.length - 1];
  var count = c.adminNudges.length > 1 ? ' &middot; ' + c.adminNudges.length + ' reminders so far' : '';
  return '<div class="dispute-note"><b>Reminder from GrievIQ admin</b> <span class="muted-inline">(' + formatDate(n.createdAt) + count + ')</span>' +
    (n.note ? ' &mdash; "' + esc(n.note) + '"' : '') + '</div>';
}

function renderResolveControl(c) {
  var isFinal = c.status === 'RESOLVED' || c.status === 'CLOSED';
  var isPending = c.status === 'PENDING_CONFIRMATION';
  if (isFinal || isPending) return '';
  // Own class (mark-resolved-btn) so ONLY this button marks a case
  // resolved -- previously every button sharing the resolve-btn style
  // (Acknowledge, Log follow-up) also triggered Mark resolved.
  return '<button type="button" class="resolve-btn mark-resolved-btn" data-id="' + esc(c.id) + '">Mark resolved</button>' +
    '<div class="resolve-error" id="resolve-error-' + esc(c.id) + '" role="alert"></div>';
}

// Department list: nothing pre-selected (GOV.UK / NHS guidance: a
// pre-selected answer is easily missed and submitted wrongly). The
// department matching the issue type, if any, is listed first and marked
// "(suggested)"; the rep must actively choose.
function renderFollowupControl(c) {
  var deptLine = c.currentDepartment
    ? '<p class="location-detail">Forwarded to: <b>' + esc(c.currentDepartment) + '</b></p>'
    : '';
  var history = (c.followupHistory || []).map(function(f) {
    var noteText = f.note ? ' — ' + esc(f.note) : '';
    return '<div class="dispute-note"><b>' + esc(f.department) + '</b>' + noteText +
      ' <span class="muted-inline">(' + formatDate(f.createdAt) + ')</span></div>';
  }).join('');
  var sugg = DEPARTMENTS.indexOf(c.suggestedDepartment) !== -1 ? c.suggestedDepartment : null;
  var ordered = sugg ? [sugg].concat(DEPARTMENTS.filter(function(d) { return d !== sugg; })) : DEPARTMENTS;
  var options = '<option value="">Choose a department</option>' + ordered.map(function(d) {
    return '<option value="' + esc(d) + '">' + esc(d) + (d === sugg ? ' (suggested)' : '') + '</option>';
  }).join('');
  var id = esc(c.id);
  return deptLine + history +
    '<div class="followup-form">' +
      '<div class="followup-field"><label for="followup-dept-' + id + '">Forward to department</label>' +
        '<select class="followup-dept" id="followup-dept-' + id + '">' + options + '</select></div>' +
      '<div class="followup-field"><label for="followup-note-' + id + '">Note (optional)</label>' +
        '<input class="followup-note" id="followup-note-' + id + '" type="text" maxlength="500" /></div>' +
      '<button type="button" class="resolve-btn followup-btn" data-id="' + id + '">Log follow-up</button>' +
    '</div>' +
    '<div class="resolve-error followup-error" id="followup-error-' + id + '" role="alert"></div>';
}

function renderAcknowledgeControl(c) {
  if (c.acknowledgedAt) {
    return '<span class="badge acknowledged">acknowledged ' + formatDate(c.acknowledgedAt) + '</span>';
  }
  var overdueNote = c.ackOverdue ? ' <span class="badge escalated">ack overdue</span>' : '';
  return '<button type="button" class="resolve-btn ack-btn" data-id="' + esc(c.id) + '">Acknowledge</button>' +
    '<div class="resolve-error ack-error" id="ack-error-' + esc(c.id) + '" role="alert"></div>' + overdueNote;
}

function renderDueLines(c) {
  if (c.status === 'RESOLVED' || c.status === 'CLOSED' || c.status === 'PENDING_CONFIRMATION') return '';
  var lines = [];
  if (c.ackDueAt) lines.push((c.ackOverdue ? 'Acknowledgement was due ' : 'Acknowledge by ') + formatDate(c.ackDueAt));
  if (c.respondDueAt) lines.push('Respond by ' + formatDate(c.respondDueAt));
  return lines.map(function(l) { return '<div class="due-line">' + esc(l) + '</div>'; }).join('');
}

function renderCase(c) {
  var st = caseState(c);
  var elapsedClass = st.key === 'red' ? 'elapsed overdue' : 'elapsed';
  var badge = '';
  if (c.status === 'RESOLVED' || c.status === 'CLOSED') {
    var resolvedWhen = c.resolvedAt ? ' &middot; ' + formatDate(c.resolvedAt) : '';
    badge = '<span class="badge resolved">' + esc(c.status.toLowerCase()) + resolvedWhen + '</span>';
  } else if (c.status === 'PENDING_CONFIRMATION') {
    badge = '<span class="badge pending">awaiting citizen confirmation</span>';
  } else if (c.hasEscalatedPastMyTier) {
    badge = '<span class="badge escalated">now with ' + esc(TIER_LABELS[c.currentTopTier] || c.currentTopTier) + '</span>';
  }
  var locationLine = c.locationDetail
    ? '<p class="location-detail">' + esc(c.locationDetail) + '</p>'
    : '';
  return '<div class="case-row">' +
    '<div class="signal-dot ' + st.key + '" aria-hidden="true"></div>' +
    '<div class="case-main">' +
      '<div class="tracking-ref">' + esc(c.trackingRef) + '</div>' +
      '<div class="category">' + esc(c.category.name) + ' &middot; ' + esc(c.localUnit.name) + '</div>' +
      '<p class="description">' + esc(c.description) + '</p>' +
      locationLine +
      renderPhotoThumbs(c.photoUrls) +
      badge +
      renderDisputeNote(c) + renderNudgeNote(c) +
      renderFollowupControl(c) +
      renderAcknowledgeControl(c) +
      renderResolveControl(c) +
    '</div>' +
    '<div class="case-meta">' +
      '<div class="state-tag ' + st.key + '">' + st.text + '</div>' +
      '<div class="' + elapsedClass + '">' + timeAgo(c.elapsedDays) + '</div>' +
      renderDueLines(c) +
      renderLadder(c) +
    '</div>' +
  '</div>';
}

// ================= Viewing (which of my areas) =================
function myMandates() { return (currentMe && currentMe.mandates) || []; }
function findMandate(id) { return myMandates().filter(function(m) { return m.id === id; })[0] || null; }
function mandateText(m) { return m.name + ' — ' + m.label; }

function casesInView() {
  return activeMandateId === null
    ? currentCases
    : currentCases.filter(function(c) { return c.mandateId === activeMandateId; });
}

function wardNameFor(id, list) {
  var w = (list || []).filter(function(x) { return x.id === id; })[0];
  if (w) return w.name;
  var c = currentCases.filter(function(x) { return x.localUnit.id === id; })[0];
  return c ? c.localUnit.name : id;
}

function updateSummary() {
  var el = document.getElementById('viewing-summary');
  if (!el) return;
  var ms = myMandates();
  var title, sub;
  if (ms.length === 1) { title = ms[0].name; sub = ms[0].label; }
  else if (activeMandateId === null) { title = 'All my areas'; sub = ms.length + ' areas'; }
  else { var m = findMandate(activeMandateId); title = m ? m.name : ''; sub = m ? m.label : ''; }
  var wardList = activeTab === 'report' && reportData && reportData.wards ? reportData.wards : null;
  var wardLine = activeWardId ? '<p class="console-role">Ward: ' + esc(wardNameFor(activeWardId, wardList)) + '</p>' : '';
  el.innerHTML = (ms.length > 1 ? '<p class="viewing-kicker">Viewing</p>' : '') +
    '<p class="console-ward">' + esc(title) + '</p>' +
    '<p class="console-role">' + esc(sub) + '</p>' + wardLine;
}

// Control sized to how many areas the rep holds:
// 1 area -> no control; 2-4 -> chips; 5 or more -> searchable "Viewing" box.
function renderViewingControl() {
  var bar = document.getElementById('viewing-bar');
  var ms = myMandates();
  if (ms.length <= 1) { bar.innerHTML = ''; bar.hidden = true; return; }
  bar.hidden = false;
  if (ms.length <= 4) {
    var chip = function(id, html) {
      var on = (activeMandateId === id);
      return '<button type="button" class="mandate-chip' + (on ? ' active' : '') + '" aria-pressed="' + on + '" data-mandate-id="' + esc(id === null ? '' : id) + '">' + html + '</button>';
    };
    bar.innerHTML = '<div class="mandate-strip-inner" role="group" aria-label="Viewing">' +
      chip(null, 'All my areas') +
      ms.map(function(m) { return chip(m.id, esc(m.name) + ' &mdash; <b>' + esc(m.label) + '</b>'); }).join('') +
      '</div>';
    bar.querySelectorAll('.mandate-chip').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var id = btn.getAttribute('data-mandate-id');
        setView(id === '' ? null : id);
      });
    });
    return;
  }
  var opts = '<option value="">All my areas</option>' + ms.map(function(m) {
    return '<option value="' + esc(m.id) + '">' + esc(mandateText(m)) + '</option>';
  }).join('');
  bar.innerHTML = '<div class="control-box"><label class="control-label" for="viewing-select">Viewing</label>' +
    '<select id="viewing-select">' + opts + '</select></div>';
  var sel = document.getElementById('viewing-select');
  sel.value = activeMandateId === null ? '' : activeMandateId;
  enhanceOrListen(sel, function(value) { setView(value === '' ? null : value); });
}

// Upgrades a <select> to the GOV.UK accessible autocomplete (self-hosted
// in /vendor). If the script failed to load, the plain <select> still works.
function enhanceOrListen(sel, onPick) {
  if (hasAutocomplete()) {
    var byText = {};
    Array.prototype.forEach.call(sel.options, function(o) { byText[o.textContent] = o.value; });
    window.accessibleAutocomplete.enhanceSelectElement({
      selectElement: sel,
      showAllValues: true,
      // keep the "All my areas" / "All wards" choice (its value is empty)
      preserveNullOptions: true,
      dropdownArrow: function() { return '<svg class="autocomplete__dropdown-arrow-down" viewBox="0 0 512 512" aria-hidden="true"><path d="M256 384L96 224h320z"/></svg>'; },
      tNoResults: function() { return 'No matching areas'; },
      onConfirm: function(text) {
        if (text === undefined || !(text in byText)) return;
        var value = byText[text];
        sel.value = value;
        onPick(value);
      }
    });
    // The box shows the current choice. When it gets focus, empty it so the
    // full list opens (show-all only lists everything for an empty box);
    // if the person leaves without picking, put the current choice back.
    var box = sel.parentNode;
    var shown = '';
    var setQuery = function(input, v) {
      var setter = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value').set;
      setter.call(input, v);
      input.dispatchEvent(new Event('input', { bubbles: true }));
    };
    box.addEventListener('focusin', function(e) {
      var input = e.target;
      if (input.tagName !== 'INPUT') return;
      shown = input.value;
      if (shown) setQuery(input, '');
    });
    box.addEventListener('focusout', function(e) {
      var input = e.target;
      if (input.tagName !== 'INPUT') return;
      setTimeout(function() {
        if (!box.contains(document.activeElement) && !input.value && shown) {
          var current = sel.options[sel.selectedIndex];
          setQuery(input, current ? current.textContent : shown);
        }
      }, 0);
    });
  } else {
    sel.addEventListener('change', function() { onPick(sel.value); });
  }
}

function setView(id) {
  if (id === activeMandateId) return;
  activeMandateId = id;
  activeWardId = null;
  filterKey = '';
  if (myMandates().length <= 4) renderViewingControl();   // chips: refresh pressed state
  updateSummary();
  if (activeTab === 'report') { loadReportTab(); }
  else { renderFilters(); renderContent(); }
}

// ================= Ward filter =================
function wardOptionsForTab() {
  if (activeTab === 'report') {
    var list = (reportData && reportData.wards) ? reportData.wards.slice() : [];
    return list;
  }
  var map = {};
  casesInView().forEach(function(c) {
    var w = map[c.localUnit.id] || (map[c.localUnit.id] = { id: c.localUnit.id, name: c.localUnit.name, count: 0 });
    w.count++;
  });
  return Object.keys(map).map(function(k) { return map[k]; })
    .sort(function(a, b) { return String(a.name).localeCompare(String(b.name)); });
}

function renderFilters() {
  var slot = document.getElementById('filter-slot');
  if (!slot) return;
  if (activeTab === 'report' && (!reportData || reportData.error)) return;   // built once data is in
  var key = activeTab + '|' + mandateIdForApi() + '|' + reportFrom + '|' + reportTo;
  if (key === filterKey && slot.innerHTML) return;   // keep the box (and keyboard focus) as it is
  filterKey = key;
  var wards = wardOptionsForTab();
  if (activeWardId && !wards.some(function(w) { return w.id === activeWardId; })) {
    wards.push({ id: activeWardId, name: wardNameFor(activeWardId), count: 0 });
  }
  if (wards.length <= 1 && !activeWardId) { slot.innerHTML = ''; return; }
  var total = wards.reduce(function(n, w) { return n + w.count; }, 0);
  var opts = '<option value="">All wards (' + total + ' case' + (total === 1 ? '' : 's') + ')</option>' +
    wards.map(function(w) {
      return '<option value="' + esc(w.id) + '">' + esc(w.name) + ' (' + w.count + ')</option>';
    }).join('');
  slot.innerHTML = '<div class="control-box filter-box no-print"><label class="control-label" for="ward-select">Ward</label>' +
    '<select id="ward-select">' + opts + '</select></div>';
  var sel = document.getElementById('ward-select');
  sel.value = activeWardId || '';
  enhanceOrListen(sel, function(value) { setWard(value === '' ? null : value); });
}

function setWard(id) {
  if (id === activeWardId) return;
  activeWardId = id;
  updateSummary();
  if (activeTab === 'report') loadReportTab();
  else renderContent();
}

// ================= Page =================
function renderBreakdown(obj) {
  var entries = Object.entries(obj);
  if (entries.length === 0) return '<p style="font-size:13px;color:var(--steel-2);">No data.</p>';
  return entries.map(function(e) {
    return '<div class="breakdown-row"><span>' + esc(e[0]) + '</span><span><b>' + esc(e[1]) + '</b></span></div>';
  }).join('');
}

function reportScopeName() {
  var ms = myMandates();
  var base;
  if (activeMandateId !== null) { var m = findMandate(activeMandateId); base = m ? mandateText(m) : ''; }
  else if (ms.length === 1) base = mandateText(ms[0]);
  else base = 'All my areas';
  if (reportData && reportData.ward) base += ' · Ward: ' + reportData.ward.name;
  return base;
}

function renderReportTab() {
  if (reportData === null) {
    return '<div class="empty-state"><p>Loading report…</p></div>';
  }
  if (reportData.error) {
    return '<div class="empty-state"><p>Could not load the report. Please try again.</p></div>';
  }

  var s = reportData.stats;
  var scopeName = reportScopeName();
  var rangeLabel = (reportData.from ? formatDateOnly(reportData.from) : 'All time') + ' to ' + (reportData.to ? formatDateOnly(reportData.to) : 'present');

  var html =
    '<div class="report-header">' +
      '<div><h2 class="report-title">Performance report</h2>' +
      '<p class="report-subtitle">' + esc(scopeName) + ' &middot; ' + esc(rangeLabel) + '</p></div>' +
      '<div class="report-actions">' +
        '<button type="button" class="export-pdf-btn" id="export-pdf-btn">Download PDF</button>' +
        '<button type="button" class="export-pdf-btn secondary-btn" id="print-btn">Print report</button>' +
        '<button type="button" class="export-pdf-btn secondary-btn" id="csv-btn">Download CSV</button>' +
      '</div>' +
    '</div>' +
    '<div class="date-range-row no-print">' +
      '<div class="field"><label for="report-from">From</label><input type="date" id="report-from" value="' + esc(reportFrom) + '"></div>' +
      '<div class="field"><label for="report-to">To</label><input type="date" id="report-to" value="' + esc(reportTo) + '"></div>' +
      '<button type="button" class="apply-btn" id="report-apply-btn">Apply</button>' +
    '</div>' +
    '<div class="stat-grid">' +
      '<div class="stat-card"><div class="stat-number">' + esc(s.totalCases) + '</div><div class="stat-label">Total cases</div></div>' +
      '<div class="stat-card"><div class="stat-number">' + fmtHours(s.avgAckHours) + '</div><div class="stat-label">Avg. time to acknowledge</div></div>' +
      '<div class="stat-card"><div class="stat-number">' + fmtHours(s.avgResolveHours) + '</div><div class="stat-label">Avg. time to resolve</div></div>' +
      '<div class="stat-card"><div class="stat-number">' + esc(s.resolvedCount) + '</div><div class="stat-label">Resolved</div></div>' +
      '<div class="stat-card"><div class="stat-number">' + (s.escalationRate === null ? '—' : esc(s.escalationRate) + '%') + '</div><div class="stat-label">Escalation rate</div></div>' +
      '<div class="stat-card"><div class="stat-number">' + (s.disputeRate === null ? '—' : esc(s.disputeRate) + '%') + '</div><div class="stat-label">Dispute rate</div></div>' +
      '<div class="stat-card"><div class="stat-number">' + esc(s.noFollowupCount) + '</div><div class="stat-label">No follow-up</div></div>' +
    '</div>' +
    '<p class="report-list-title">By category</p>' + renderBreakdown(s.byCategory) +
    '<p class="report-list-title" style="margin-top:20px;">By status</p>' + renderBreakdown(s.byStatus);

  if (reportData.cases.length === 0) {
    html += '<div class="empty-state"><p>No cases in this scope yet.</p></div>';
    return html;
  }

  html += '<p class="report-list-title" style="margin-top:20px;">Case detail</p>';
  html += '<div class="table-scroll"><table class="report-table"><thead><tr><th>Ref</th><th>Category</th><th>Unit</th><th>Status</th><th>Filed</th><th>Resolved</th><th>Follow-ups</th></tr></thead><tbody>';
  html += reportData.cases.map(function(c) {
    var statusCls = (c.status === 'RESOLVED' || c.status === 'CLOSED') ? 'resolved' : c.status === 'PENDING_CONFIRMATION' ? 'pending' : 'open';
    var disputedTag = c.disputed ? ' <span class="report-tag disputed">disputed</span>' : '';
    return '<tr><td>' + esc(c.trackingRef) + '</td><td>' + esc(c.category) + '</td><td>' + esc(c.localUnit) + '</td>' +
      '<td><span class="report-tag ' + statusCls + '">' + esc(c.status.toLowerCase().replace('_', ' ')) + '</span>' + disputedTag + '</td>' +
      '<td>' + formatDateOnly(c.createdAt) + '</td><td>' + formatDateOnly(c.resolvedAt) + '</td><td>' + esc(c.followupCount) + '</td></tr>';
  }).join('');
  html += '</tbody></table></div>';

  html += '<p class="footer-note">Dispute and escalation rates reflect the complete, permanent case history and cannot be filtered out of this report.</p>';

  return html;
}

function renderNotice(title, message) {
  document.getElementById('app').innerHTML =
    '<div class="notice"><h1>' + esc(title) + '</h1><p>' + esc(message) + '</p></div>';
}

function renderShell() {
  document.getElementById('app').innerHTML =
    '<div class="console-header"><div class="console-header-inner">' +
      '<div class="console-header-left">' +
        '<div class="console-icon">' + LAYERS_ICON + '</div>' +
        '<div><p class="console-title">GrievIQ Representative console</p><p class="console-subtitle">Grievance escalation service</p></div>' +
      '</div>' +
      '<div class="console-header-right" id="viewing-summary" aria-live="polite"></div>' +
    '</div></div>' +
    '<div class="mandate-strip no-print" id="viewing-bar"></div>' +
    '<div class="tab-bar">' +
      '<button type="button" class="tab-btn" data-tab="cases">Cases</button>' +
      '<button type="button" class="tab-btn" data-tab="report">Report</button>' +
    '</div>' +
    '<main><div id="filter-slot"></div><div id="content"></div></main>';
  filterKey = '';
  renderViewingControl();
  updateSummary();
  updateTabs();
  document.querySelectorAll('.tab-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var tab = btn.getAttribute('data-tab');
      if (tab === activeTab) return;
      activeTab = tab;
      filterKey = '';
      updateTabs();
      document.getElementById('filter-slot').innerHTML = '';
      if (activeTab === 'report') loadReportTab();
      else { updateSummary(); renderFilters(); renderContent(); }
    });
  });
}

function updateTabs() {
  document.querySelectorAll('.tab-btn').forEach(function(btn) {
    var on = btn.getAttribute('data-tab') === activeTab;
    btn.classList.toggle('active', on);
    if (on) btn.setAttribute('aria-current', 'page'); else btn.removeAttribute('aria-current');
  });
}

function renderContent() {
  var el = document.getElementById('content');
  if (!el) return;
  if (activeTab === 'report') {
    el.innerHTML = renderReportTab();
    attachReportHandlers();
    return;
  }
  var inView = casesInView();
  var cases = activeWardId ? inView.filter(function(c) { return c.localUnit.id === activeWardId; }) : inView;
  var attention = cases.filter(isAttention).length;
  var countText = activeWardId
    ? 'Showing ' + cases.length + ' of ' + inView.length + ' case' + (inView.length === 1 ? '' : 's')
    : cases.length + ' case' + (cases.length === 1 ? '' : 's');
  var html =
    '<div class="register-header">' +
      '<h2 class="register-title">Case register</h2>' +
      '<span class="register-count" aria-live="polite">' + countText +
        (attention > 0 ? ' &middot; <span class="attention">' + attention + ' past time limit</span>' : '') + '</span>' +
    '</div>';
  if (cases.length === 0) {
    html += '<div class="empty-state"><p>' + (activeWardId ? 'No cases in this ward.' : 'No cases currently in your jurisdiction.') + '</p></div>';
  } else {
    html += cases.map(renderCase).join('');
  }
  el.innerHTML = html;
  attachResolveHandlers();
  attachAcknowledgeHandlers();
  attachFollowupHandlers();
}

async function loadReportTab() {
  reportData = null;
  renderContent();
  try {
    var qs = new URLSearchParams();
    qs.set('mandateId', mandateIdForApi());
    if (reportFrom) qs.set('from', reportFrom);
    if (reportTo) qs.set('to', reportTo);
    if (activeWardId) qs.set('ward', activeWardId);
    var res = await fetch('/api/grievances/report?' + qs.toString());
    if (res.status === 403 && activeWardId) {
      // The chosen ward isn't part of this view: fall back to all wards.
      activeWardId = null;
      return loadReportTab();
    }
    reportData = await res.json();
    if (!res.ok) reportData = { error: true };
  } catch (err) {
    reportData = { error: true };
  }
  if (activeTab !== 'report') return;
  renderFilters();
  updateSummary();
  renderContent();
}

function attachReportHandlers() {
  var applyBtn = document.getElementById('report-apply-btn');
  if (applyBtn) {
    applyBtn.addEventListener('click', function() {
      reportFrom = document.getElementById('report-from').value;
      reportTo = document.getElementById('report-to').value;
      loadReportTab();
    });
  }
  var pdfBtn = document.getElementById('export-pdf-btn');
  if (pdfBtn) pdfBtn.addEventListener('click', generateReportPdf);
  var printBtn = document.getElementById('print-btn');
  if (printBtn) printBtn.addEventListener('click', function() { window.print(); });
  var csvBtn = document.getElementById('csv-btn');
  if (csvBtn) csvBtn.addEventListener('click', downloadReportCsv);
}


function toCsvRow(vals) {
  return vals.map(function(v) { return '"' + String(v).replace(/"/g, '""') + '"'; }).join(',');
}

function downloadReportCsv() {
  if (!reportData || reportData.error) return;
  var headers = ['Tracking Ref', 'Category', 'Local Unit', 'Status', 'Created At', 'Acknowledged At', 'Resolved At', 'Follow-ups', 'Disputed'];
  var rows = reportData.cases.map(function(c) {
    return toCsvRow([c.trackingRef, c.category, c.localUnit, c.status, c.createdAt, c.acknowledgedAt || '', c.resolvedAt || '', c.followupCount, c.disputed ? 'Yes' : 'No']);
  });
  var csv = toCsvRow(headers) + '\n' + rows.join('\n');
  var blob = new Blob([csv], { type: 'text/csv' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'grieviq-report-' + reportData.mandate.id + (reportData.ward ? '-' + reportData.ward.id : '') + '-' + new Date().toISOString().slice(0, 10) + '.csv';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function generateReportPdf() {
  if (!reportData || reportData.error) return;
  var s = reportData.stats;
  var scopeName = reportScopeName();
  var rangeLabel = (reportData.from ? formatDateOnly(reportData.from) : 'All time') + ' to ' + (reportData.to ? formatDateOnly(reportData.to) : 'present');

  var jsPDFCtor = window.jspdf.jsPDF;
  var doc = new jsPDFCtor();

  doc.setFont('helvetica', 'bold');
  doc.setFontSize(16);
  doc.text('GrievIQ Performance Report', 14, 18);

  doc.setFont('helvetica', 'normal');
  doc.setFontSize(11);
  doc.text(scopeName, 14, 26);
  doc.setFontSize(9);
  doc.setTextColor(100);
  doc.text(rangeLabel + '  |  Generated ' + new Date().toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }), 14, 32);
  doc.setTextColor(0);

  var statY = 42;
  var stats = [
    ['Total', String(s.totalCases)],
    ['Avg. ack', fmtHours(s.avgAckHours)],
    ['Avg. resolve', fmtHours(s.avgResolveHours)],
    ['Resolved', String(s.resolvedCount)],
    ['Escalation', s.escalationRate === null ? '—' : s.escalationRate + '%'],
    ['Dispute', s.disputeRate === null ? '—' : s.disputeRate + '%'],
    ['No follow-up', String(s.noFollowupCount)]
  ];
  var colWidth = 26;
  stats.forEach(function(st, i) {
    var x = 14 + i * colWidth;
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(11);
    doc.text(st[1], x, statY);
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(6.5);
    doc.setTextColor(100);
    doc.text(st[0], x, statY + 5);
    doc.setTextColor(0);
  });

  var tableRows = reportData.cases.map(function(c) {
    return [c.trackingRef, c.category, c.status.toLowerCase().replace('_', ' '), formatDateOnly(c.createdAt), formatDateOnly(c.resolvedAt), String(c.followupCount)];
  });

  doc.autoTable({
    head: [['Tracking ref', 'Category', 'Status', 'Filed', 'Resolved', 'Follow-ups']],
    body: tableRows,
    startY: statY + 12,
    styles: { fontSize: 8 },
    headStyles: { fillColor: [27, 95, 168] }
  });

  var fileScope = scopeName.replace(/[^a-z0-9]+/gi, '-').toLowerCase();
  doc.save('grieviq-report-' + fileScope + '.pdf');
}


function attachAcknowledgeHandlers() {
  document.querySelectorAll('.ack-btn').forEach(function(btn) {
    btn.addEventListener('click', async function() {
      var id = btn.getAttribute('data-id');
      var errorEl = document.getElementById('ack-error-' + id);
      errorEl.textContent = '';
      btn.disabled = true;
      btn.textContent = 'Acknowledging…';
      try {
        var res = await fetch('/api/grievances/' + encodeURIComponent(id) + '/acknowledge', { method: 'POST' });
        var data = await res.json();
        if (!res.ok || data.error) {
          errorEl.textContent = data.error || 'Something went wrong. Please try again.';
          btn.disabled = false;
          btn.textContent = 'Acknowledge';
          return;
        }
        await init();
      } catch (err) {
        errorEl.textContent = 'Could not reach GrievIQ. Check your connection and try again.';
        btn.disabled = false;
        btn.textContent = 'Acknowledge';
      }
    });
  });
}
function attachFollowupHandlers() {
  document.querySelectorAll('.followup-btn').forEach(function(btn) {
    btn.addEventListener('click', async function() {
      var id = btn.getAttribute('data-id');
      var select = document.getElementById('followup-dept-' + id);
      var dept = select.value;
      var note = document.getElementById('followup-note-' + id).value;
      var errorEl = document.getElementById('followup-error-' + id);
      errorEl.textContent = '';
      if (!dept) {
        errorEl.textContent = 'Choose a department before logging the follow-up.';
        select.setAttribute('aria-invalid', 'true');
        select.focus();
        return;
      }
      select.removeAttribute('aria-invalid');
      btn.disabled = true;
      btn.textContent = 'Logging…';
      try {
        var res = await fetch('/api/grievances/' + encodeURIComponent(id) + '/add-followup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ department: dept, note: note })
        });
        var data = await res.json();
        if (!res.ok || data.error) {
          errorEl.textContent = data.error || 'Something went wrong. Please try again.';
          btn.disabled = false;
          btn.textContent = 'Log follow-up';
          return;
        }
        await init();
      } catch (err) {
        errorEl.textContent = 'Could not reach GrievIQ. Check your connection and try again.';
        btn.disabled = false;
        btn.textContent = 'Log follow-up';
      }
    });
  });
}
function attachResolveHandlers() {
  document.querySelectorAll('.mark-resolved-btn').forEach(function(btn) {
    btn.addEventListener('click', async function() {
      var id = btn.getAttribute('data-id');
      var errorEl = document.getElementById('resolve-error-' + id);
      errorEl.textContent = '';
      btn.disabled = true;
      btn.textContent = 'Marking resolved…';
      try {
        var res = await fetch('/api/grievances/' + encodeURIComponent(id) + '/mark-resolved', { method: 'POST' });
        var data = await res.json();
        if (!res.ok || data.error) {
          errorEl.textContent = data.error || 'Something went wrong. Please try again.';
          btn.disabled = false;
          btn.textContent = 'Mark resolved';
          return;
        }
        if (data.warning) {
          errorEl.textContent = data.warning;
        }
        await init();
      } catch (err) {
        errorEl.textContent = 'Could not reach GrievIQ. Check your connection and try again.';
        btn.disabled = false;
        btn.textContent = 'Mark resolved';
      }
    });
  });
}

async function init() {
  var meRes = await fetch('/api/me');
  if (!meRes.ok) {
    if (meRes.status === 403) {
      renderNotice('Not yet provisioned', 'This account is not currently registered as a representative in GrievIQ. Contact your administrator to be added to a jurisdiction.');
    } else {
      renderNotice('Session issue', 'Your login could not be verified. Please refresh the page.');
    }
    return;
  }
  currentMe = await meRes.json();
  // A saved view that no longer exists (mandate removed) falls back to all.
  if (activeMandateId !== null && !findMandate(activeMandateId)) { activeMandateId = null; activeWardId = null; }

  var casesRes = await fetch('/api/grievances');
  var casesData = await casesRes.json();
  currentCases = casesData.grievances || [];

  renderShell();
  if (activeTab === 'report') loadReportTab();
  else { renderFilters(); renderContent(); }
}

init();
</script>
