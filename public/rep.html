  /* Item 9c: Audit tab */

  .ov-filters { display: flex; flex-wrap: wrap; gap: 0 16px; align-items: flex-start; }

<div id="app"></div>

<script>
// ---- Language (English / Hindi) ----
// All console text lives in /i18n.js (keys "rep.*"), shared with the citizen
// pages so both use the same official Hindi terms. Records are still saved
// in English (e.g. department "Water Supply"); only the display changes.
function T(key, vars) { return window.GIQ ? window.GIQ.t(key, vars) : key; }
function isHi() { return !!(window.GIQ && window.GIQ.lang === 'hi'); }
function loc() { return window.GIQ ? window.GIQ.locale() : 'en-IN'; }
function lv(label) { return window.GIQ ? window.GIQ.level(label) : label; }
function deptName(d) { return window.GIQ ? window.GIQ.dept(d) : d; }
function catName(id, name) { return window.GIQ ? window.GIQ.category(id, name) : name; }
// Report breakdowns arrive keyed by the English category name.
const CAT_IDS = { 'Document/Certificate Correction': 'doc-correction', 'Water Supply / Sanitation': 'water-sanitation',
  'Electricity Supply': 'electricity', 'Road / Infrastructure Repair': 'road-infra', 'Sanitation / Garbage Collection': 'garbage',
  'Land Dispute / Legal Matter': 'land-dispute', 'Public Safety / Law & Order': 'public-safety', 'Other / Uncategorized': 'other' };
const TIER_KEYS = { LOCAL: 'rep.tier_local', MAYOR: 'level.mayor', MLA: 'level.mla', MP: 'level.mp' };
function tierLabel(tier) { return TIER_KEYS[tier] ? T(TIER_KEYS[tier]) : tier; }
const DISPUTE_REASON_KEYS = {
  NOT_FIXED: 'rep.d_not_fixed', PARTIALLY_FIXED: 'rep.d_partial', CAME_BACK: 'rep.d_came_back',
  WRONG_ISSUE: 'rep.d_wrong', OTHER: 'rep.d_other',
};
function statusWord(st) { return T('rep.st_' + st) === 'rep.st_' + st ? st.toLowerCase().replace('_', ' ') : T('rep.st_' + st); }
// Server messages are English; in Hindi show our own sentence with the detail.
function errText(msg) { return msg ? T('rep.err_detail', { msg: msg }) : T('common.generic_error'); }
// Must match VALID_DEPARTMENTS in functions/api/grievances/[id]/add-followup.js
const DEPARTMENTS = ['Water Supply','Electricity','Sanitation / Garbage','Roads & Public Works','Health','Legal / Land Records','Other'];
const LAYERS_ICON = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M12 3L3 8l9 5 9-5-9-5z" fill="white"/><path d="M3 12.5L12 17.5L21 12.5" stroke="white" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 16.5L12 21.5L21 16.5" stroke="white" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';

var activeTab = 'cases';
var activeMandateId = null;   // null = "All my areas"
var activeWardId = null;      // null = all wards in the current view
var activeCatId = null;       // item 8c-2: one issue type, from the Overview's "View cases"
var currentMe = null;
var currentCases = [];

var reportData = null;
var reportFrom = '';
var reportTo = '';
var filterKey = '';           // which ward list the ward box was last built for

// Security (OWASP, cross-site scripting): EVERY piece of text that came from
// a citizen, a rep or the database goes through esc() before it is put into
// the page, so typed-in code is shown as text and never runs.
function esc(s) {
  return String(s === null || s === undefined ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function formatDate(iso) {
  if (!iso) return '';
  var d = new Date(iso);
  // Hindi uses the 24-hour clock (as on the citizen pages); English keeps "2:43 pm".
  var timeOpts = isHi() ? { hour: '2-digit', minute: '2-digit', hourCycle: 'h23' } : { hour: 'numeric', minute: '2-digit' };
  return d.toLocaleDateString(loc(), { day: 'numeric', month: 'short', year: 'numeric' }) +
    ', ' + d.toLocaleTimeString(loc(), timeOpts);
}

function formatDateOnly(iso) {
  if (!iso) return '—';
  var d = new Date(iso);
  return d.toLocaleDateString(loc(), { day: 'numeric', month: 'short', year: 'numeric' });
}

function fmtHours(h) {
  if (h === null || h === undefined) return '—';
  if (h < 24) return T('rep.hrs', { n: Math.round(h) });
  return T('rep.days', { n: Math.round((h / 24) * 10) / 10 });
}

function timeAgo(days) {
  var n = Math.floor(days);   // whole days (fixes "Filed 1 days ago")
  if (n < 1) return T('rep.filed_today');
  if (n === 1) return T('rep.filed_one');
  return T('rep.filed_n', { n: n });
}

function mandateIdForApi() {
  return activeMandateId === null ? 'all' : activeMandateId;
}

function hasAutocomplete() {
  return typeof window.accessibleAutocomplete !== 'undefined' &&
    typeof window.accessibleAutocomplete.enhanceSelectElement === 'function';
}

// ---- Time-limit state for one case, at this rep's own level ----
// Same rule as the citizen status page (functions/_shared/time-limits.js):
// green while within time, red once past it; gold while the citizen is
// asked to confirm; resolved cases are done. Colour is never the only
// signal (WCAG 2.2, 1.4.1) -- every state also has words.
function caseState(c) {
  if (c.status === 'RESOLVED' || c.status === 'CLOSED') return { key: 'done', text: T('rep.state_done') };
  if (c.status === 'PENDING_CONFIRMATION') return { key: 'gold', text: T(c.awaitingStaffCheck ? 'rep.state_check' : 'rep.state_gold') };
  if (c.isLate) return { key: 'red', text: T('rep.state_red') };
  return { key: 'green', text: T('rep.state_green') };
}

function isAttention(c) {
  return c.isLate && c.status !== 'PENDING_CONFIRMATION' && c.status !== 'RESOLVED' && c.status !== 'CLOSED';
}

function renderLadder(c) {
  var isFinal = c.status === 'RESOLVED' || c.status === 'CLOSED';
  var late = c.tierLate || [];
  return '<div class="ladder" role="list" aria-label="' + esc(T('rep.levels_aria')) + '">' + c.chainTierList.map(function(tier, i) {
    var reached = i <= c.currentTierIndex;
    var state, words;
    if (!reached) { state = 'future'; words = T('rep.lv_not_reached'); }
    else if (isFinal) { state = 'done'; words = T('rep.lv_reached'); }
    else if (late[i]) { state = 'late'; words = T('rep.lv_late'); }
    else { state = 'ok'; words = T('rep.lv_ok'); }
    var mine = tier === c.viewingAsTier;
    return '<div class="ladder-step" role="listitem"><div class="ladder-dot ' + state + (mine ? ' mine' : '') + '" aria-hidden="true"></div>' +
      '<div class="ladder-label">' + esc(tierLabel(tier)) + '</div>' +
      '<span class="visually-hidden">: ' + esc(words) + (mine ? ' ' + esc(T('rep.lv_mine')) : '') + '</span></div>';
  }).join('') + '</div>';
}

// The citizen's photos (item 7c): small previews in the list, the full
// photo opens in a new tab. Photos removed under the retention policy say so.
function renderPhotoThumbs(photos) {
  if (!photos || photos.length === 0) return '';
  return '<div class="photo-thumbs">' + photos.map(function(p, i) {
    if (!p.url) return '<span class="photo-removed">' + esc(p.removed ? T('rep.photo_removed', { date: formatDateOnly(p.removedAt) }) : T('rep.r_photo_unavailable')) + '</span>';
    return '<a class="photo-thumb" href="' + esc(p.url) + '" target="_blank" rel="noopener noreferrer"' +
      (p.removed ? ' title="' + esc(T('rep.photo_full_removed', { date: formatDateOnly(p.removedAt) })) + '"' : p.previewOnly ? ' title="' + esc(T('rep.photo_preview_only')) + '"' : '') + '>' +
      '<img src="' + esc(p.thumbUrl || p.url) + '" alt="' + esc(T('rep.photo_alt', { n: i + 1 })) + '" loading="lazy">' +
      '<span class="visually-hidden"> ' + esc(T('rep.new_tab')) + '</span></a>';
  }).join('') + '</div>';
}

// Where the problem is: the pin saved with the complaint (reps only).
// Coordinates are numbers from our own API; Number() + isFinite keeps
// anything else out of the link. Uses Google's documented Maps URL format.
function renderMapLink(c) {
  if (!c.pin) return '';
  var lat = Number(c.pin.lat), lng = Number(c.pin.lng);
  if (!isFinite(lat) || !isFinite(lng)) return '';
  var url = 'https://www.google.com/maps/search/?api=1&query=' + lat + ',' + lng;
  return '<div><a class="map-link" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">' +
    esc(T('rep.map_link')) + '<span class="visually-hidden"> ' + esc(T('rep.new_tab')) + '</span></a></div>';
}

function renderDisputeNote(c) {
  if (!c.citizenDisputeReason) return '';
  var label = T(DISPUTE_REASON_KEYS[c.citizenDisputeReason] || 'rep.d_other');
  var note = c.citizenDisputeNote ? ' &mdash; "' + esc(c.citizenDisputeNote) + '"' : '';
  var when = c.citizenDisputeAt ? ' <span class="muted-inline">(' + formatDate(c.citizenDisputeAt) + ')</span>' : '';
  return '<div class="dispute-note"><b>' + esc(label) + '</b>' + when + note + '</div>';
}

// Item 7d: the case was reopened after it closed -- why, when, which level
// it went to, and what the previous resolution report said.
function renderReopenNote(c) {
  var r = c.reopen;
  if (!r) return '';
  var open = c.status !== 'RESOLVED' && c.status !== 'CLOSED' && c.status !== 'PENDING_CONFIRMATION';
  var who = T(r.by === 'staff' ? 'rep.reopened_staff' : 'rep.reopened_citizen');
  var html = '<div class="dispute-note"><b>' + esc(who) + '</b> <span class="muted-inline">(' + formatDate(r.at) + ' &middot; ' +
    esc(T('rep.reopened_to', { level: tierLabel(r.toTier) })) + ')</span><br>' +
    esc(T(DISPUTE_REASON_KEYS[r.reason] || 'rep.d_other')) + ' &mdash; "' + esc(r.note) + '"';
  if (open && c.resolution && c.resolution.note) {
    html += '<br><span class="muted-inline">' + esc(T('rep.reopened_prev')) + '</span> ' + esc(c.resolution.note);
  }
  return html + '</div>';
}

// Item 7b-2: GrievIQ checked the fix (citizen had no email) and found it
// not fixed -- shown while the reopened case is still open.
function renderStaffCheckNote(c) {
  var k = c.staffCheck;
  if (!k || k.outcome !== 'NOT_FIXED' || c.status === 'PENDING_CONFIRMATION' || c.status === 'RESOLVED' || c.status === 'CLOSED') return '';
  return '<div class="dispute-note"><b>' + esc(T(k.method === 'PHONE' ? 'rep.check_not_fixed_phone' : 'rep.check_not_fixed_photo')) + '</b>' +
    ' <span class="muted-inline">(' + formatDate(k.at) + ')</span>' + (k.note ? ' &mdash; "' + esc(k.note) + '"' : '') + '</div>';
}

function renderNudgeNote(c) {
  if (!c.adminNudges || !c.adminNudges.length) return '';
  var n = c.adminNudges[c.adminNudges.length - 1];
  var count = c.adminNudges.length > 1 ? ' &middot; ' + esc(T('rep.reminders_n', { n: c.adminNudges.length })) : '';
  return '<div class="dispute-note"><b>' + esc(T('rep.reminder')) + '</b> <span class="muted-inline">(' + formatDate(n.createdAt) + count + ')</span>' +
    (n.note ? ' &mdash; "' + esc(n.note) + '"' : '') + '</div>';
}

function renderResolveControl(c) {
  var isFinal = c.status === 'RESOLVED' || c.status === 'CLOSED';
  var isPending = c.status === 'PENDING_CONFIRMATION';
  if (isFinal || isPending) return '';
  // Own class (mark-resolved-btn) so ONLY this button marks a case
  // resolved -- previously every button sharing the resolve-btn style
  // (Acknowledge, Log follow-up) also triggered Mark resolved.
  var id = esc(c.id);
  var d = drafts[c.id];
  // Item 8b: a field worker submits a fix report for approval; while one is
  // waiting, the representative or office manager decides it.
  var isFW = c.myRole === 'FIELD_WORKER';
  // Item 8c-1: an office assistant only looks (the fix report, if any, still shows).
  if (c.viewOnly) return c.pendingReport ? renderReviewBlock(c) : '';
  if (c.pendingReport) return isFW ? '<p class="team-note">' + esc(T('rep.fw_waiting')) + '</p>' : renderReviewBlock(c);
  if (!d || !d.open) {
    return '<button type="button" class="resolve-btn mark-resolved-btn" data-id="' + id + '" aria-expanded="false">' + esc(T(isFW ? 'rep.fw_submit_btn' : 'rep.mark_resolved')) + '</button>';
  }
  // Item 7b: say what was done, and add "after" photos or the reason there
  // are none. Photos upload as soon as they are chosen, so any warnings show
  // before the case is marked resolved. Errors show next to each field.
  var full = d.photos.length + d.uploading >= MAX_RES_PHOTOS;
  return '<div class="resolve-form" id="resolve-form-' + id + '">' +
    '<label for="rnote-' + id + '">' + esc(T('rep.r_note')) + '</label>' +
    '<p class="hint" id="rnote-hint-' + id + '">' + esc(T('rep.r_note_hint')) + '</p>' +
    '<textarea id="rnote-' + id + '" class="r-note" data-id="' + id + '" maxlength="1000" aria-describedby="rnote-hint-' + id + ' rnote-err-' + id + '"' + (d.errors.note ? ' aria-invalid="true"' : '') + '>' + esc(d.note) + '</textarea>' +
    '<div class="field-err" id="rnote-err-' + id + '" role="alert">' + esc(d.errors.note || '') + '</div>' +
    '<label for="rphoto-' + id + '">' + esc(T('rep.r_photos')) + '</label>' +
    '<p class="hint" id="rphoto-hint-' + id + '">' + esc(T('rep.r_photos_hint')) + ' ' + esc(T('rep.r_loc_hint')) + '</p>' +
    '<p class="hint" role="status" id="rloc-' + id + '">' + locLineHtml(d, id) + '</p>' +
    '<input type="file" id="rphoto-' + id + '" class="r-photo" data-id="' + id + '" accept="image/jpeg,image/png,image/webp" multiple aria-describedby="rphoto-hint-' + id + ' rphoto-err-' + id + '"' + (full || d.noPhoto ? ' disabled' : '') + (d.errors.photos ? ' aria-invalid="true"' : '') + ' />' +
    '<div class="r-thumbs" aria-live="polite">' +
      d.photos.map(function(p, i) {
        return '<div class="r-thumb">' + (p.url ? '<img src="' + esc(p.thumbUrl || p.url) + '" alt="' + esc(T('rep.r_photo_alt', { n: i + 1 })) + '">' : '') +
          renderWarnings(p.warnings) +
          '<button type="button" class="r-remove" data-id="' + id + '" data-photo="' + esc(p.id) + '">' + esc(T('rep.r_remove', { n: i + 1 })) + '</button></div>';
      }).join('') +
      (d.uploading ? '<div class="r-thumb">' + esc(T('rep.r_uploading')) + '</div>' : '') +
    '</div>' +
    '<div class="field-err" id="rphoto-err-' + id + '" role="alert">' + esc(d.errors.photos || '') + '</div>' +
    '<label class="check"><input type="checkbox" class="r-nophoto" data-id="' + id + '"' + (d.noPhoto ? ' checked' : '') + (d.photos.length ? ' disabled' : '') + ' /> ' + esc(T('rep.r_no_photo')) + '</label>' +
    (d.noPhoto
      ? '<label for="rreason-' + id + '">' + esc(T('rep.r_reason')) + '</label>' +
        '<p class="hint" id="rreason-hint-' + id + '">' + esc(T('rep.r_reason_hint')) + '</p>' +
        '<textarea id="rreason-' + id + '" class="r-reason" data-id="' + id + '" maxlength="300" aria-describedby="rreason-hint-' + id + ' rreason-err-' + id + '"' + (d.errors.reason ? ' aria-invalid="true"' : '') + '>' + esc(d.reason) + '</textarea>' +
        '<div class="field-err" id="rreason-err-' + id + '" role="alert">' + esc(d.errors.reason || '') + '</div>'
      : '') +
    '<div class="actions">' +
      '<button type="button" class="resolve-btn r-submit" data-id="' + id + '"' + (d.busy || d.uploading ? ' disabled' : '') + '>' + esc(T(d.busy ? 'rep.marking' : (isFW ? 'rep.fw_submit' : 'rep.r_submit'))) + '</button>' +
      '<button type="button" class="resolve-btn r-cancel" data-id="' + id + '"' + (d.busy ? ' disabled' : '') + '>' + esc(T('rep.r_cancel')) + '</button>' +
    '</div>' +
    '<div class="resolve-error" id="resolve-error-' + id + '" role="alert">' + esc(d.errors.form || '') + '</div>' +
  '</div>';
}

// ---- Resolution report and photo warnings (item 7b) ----
var MAX_RES_PHOTOS = 3;
var drafts = {};   // case id -> Mark resolved form state, kept across redraws

var EV_KEYS = { DATE_BEFORE_FILING: 'rep.ev_date_before', DATE_FUTURE: 'rep.ev_date_future', FAR_FROM_PIN: 'rep.ev_far',
  CITIZEN_PHOTO: 'rep.ev_citizen', NO_DATE: 'rep.ev_no_date', NO_LOCATION: 'rep.ev_no_location', NO_PIN: 'rep.ev_no_pin',
  DEVICE_FAR_FROM_PIN: 'rep.ev_dev_far', DEVICE_OUTSIDE_WARD: 'rep.ev_dev_outside', PHOTO_OUTSIDE_WARD: 'rep.ev_photo_outside',
  DEVICE_NOT_SHARED: 'rep.ev_dev_not_shared', DEVICE_ROUGH: 'rep.ev_dev_rough' };
function warningText(w) {

}
function renderWarnings(list) {

    return '<li class="' + (w.level === 'warn' ? 'warn' : 'info') + '">' + (w.level === 'warn' ? '⚠ ' : '') + esc(warningText(w)) + '</li>';
  }).join('') + '</ul>';
}
function renderResolution(c) {
  var r = c.resolution;
  if (!r || (c.status !== 'PENDING_CONFIRMATION' && c.status !== 'RESOLVED' && c.status !== 'CLOSED')) return '';
  var photos = r.photos && r.photos.length
    ? '<div class="res-photos">' + r.photos.map(function(p, i) {
        return '<div class="res-photo">' + (p.url
          ? '<a href="' + esc(p.url) + '" target="_blank" rel="noopener noreferrer"><img src="' + esc(p.thumbUrl || p.url) + '" alt="' + esc(T('rep.r_photo_alt', { n: i + 1 })) + '" loading="lazy"><span class="visually-hidden"> ' + esc(T('rep.new_tab')) + '</span></a>'
          : '<span>' + esc(p.removed ? T('rep.photo_removed', { date: formatDateOnly(p.removedAt) }) : T('rep.r_photo_unavailable')) + '</span>') +
          (p.url && p.removed ? '<div class="hint">' + esc(T('rep.photo_full_removed', { date: formatDateOnly(p.removedAt) })) + '</div>' : '') +
          renderWarnings(p.warnings) + '</div>';
      }).join('') + '</div>'
    : (r.noPhotoReason ? '<div><b>' + esc(T('rep.r_no_photo_given')) + '</b> ' + esc(r.noPhotoReason) + '</div>' : '');
  return '<div class="res-block"><div><b>' + esc(T('rep.r_done')) + '</b></div><div class="res-note">' + esc(r.note) + '</div>' + photos + '</div>';

// Department list: nothing pre-selected (GOV.UK / NHS guidance: a
// pre-selected answer is easily missed and submitted wrongly). The
// department matching the issue type, if any, is listed first and marked
// "(suggested)"; the rep must actively choose.
function renderFollowupControl(c) {
  var deptLine = c.currentDepartment
    ? '<p class="location-detail">' + esc(T('rep.forwarded')) + ' <b>' + esc(deptName(c.currentDepartment)) + '</b></p>'
    : '';
  var history = (c.followupHistory || []).map(function(f) {
    var noteText = f.note ? ' — ' + esc(f.note) : '';
    return '<div class="dispute-note"><b>' + esc(deptName(f.department)) + '</b>' + noteText +
      ' <span class="muted-inline">(' + formatDate(f.createdAt) + ')</span></div>';
  }).join('');
  var sugg = DEPARTMENTS.indexOf(c.suggestedDepartment) !== -1 ? c.suggestedDepartment : null;
  var ordered = sugg ? [sugg].concat(DEPARTMENTS.filter(function(d) { return d !== sugg; })) : DEPARTMENTS;
  var options = '<option value="">' + esc(T('rep.choose_dept')) + '</option>' + ordered.map(function(d) {
    return '<option value="' + esc(d) + '">' + esc(deptName(d)) + (d === sugg ? ' ' + esc(T('rep.suggested')) : '') + '</option>';
  }).join('');
  var id = esc(c.id);
  // Item 7b: the form is hidden while waiting for the citizen (the rep has
  // already marked it resolved); the department history stays visible.
  if (c.status === 'PENDING_CONFIRMATION') return deptLine + history;
  // Item 8b: forwarding is for the representative or office manager.
  if (c.myRole === 'FIELD_WORKER' || c.viewOnly) return deptLine + history;
  return deptLine + history +
    '<div class="followup-form">' +
      '<div class="followup-field"><label for="followup-dept-' + id + '">' + esc(T('rep.forward_to')) + '</label>' +
        '<select class="followup-dept" id="followup-dept-' + id + '">' + options + '</select></div>' +
      '<div class="followup-field"><label for="followup-note-' + id + '">' + esc(T('rep.note_opt')) + '</label>' +
        '<input class="followup-note" id="followup-note-' + id + '" type="text" maxlength="500" /></div>' +
      '<button type="button" class="resolve-btn followup-btn" data-id="' + id + '">' + esc(T('rep.log_followup')) + '</button>' +
    '</div>' +
    '<div class="resolve-error followup-error" id="followup-error-' + id + '" role="alert"></div>';
}

function renderAcknowledgeControl(c) {
  // Item 7b: nothing to acknowledge once the rep has marked it resolved.
  if (c.status === 'PENDING_CONFIRMATION') return '';
  if (c.acknowledgedAt) {
    return '<span class="badge acknowledged">' + esc(T('rep.badge_ack', { date: formatDate(c.acknowledgedAt) })) + '</span>';
  }
  if (c.myRole === 'FIELD_WORKER' || c.viewOnly) return '';
  var overdueNote = c.ackOverdue ? ' <span class="badge escalated">' + esc(T('rep.badge_ack_overdue')) + '</span>' : '';
  // Item 7d: a reopened case is acknowledged by the level now responsible.
  if (c.reopen && c.hasEscalatedPastMyTier) {
    return '<span class="badge pending">' + esc(T('rep.ack_waiting_higher', { level: tierLabel(c.currentTopTier) })) + '</span>' + overdueNote;
  }
  return '<button type="button" class="resolve-btn ack-btn" data-id="' + esc(c.id) + '">' + esc(T('rep.acknowledge')) + '</button>' +
    '<div class="resolve-error ack-error" id="ack-error-' + esc(c.id) + '" role="alert"></div>' + overdueNote;
}

function renderDueLines(c) {
  // Item 7a: while the citizen is asked to confirm, the clock is paused;
  // show when the case closes by itself instead of deadlines.
  if (c.status === 'PENDING_CONFIRMATION') {
    return c.confirmBy ? '<div class="due-line">' + esc(T(c.awaitingStaffCheck ? 'rep.closes_by_check' : 'rep.closes_by', { date: formatDate(c.confirmBy) })) + '</div>' : '';
  }
  if (c.status === 'RESOLVED' || c.status === 'CLOSED') return '';
  var lines = [];
  if (c.ackDueAt) lines.push(T(c.ackOverdue ? 'rep.ack_was_due' : 'rep.ack_by', { date: formatDate(c.ackDueAt) }));
  if (c.respondDueAt) lines.push(T('rep.respond_by', { date: formatDate(c.respondDueAt) }));
  return lines.map(function(l) { return '<div class="due-line">' + esc(l) + '</div>'; }).join('');
}

function renderCase(c) {
  var st = caseState(c);
  var elapsedClass = st.key === 'red' ? 'elapsed overdue' : 'elapsed';
  var badge = '';
  if (c.status === 'RESOLVED' || c.status === 'CLOSED') {
    var resolvedWhen = c.resolvedAt ? ' &middot; ' + formatDate(c.resolvedAt) : '';
    // How it was resolved (item 7a): confirmed by the citizen, closed with no
    // reply, or the citizen had no email to be asked.
    var KIND_KEYS = { CONFIRMED: 'rep.kind_confirmed', NOT_CONFIRMED: 'rep.kind_not_confirmed', NO_EMAIL: 'rep.kind_no_email',
      VERIFIED_BY_GRIEVIQ: 'rep.kind_verified', NOT_VERIFIED: 'rep.kind_not_verified' };
    var kind = KIND_KEYS[c.resolutionKind] ? ' &middot; ' + esc(T(KIND_KEYS[c.resolutionKind])) : '';
    badge = '<span class="badge resolved">' + esc(T(c.status === 'CLOSED' ? 'rep.badge_closed' : 'rep.badge_resolved')) + resolvedWhen + kind + '</span>';
  } else if (c.status === 'PENDING_CONFIRMATION') {
    badge = '<span class="badge pending">' + esc(T(c.awaitingStaffCheck ? 'rep.badge_check' : 'rep.badge_pending')) + '</span>';
  } else if (c.hasEscalatedPastMyTier) {
    badge = '<span class="badge escalated">' + esc(T('rep.badge_now_with', { level: tierLabel(c.currentTopTier) })) + '</span>';
  }
  // Item 7d: reopened and not yet resolved again.
  if (c.reopen && c.status !== 'RESOLVED' && c.status !== 'CLOSED' && c.status !== 'PENDING_CONFIRMATION') {
    badge += ' <span class="badge escalated">' + esc(T('rep.badge_reopened')) + '</span>';
  }
  var locationLine = c.locationDetail
    ? '<p class="location-detail">' + esc(c.locationDetail) + '</p>'
    : '';
  return '<div class="case-row" id="case-' + esc(c.id) + '">' +
    '<div class="signal-dot ' + st.key + '" aria-hidden="true"></div>' +
    '<div class="case-main">' +
      '<div class="tracking-ref">' + esc(c.trackingRef) + '</div>' +
      '<div class="category">' + esc(catName(c.category.id, c.category.name)) + ' &middot; ' + esc(c.localUnit.name) + '</div>' +
      (c.retentionRemovedAt ? '<p class="description muted-inline">' + esc(T('rep.retention_removed', { date: formatDateOnly(c.retentionRemovedAt) })) + '</p>' : '<p class="description">' + esc(c.description) + '</p>') +
      locationLine +
      renderMapLink(c) +
      renderPhotoThumbs(c.photos) +
      badge +
      renderResolution(c) +
      renderReopenNote(c) + renderDisputeNote(c) + renderStaffCheckNote(c) + renderNudgeNote(c) +
      renderTeamNotes(c) + renderAssignControl(c) +
      renderFollowupControl(c) +
      renderAcknowledgeControl(c) +
      renderResolveControl(c) +
    '</div>' +
    '<div class="case-meta">' +
      '<div class="state-tag ' + st.key + '">' + st.text + '</div>' +
      '<div class="' + elapsedClass + '">' + timeAgo(c.elapsedDays) + '</div>' +
      renderDueLines(c) +
      renderLadder(c) +
    '</div>' +
  '</div>';
}

// ================= Team (item 8b) =================
// Case-level: who a case is assigned to, a fix report sent back, the
// "Assign to" control, and deciding a field worker's fix report.
var teamsData = {};        // office key -> [{ email, name }] field workers
var reviewState = {};      // case id -> { open, note, error, busy }
var assignState = {};      // case id -> { error, busy }
function memberName(officeKeyVal, email) {
  var list = teamsData[officeKeyVal] || [];
  var m = list.filter(function(x) { return x.email === email; })[0];
  return m ? m.name : email;
}
function renderTeamNotes(c) {
  var html = '';
  if (c.assignment && c.status !== 'RESOLVED' && c.status !== 'CLOSED') {
    html += '<p class="team-note">' + esc(c.myRole === 'FIELD_WORKER'
      ? T('rep.assigned_you', { by: c.assignment.by, date: formatDate(c.assignment.at) })
      : T('rep.assigned_to', { name: memberName(c.officeKey, c.assignment.email), date: formatDate(c.assignment.at) })) + '</p>';
  }
  if (c.sentBack) {
    html += '<div class="dispute-note"><b>' + esc(T('rep.sent_back_t', { by: c.sentBack.by })) + '</b> <span class="muted-inline">(' + formatDate(c.sentBack.at) + ')</span><br>' + esc(c.sentBack.note) + '</div>';
  }
  return html;
}
// Item 8c-1: only field workers covering the case's ward; people who
// usually handle this issue first, then the fewest open cases; on-leave
// people can't be chosen; a gentle note when someone is already busy.
var workloadWarn = 10;
function desName(m) { return m.designation ? (m.designation === 'OTHER' && m.designationOther ? m.designationOther : T('rep.des_' + m.designation)) : ''; }
function assignCandidates(c) {
  var ward = c.localUnit.id, type = c.category.id;
  return (teamsData[c.officeKey] || []).filter(function(m) { return !m.wards || m.wards.indexOf(ward) !== -1; })
    .map(function(m) { return { m: m, match: (m.issueTypes || []).indexOf(type) !== -1 }; })
    .sort(function(a, b) {
      var av = a.m.available !== false, bv = b.m.available !== false;
      if (av !== bv) return av ? -1 : 1;
      if (a.match !== b.match) return a.match ? -1 : 1;
      if (a.m.open !== b.m.open) return a.m.open - b.m.open;
      return a.m.name < b.m.name ? -1 : a.m.name > b.m.name ? 1 : 0;
    });
}
function assignOptionText(x) {
  var m = x.m, bits = [];
  var des = desName(m);
  bits.push(T('rep.assign_opt_open', { n: m.open || 0 }));
  if (m.overdue) bits.push(T('rep.assign_opt_overdue', { n: m.overdue }));
  if (x.match) bits.push(T('rep.assign_opt_match'));
  if (m.available === false) bits.push(T('rep.assign_opt_leave'));
  return m.name + (des ? ' — ' + des : '') + ' · ' + bits.join(', ');
}
function heavyText(c, email) {
  var m = (teamsData[c.officeKey] || []).filter(function(x) { return x.email === email; })[0];
  if (!m || (c.assignment && c.assignment.email === email) || (m.open || 0) < workloadWarn) return '';
  return T('rep.assign_heavy', { name: m.name, n: m.open });
}
function renderAssignControl(c) {
  if (!isManagerRole(c.myRole) || c.status === 'RESOLVED' || c.status === 'CLOSED' || c.status === 'PENDING_CONFIRMATION') return '';
  var all = teamsData[c.officeKey] || [];
  var id = esc(c.id), st = assignState[c.id] || {};
  if (!all.length) return c.myRole === 'REPRESENTATIVE' ? '<p class="hint team-hint">' + esc(T('rep.assign_none')) + '</p>' : '';
  var list = assignCandidates(c);
  var current = c.assignment ? c.assignment.email : '';
  if (!list.length && !current) return '<p class="hint team-hint">' + esc(T('rep.assign_no_cover', { ward: c.localUnit.name })) + '</p>';
  var opts = '<option value="">' + esc(T('rep.assign_nobody')) + '</option>' + list.map(function(x) {
    var sel = x.m.email === current;
    return '<option value="' + esc(x.m.email) + '"' + (sel ? ' selected' : '') + (x.m.available === false && !sel ? ' disabled' : '') + '>' + esc(assignOptionText(x)) + '</option>';
  }).join('');
  var sel = st.value != null ? st.value : current;
  return '<div class="followup-form assign-form">' +
    '<div class="followup-field"><label for="assign-' + id + '">' + esc(T('rep.assign_label')) + '</label>' +
      '<p class="hint" id="assign-hint-' + id + '">' + esc(T('rep.assign_hint')) + '</p>' +
      '<select class="assign-select" id="assign-' + id + '" data-id="' + id + '" aria-describedby="assign-hint-' + id + ' assign-heavy-' + id + ' assign-err-' + id + '"' + (st.error ? ' aria-invalid="true"' : '') + '>' + opts + '</select>' +
      '<p class="hint assign-heavy" id="assign-heavy-' + id + '" role="status">' + esc(heavyText(c, sel)) + '</p></div>' +
    '<button type="button" class="resolve-btn assign-btn" data-id="' + id + '"' + (st.busy ? ' disabled' : '') + '>' + esc(T('rep.assign_btn')) + '</button>' +
    '</div><div class="resolve-error" id="assign-err-' + id + '" role="alert">' + esc(st.error || '') + '</div>';
}
function renderReviewBlock(c) {
  var r = c.pendingReport, id = esc(c.id), st = reviewState[c.id] || {};

function findCase(id) { return currentCases.filter(function(c) { return c.id === id; })[0]; }
function attachTeamCaseHandlers() {
  function redraw(focusSel) { renderContent(); if (focusSel) { var el = document.querySelector(focusSel); if (el) el.focus(); } }
  document.querySelectorAll('.assign-select').forEach(function(sel) {
    sel.addEventListener('change', function() {
      var id = sel.getAttribute('data-id'), c = findCase(id); if (!c) return;
      var st = assignState[id] || (assignState[id] = {});

      var st = assignState[id] = { busy: true, value: sel ? sel.value : '' };
      redraw();
      try {
        var res = await fetch('/api/grievances/' + encodeURIComponent(id) + '/assign', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: sel ? sel.value || null : null }) });
        var data = await res.json().catch(function() { return {}; });
        if (!res.ok) {
          st.busy = false;
          var fe = (data.fields || {}).email;
          st.error = fe === 'OUT_OF_AREA' ? T('rep.assign_err_area') : fe === 'ON_LEAVE' ? T('rep.assign_err_leave') : errText(data.error);
          redraw('#assign-' + cssId(id)); return;
        }
        delete assignState[id];
        await init();
        var s2 = document.getElementById('resolve-status'); if (s2) s2.textContent = T('rep.assign_saved');
      } catch (e) { st.busy = false; st.error = T('common.network_error'); redraw(); }
    });
  });
  document.querySelectorAll('.sb-open').forEach(function(btn) {
    btn.addEventListener('click', function() { var id = btn.getAttribute('data-id'); reviewState[id] = { open: true, note: '' }; redraw('#sb-note-' + cssId(id)); });
  });
  document.querySelectorAll('.sb-cancel').forEach(function(btn) {
    btn.addEventListener('click', function() { var id = btn.getAttribute('data-id'); delete reviewState[id]; redraw('.sb-open[data-id="' + cssId(id) + '"]'); });
  });
  document.querySelectorAll('.sb-note').forEach(function(el) {
    el.addEventListener('input', function() {
      var st = reviewState[el.getAttribute('data-id')]; if (!st) return;
      st.note = el.value;

    });
  });
  async function decide(id, decision) {
    var c = findCase(id); if (!c || !c.pendingReport) return;
    var st = reviewState[id] || (reviewState[id] = {});
    if (decision === 'send_back') {
      var noteEl = document.getElementById('sb-note-' + id); if (noteEl) st.note = noteEl.value;
      if ((st.note || '').trim().length < 10) { st.error = T('rep.sb_err'); redraw('#sb-note-' + cssId(id)); return; }
    }
    st.busy = true; st.formError = ''; redraw();
    try {
      var res = await fetch('/api/grievances/' + encodeURIComponent(id) + '/review-report', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ reportId: c.pendingReport.id, decision: decision, note: decision === 'send_back' ? st.note.trim() : '' }) });
      var data = await res.json().catch(function() { return {}; });
      if (!res.ok) {
        st.busy = false;
        if (data.fields && data.fields.note) { st.error = T('rep.sb_err'); redraw('#sb-note-' + cssId(id)); return; }
        st.formError = errText(data.error); redraw(); return;
      }
      delete reviewState[id];
      await init();
      var s2 = document.getElementById('resolve-status'); if (s2) s2.textContent = T(decision === 'approve' ? 'rep.approved_done' : 'rep.sent_back_done');
    } catch (e) { st.busy = false; st.formError = T('common.network_error'); redraw(); }
  }
  document.querySelectorAll('.approve-btn').forEach(function(btn) { btn.addEventListener('click', function() { decide(btn.getAttribute('data-id'), 'approve'); }); });
  document.querySelectorAll('.sb-send').forEach(function(btn) { btn.addEventListener('click', function() { decide(btn.getAttribute('data-id'), 'send_back'); }); });
}

// Item 8c-1: a team member's own role only ("Ward 12 — Field worker"), not
// the representative's title; for offices above the ward, which office.

function isManagerRole(r) { return r === 'REPRESENTATIVE' || r === 'OFFICE_MANAGER' || !r; }

// Upgrades a <select> to the GOV.UK accessible autocomplete (self-hosted
// in /vendor). If the script failed to load, the plain <select> still works.
function enhanceOrListen(sel, onPick, noResultsKey) {
  if (hasAutocomplete()) {
    var byText = {};
    Array.prototype.forEach.call(sel.options, function(o) { byText[o.textContent] = o.value; });
    window.accessibleAutocomplete.enhanceSelectElement({
      selectElement: sel,
      showAllValues: true,
      // keep the "All my areas" / "All wards" choice (its value is empty)
      preserveNullOptions: true,
      dropdownArrow: function() { return '<svg class="autocomplete__dropdown-arrow-down" viewBox="0 0 512 512" aria-hidden="true"><path d="M256 384L96 224h320z"/></svg>'; },
      // Every message the box shows or reads out, in the page language.
      tNoResults: function() { return T(noResultsKey || 'rep.ac_none'); },
      tStatusQueryTooShort: function(min) { return T('rep.ac_short', { n: min }); },
      tStatusNoResults: function() { return T('rep.ac_none'); },
      tStatusSelectedOption: function(option, total, index) { return T('rep.ac_selected', { option: option, n: index + 1, total: total }); },
      tStatusResults: function(count, sel) { return count === 1 ? T('rep.ac_results_one', { sel: sel }) : T('rep.ac_results', { n: count, sel: sel }); },
      tAssistiveHint: function() { return T('rep.ac_hint'); },
      onConfirm: function(text) {
        if (text === undefined || !(text in byText)) return;
        var value = byText[text];
        sel.value = value;
        onPick(value);
      }
    });
    // The box shows the current choice. When it gets focus, empty it so the
    // full list opens (show-all only lists everything for an empty box);
    // if the person leaves without picking, put the current choice back.
    var box = sel.parentNode;
    var shown = '';
    var setQuery = function(input, v) {
      var setter = Object.getOwnPropertyDescriptor(HTMLInputElement.prototype, 'value').set;
      setter.call(input, v);
      input.dispatchEvent(new Event('input', { bubbles: true }));
    };
    box.addEventListener('focusin', function(e) {
      var input = e.target;
      if (input.tagName !== 'INPUT') return;
      shown = input.value;
      if (shown) setQuery(input, '');
    });
    // Clicking the box again after a choice (focus never left it) must also
    // open the full list, not just the one matching the current text.
    box.addEventListener('click', function(e) {
      var input = e.target;
      if (input.tagName !== 'INPUT') return;
      var current = sel.options[sel.selectedIndex];
      if (input.value && current && input.value === current.textContent) {
        shown = input.value;
        setQuery(input, '');
      }
    });
    box.addEventListener('focusout', function(e) {
      var input = e.target;
      if (input.tagName !== 'INPUT') return;
      setTimeout(function() {
        if (!box.contains(document.activeElement) && !input.value && shown) {
          var current = sel.options[sel.selectedIndex];
          setQuery(input, current ? current.textContent : shown);
        }
      }, 0);
    });
  } else {
    sel.addEventListener('change', function() { onPick(sel.value); });
  }
}

function setView(id) {
  if (id === activeMandateId) return;
  activeMandateId = id;
  activeWardId = null;
  activeCatId = null;
  filterKey = '';
  if (myMandates().length <= 4) renderViewingControl();   // chips: refresh pressed state
  updateSummary();
  if (activeTab === 'report') { loadReportTab(); }
  else if (activeTab === 'team') { renderFilters(); renderContent(); }
  else if (activeTab === 'overview') {
    // Item 8c-2: choosing an area above also chooses the office shown.
    var vm = id === null ? null : findMandate(id);
    if (vm && vm.role !== 'FIELD_WORKER') { ovOfficeKey = officeKeyOf(vm); ovMla = null; ovSort = { col: null, dir: 'desc' }; }
    renderFilters(); loadOverview();
  }
  else { renderFilters(); renderContent(); }
}

// ================= Ward filter =================
function wardOptionsForTab() {
  if (activeTab === 'report') {
    var list = (reportData && reportData.wards) ? reportData.wards.slice() : [];
    return list;
  }
  var map = {};
  casesInView().forEach(function(c) {
    var w = map[c.localUnit.id] || (map[c.localUnit.id] = { id: c.localUnit.id, name: c.localUnit.name, count: 0 });
    w.count++;
  });
  return Object.keys(map).map(function(k) { return map[k]; })
    .sort(function(a, b) { return String(a.name).localeCompare(String(b.name)); });
}

function renderFilters() {
  var slot = document.getElementById('filter-slot');
  if (!slot) return;
  if (activeTab === 'report' && (!reportData || reportData.error)) return;   // built once data is in
  if (activeTab === 'team') { renderTeamFilter(slot); return; }
  if (activeTab === 'overview') { renderOverviewFilter(slot); return; }
  if (activeTab === 'audit') { slot.innerHTML = ''; return; }
  var key = activeTab + '|' + mandateIdForApi() + '|' + reportFrom + '|' + reportTo;
  if (key === filterKey && slot.innerHTML) return;   // keep the box (and keyboard focus) as it is
  filterKey = key;
  var wards = wardOptionsForTab();
  if (activeWardId && !wards.some(function(w) { return w.id === activeWardId; })) {
    wards.push({ id: activeWardId, name: wardNameFor(activeWardId), count: 0 });
  }
  if (wards.length <= 1 && !activeWardId) { slot.innerHTML = ''; return; }
  var total = wards.reduce(function(n, w) { return n + w.count; }, 0);
  var opts = '<option value="">' + esc(total === 1 ? T('rep.all_wards_one') : T('rep.all_wards', { n: total })) + '</option>' +
    wards.map(function(w) {
      return '<option value="' + esc(w.id) + '">' + esc(w.name) + ' (' + w.count + ')</option>';
    }).join('');
  slot.innerHTML = '<div class="control-box filter-box no-print"><label class="control-label" for="ward-select">' + esc(T('rep.ward')) + '</label>' +
    '<select id="ward-select">' + opts + '</select></div>';
  var sel = document.getElementById('ward-select');
  sel.value = activeWardId || '';
  enhanceOrListen(sel, function(value) { setWard(value === '' ? null : value); }, 'rep.no_wards_match');
}

function setWard(id) {
  if (id === activeWardId) return;
  ovJump = null;
  activeWardId = id;
  updateSummary();
  if (activeTab === 'report') loadReportTab();
  else renderContent();
}

async function signOut() {

}

// A session that ran out while the page was open (1 hour idle, 24 hours at
// most): any 401 from our API shows the sign-in screen.
(function () {
  var realFetch = window.fetch.bind(window);
  window.fetch = function (input, opts) {
    return realFetch(input, opts).then(function (res) {
      var u = typeof input === 'string' ? input : (input && input.url) || '';
      if (res.status === 401 && u.indexOf('/api/') === 0 && u.indexOf('/api/auth/') !== 0 && currentMe && currentMe.via === 'google') {
        currentMe = null;
        renderSignIn('timeout');
      }
      return res;
    });
  };
})();

// The words shown for where an observation stands, from the office's side.
function auStatus(o) {
  if (o.status === 'ISSUED') return { key: 'rep.au_st_reply', cls: 'pending' };
  if (o.status === 'RESPONDED' && o.sentBack) return { key: 'rep.au_st_sentback', cls: 'escalated' };
  if (o.status === 'RESPONDED' && o.response && o.response.agree) return { key: 'rep.au_st_done', cls: 'pending' };
  if (o.status === 'RESPONDED') return { key: 'rep.au_st_disagreed', cls: 'neutral' };
  if (o.status === 'DONE_REPORTED') return { key: 'rep.au_st_checking', cls: 'neutral' };
  if (o.status === 'CLOSED') return { key: 'rep.au_st_closed', cls: 'resolved' };
  if (o.status === 'RISK_ACCEPTED') return { key: 'rep.au_st_risk', cls: 'neutral' };

}

function attachAuditHandlers() {
  document.querySelectorAll('.au-open').forEach(function(b) { b.addEventListener('click', function() { openAudit(b.getAttribute('data-id')); }); });
  var back = document.getElementById('au-back');
  if (back) back.addEventListener('click', function() {
    var was = auditId; auditId = null; auditDetail = null; auditForms = {}; auditNotice = '';
    if (location.hash.indexOf('#audit=') === 0) history.replaceState(null, '', location.pathname + location.search);
    renderContent();
    var btn = was ? document.querySelector('.au-open[data-id="' + (window.CSS && CSS.escape ? CSS.escape(was) : was) + '"]') : null;
    if (btn) btn.focus(); else { var h = document.getElementById('au-title'); if (h) h.focus(); }
  });
  document.querySelectorAll('.au-case').forEach(function(b) { b.addEventListener('click', function() { showCaseFromAudit(b.getAttribute('data-id')); }); });
  document.querySelectorAll('input[name="au-agree"]').forEach(function(r) { r.addEventListener('change', function() {
    var w = document.getElementById('au-plan-wrap'); if (w) w.hidden = r.value === '0' && r.checked;
  }); });
  document.querySelectorAll('form.au-form').forEach(function(fm) { fm.addEventListener('submit', function(ev) { ev.preventDefault(); submitAudit(fm.getAttribute('data-form')); }); });
}

async function openAudit(id) {
  auditId = id; auditDetail = null; auditForms = {}; auditNotice = '';
  if (location.hash !== '#audit=' + encodeURIComponent(id)) history.replaceState(null, '', location.pathname + location.search + '#audit=' + encodeURIComponent(id));
  renderContent();
  await loadAuditDetail();
  var h = document.getElementById('au-d-title'); if (h) h.focus();
}
async function loadAuditDetail() {
  try {
    var res = await fetch('/api/observations?id=' + encodeURIComponent(auditId));
    var data = await res.json().catch(function() { return {}; });
    auditDetail = res.ok ? data : { error: data.code || 'error' };
  } catch (e) { auditDetail = { error: 'network' }; }
  if (activeTab === 'audit') renderContent();
}

var AU_ERR = { REQUIRED: 'rep.au_e_required', LENGTH: 'rep.au_e_length', DATE: 'rep.au_e_date', PAST: 'rep.au_e_past' };
async function submitAudit(form) {
  var g = function(id) { var el = document.getElementById('au-' + form + '-' + id); return el ? el.value : ''; };
  var agreeEl = document.querySelector('input[name="au-agree"]:checked');
  var values = form === 'respond' ? { agree: agreeEl ? agreeEl.value : '', text: g('text'), actionPlan: g('actionPlan'), targetDate: g('targetDate') }
    : form === 'report_done' ? { evidence: g('evidence') } : { text: g('text') };
  var errors = {};
  // Checked here first, so mistakes show next to the field at once.
  if (form === 'respond') {
    if (!values.agree) errors.agree = T('rep.au_e_agree');
    if (values.text.trim().length < 10) errors.text = T('rep.au_e_text');
    if (values.agree === '1') {
      if (values.actionPlan.trim().length < 10) errors.actionPlan = T('rep.au_e_plan');
      if (!values.targetDate) errors.targetDate = T('rep.au_e_target');
      else if (values.targetDate < todayIstDay()) errors.targetDate = T('rep.au_e_past');
    }
  } else if (form === 'report_done') {
    if (values.evidence.trim().length < 10) errors.evidence = T('rep.au_e_evidence');
  } else if (values.text.trim().length < 2) errors.text = T('rep.au_e_comment');
  auditForms[form] = { values: values, errors: errors, busy: !Object.keys(errors).length };
  auditNotice = '';
  renderContent();
  if (Object.keys(errors).length) { auFocusError(); return; }
  var payload = { action: form, id: auditId };
  if (form === 'respond') { payload.agree = values.agree === '1'; payload.text = values.text; payload.actionPlan = values.agree === '1' ? values.actionPlan : ''; payload.targetDate = values.agree === '1' ? values.targetDate : ''; }
  else if (form === 'report_done') payload.evidence = values.evidence;
  else payload.text = values.text;
  var res, data;
  try {
    res = await fetch('/api/observations', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    data = await res.json().catch(function() { return {}; });
  } catch (e) { res = null; data = {}; }
  if (!res || !res.ok) {
    var fe = {};
    Object.keys((data && data.fields) || {}).forEach(function(k) { fe[k] = T(AU_ERR[data.fields[k]] || 'rep.au_e_required'); });
    if (!Object.keys(fe).length) fe.form = !res ? T('rep.au_e_network') : data.code === 'STALE' || data.code === 'STAGE' ? T('rep.au_e_stale') : errText(data.error);
    auditForms[form] = { values: values, errors: fe, busy: false };
    renderContent(); auFocusError(); return;
  }
  auditForms = {};
  auditNotice = T('rep.au_ok_' + form);
  await fetchAuditList();
  updateAuditTabLabel();
  await loadAuditDetail();
  var n = document.getElementById('au-notice'); if (n) n.focus();
}

async function loadReportTab() {
  reportData = null;
  renderContent();
  try {
    var qs = new URLSearchParams();
    qs.set('mandateId', mandateIdForApi());
    if (reportFrom) qs.set('from', reportFrom);
    if (reportTo) qs.set('to', reportTo);
    if (activeWardId) qs.set('ward', activeWardId);
    var res = await fetch('/api/grievances/report?' + qs.toString());
    if (res.status === 403 && activeWardId) {
      // The chosen ward isn't part of this view: fall back to all wards.
      activeWardId = null;
      return loadReportTab();
    }
    reportData = await res.json();
    if (!res.ok) reportData = { error: true };
  } catch (err) {
    reportData = { error: true };
  }
  if (activeTab !== 'report') return;
  renderFilters();
  updateSummary();
  renderContent();
}

function toCsvRow(vals) {
  return vals.map(function(v) { return '"' + String(v).replace(/"/g, '""') + '"'; }).join(',');
}

function downloadReportCsv() {
  if (!reportData || reportData.error) return;
  var headers = ['Tracking Ref', 'Category', 'Local Unit', 'Status', 'Created At', 'Acknowledged At', 'Resolved At', 'Follow-ups', 'Disputed'];
  var rows = reportData.cases.map(function(c) {
    return toCsvRow([c.trackingRef, c.category, c.localUnit, c.status, c.createdAt, c.acknowledgedAt || '', c.resolvedAt || '', c.followupCount, c.disputed ? 'Yes' : 'No']);
  });
  var csv = toCsvRow(headers) + '\n' + rows.join('\n');
  // Leading byte-order mark so Excel opens any Hindi text correctly.
  var blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'grieviq-report-' + reportData.mandate.id + (reportData.ward ? '-' + reportData.ward.id : '') + '-' + new Date().toISOString().slice(0, 10) + '.csv';
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function generateReportPdf() {
  if (!reportData || reportData.error) return;
  var s = reportData.stats;
  var scopeName = reportScopeName();
  var rangeLabel = (reportData.from ? formatDateOnly(reportData.from) : 'All time') + ' to ' + (reportData.to ? formatDateOnly(reportData.to) : 'present');

  var jsPDFCtor = window.jspdf.jsPDF;
  var doc = new jsPDFCtor();

  doc.setFont('helvetica', 'bold');
  doc.setFontSize(16);
  doc.text('GrievIQ Performance Report', 14, 18);

  doc.setFont('helvetica', 'normal');
  doc.setFontSize(11);
  doc.text(scopeName, 14, 26);
  doc.setFontSize(9);
  doc.setTextColor(100);
  doc.text(rangeLabel + '  |  Generated ' + new Date().toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' }), 14, 32);
  doc.setTextColor(0);

  var statY = 42;
  var stats = [
    ['Total', String(s.totalCases)],
    ['Avg. ack', fmtHours(s.avgAckHours)],
    ['Avg. resolve', fmtHours(s.avgResolveHours)],
    ['Resolved', String(s.resolvedCount)],
    ['Escalation', s.escalationRate === null ? '—' : s.escalationRate + '%'],
    ['Dispute', s.disputeRate === null ? '—' : s.disputeRate + '%'],
    ['No follow-up', String(s.noFollowupCount)]
  ];
  var colWidth = 26;
  stats.forEach(function(st, i) {
    var x = 14 + i * colWidth;
    doc.setFont('helvetica', 'bold');
    doc.setFontSize(11);
    doc.text(st[1], x, statY);
    doc.setFont('helvetica', 'normal');
    doc.setFontSize(6.5);
    doc.setTextColor(100);
    doc.text(st[0], x, statY + 5);
    doc.setTextColor(0);
  });

  var tableRows = reportData.cases.map(function(c) {
    return [c.trackingRef, c.category, c.status.toLowerCase().replace('_', ' '), formatDateOnly(c.createdAt), formatDateOnly(c.resolvedAt), String(c.followupCount)];
  });

  doc.autoTable({
    head: [['Tracking ref', 'Category', 'Status', 'Filed', 'Resolved', 'Follow-ups']],
    body: tableRows,
    startY: statY + 12,
    styles: { fontSize: 8 },
    headStyles: { fillColor: [27, 95, 168] }
  });

  var fileScope = scopeName.replace(/[^a-z0-9]+/gi, '-').toLowerCase();
  doc.save('grieviq-report-' + fileScope + '.pdf');
}

function attachResolveHandlers() {
  // Item 7b: "Mark resolved" opens a short form (what was done + "after"
  // photos or the reason there are none). Form state lives in drafts[] so
  // redraws (language switch, filters) keep what was typed.
  function redraw(id, focusSel) {
    renderContent();
    if (focusSel) { var el = document.querySelector(focusSel); if (el) el.focus(); }
  }
  function draft(id) { return drafts[id]; }

  document.querySelectorAll('.mark-resolved-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var id = btn.getAttribute('data-id');
      drafts[id] = { open: true, note: '', photos: [], uploading: 0, noPhoto: false, reason: '', errors: {}, busy: false };
      redraw(id, '#rnote-' + cssId(id));
      // Ask for the location as the form opens, so it is ready by the time
      // a photo has been taken.
      startLocation(drafts[id], id);
      updateLocLine(id);
    });
  });
  // An error goes away as soon as that field is corrected (no redraw, so
  // typing is never interrupted).
  function clearFieldError(el, d, key, errId) {
    if (!d.errors[key]) return;
    var ok = key === 'note' ? el.value.trim().length >= 10 : el.value.trim().length >= 10;
    if (!ok) return;
    d.errors[key] = '';
    el.removeAttribute('aria-invalid');
    var err = document.getElementById(errId);
    if (err) err.textContent = '';
  }
  document.querySelectorAll('.r-note').forEach(function(el) {
    el.addEventListener('input', function() {
      var id = el.getAttribute('data-id'), d = draft(id);
      if (!d) return;
      d.note = el.value;
      clearFieldError(el, d, 'note', 'rnote-err-' + id);
    });
  });
  document.querySelectorAll('.r-reason').forEach(function(el) {
    el.addEventListener('input', function() {
      var id = el.getAttribute('data-id'), d = draft(id);
      if (!d) return;
      d.reason = el.value;
      clearFieldError(el, d, 'reason', 'rreason-err-' + id);
    });
  });
  document.querySelectorAll('.r-nophoto').forEach(function(el) {
    el.addEventListener('change', function() {
      var id = el.getAttribute('data-id'), d = draft(id);
      if (!d) return;
      d.noPhoto = el.checked; d.errors.photos = ''; d.errors.reason = '';
      redraw(id, el.checked ? '#rreason-' + cssId(id) : '#rphoto-' + cssId(id));
    });
  });
  document.querySelectorAll('.r-remove').forEach(function(el) {
    el.addEventListener('click', function() {
      var id = el.getAttribute('data-id'), d = draft(id);
      if (!d) return;
      d.photos = d.photos.filter(function(p) { return p.id !== el.getAttribute('data-photo'); });
      redraw(id, '#rphoto-' + cssId(id));
    });
  });
  document.querySelectorAll('.r-loc-retry').forEach(function(el) {
    el.addEventListener('click', function() {
      var id = el.getAttribute('data-id'), d = draft(id);
      if (!d) return;
      d.loc = null; d.locPromise = null;
      startLocation(d, id);
      updateLocLine(id);
    });
  });
  document.querySelectorAll('.r-cancel').forEach(function(el) {
    el.addEventListener('click', function() {
      var id = el.getAttribute('data-id');
      delete drafts[id];
      redraw(id, '.mark-resolved-btn[data-id="' + cssId(id) + '"]');
    });
  });
  document.querySelectorAll('.r-photo').forEach(function(input) {
    input.addEventListener('change', async function() {
      var id = input.getAttribute('data-id'), d = draft(id);
      if (!d) return;
      d.errors.photos = '';
      var files = Array.prototype.slice.call(input.files || []);
      var room = MAX_RES_PHOTOS - d.photos.length - d.uploading;
      if (files.length > room) { d.errors.photos = T('rep.r_err_max'); files = files.slice(0, Math.max(0, room)); }
      files = files.filter(function(f) {
        if (f.size > 5 * 1024 * 1024) { d.errors.photos = T('rep.r_err_size'); return false; }
        return true;
      });
      d.uploading += files.length;
      redraw(id);
      // Where the rep is right now (asked once; refreshed after 2 minutes).
      if (files.length) await startLocation(d, id);
      for (var i = 0; i < files.length; i++) {
        try {
          var fd = new FormData();
          fd.append('photo', files[i]);
          fd.append('dev_status', d.loc ? d.loc.status : 'UNAVAILABLE');
          if (d.loc && d.loc.status === 'OK') {
            fd.append('dev_lat', String(d.loc.lat));
            fd.append('dev_lng', String(d.loc.lng));
            fd.append('dev_acc', String(d.loc.acc));
          }
          // Small preview made on the phone (item 7c); the original is kept.
          var prev = await GIQPhoto.preview(files[i]);
          var h = prev.dhash || await visualFingerprint(files[i]);
          if (h) fd.append('dhash', h);
          if (prev.thumb) fd.append('thumb', prev.thumb, 'thumb.jpg');
          var res = await fetch('/api/grievances/' + encodeURIComponent(id) + '/resolution-photo', { method: 'POST', body: fd });
          var data = await res.json().catch(function() { return {}; });
          if (!res.ok) d.errors.photos = uploadErr(data);
          else d.photos.push({ id: data.id, url: data.url, thumbUrl: data.thumbUrl || data.url, warnings: data.warnings || [] });
        } catch (e) {
          d.errors.photos = T('common.network_error');
        }
        d.uploading--;
        redraw(id);
      }
      var again = document.getElementById('rphoto-' + id);
      if (again && !again.disabled) again.focus();
    });
  });
  document.querySelectorAll('.r-submit').forEach(function(btn) {
    btn.addEventListener('click', async function() {
      var id = btn.getAttribute('data-id'), d = draft(id);
      if (!d) return;
      d.errors = {};
      // Read what is in the boxes now (phone keyboards can skip input events).
      var noteEl = document.getElementById('rnote-' + id), reasonEl = document.getElementById('rreason-' + id);
      if (noteEl) d.note = noteEl.value;
      if (reasonEl) d.reason = reasonEl.value;
      var note = d.note.trim(), reason = d.reason.trim();
      if (note.length < 10) d.errors.note = T('rep.r_err_note');
      if (!d.photos.length && !d.noPhoto) d.errors.photos = T('rep.r_err_photo');
      if (!d.photos.length && d.noPhoto && reason.length < 10) d.errors.reason = T('rep.r_err_reason');
      if (d.errors.note || d.errors.photos || d.errors.reason) {
        redraw(id, d.errors.note ? '#rnote-' + cssId(id) : d.errors.photos ? '#rphoto-' + cssId(id) : '#rreason-' + cssId(id));
        return;
      }
      d.busy = true;
      redraw(id);
      try {
        var res = await fetch('/api/grievances/' + encodeURIComponent(id) + '/mark-resolved', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ note: note, photoIds: d.photos.map(function(p) { return p.id; }), noPhotoReason: d.photos.length ? '' : reason }),
        });
        var data = await res.json().catch(function() { return {}; });
        if (!res.ok || data.error) {
          d.busy = false;
          var fe = data.fields || {};
          if (fe.note) d.errors.note = T('rep.r_err_note');
          if (fe.photos) d.errors.photos = T(fe.photos === 'PHOTO_MISSING' ? 'rep.r_err_missing' : 'rep.r_err_photo');
          if (!fe.note && !fe.photos) d.errors.form = errText(data.error);
          redraw(id, '#resolve-form-' + cssId(id) + ' [aria-invalid="true"]');
          return;
        }
        delete drafts[id];
        await init();
        if (data.status === 'SUBMITTED_FOR_APPROVAL') {
          var st2 = document.getElementById('resolve-status');
          if (st2) st2.textContent = T('rep.fw_submitted');
        }
        if (data.warning) {
          var st = document.getElementById('resolve-status');
          if (st) st.textContent = T('rep.r_email_failed');
        }
      } catch (err) {
        d.busy = false;
        d.errors.form = T('common.network_error');
        redraw(id);
      }
    });
  });
}

// The phone's current location, with the rep's permission (the browser asks).
// Resolves to { status: 'OK', lat, lng, acc, at } or { status: 'DENIED' | 'UNAVAILABLE', at }.
// The browser's own timeout doesn't count the time the permission question
// is on screen, so there is no short timer of ours around it. If a precise
// (GPS) fix isn't found in time -- common indoors -- it tries once more with
// a quicker, rougher fix. A 2-minute safety net covers browsers that never answer.
function currentLocation() {
  function ask(high, timeout) {
    return new Promise(function(resolve) {
      navigator.geolocation.getCurrentPosition(function(pos) {
        resolve({ status: 'OK', lat: pos.coords.latitude, lng: pos.coords.longitude, acc: pos.coords.accuracy, at: Date.now() });
      }, function(err) {
        resolve({ status: err && err.code === 1 ? 'DENIED' : 'UNAVAILABLE', at: Date.now() });
      }, { enableHighAccuracy: high, timeout: timeout, maximumAge: 60000 });
    });
  }
  if (!navigator.geolocation) return Promise.resolve({ status: 'UNAVAILABLE', at: Date.now() });
  var safety = new Promise(function(resolve) { setTimeout(function() { resolve({ status: 'UNAVAILABLE', at: Date.now() }); }, 120000); });
  var attempt = ask(true, 20000).then(function(r) { return r.status === 'UNAVAILABLE' ? ask(false, 20000) : r; });
  return Promise.race([attempt, safety]);
}

function locLineHtml(d, id) {
  var text = d.locating && !d.loc ? T('rep.r_loc_finding')
    : !d.loc ? ''
    : d.loc.status === 'OK' ? T('rep.r_loc_ok', { m: Math.round(d.loc.acc || 0) })
    : d.loc.status === 'DENIED' ? T('rep.r_loc_no') : T('rep.r_loc_unavailable');
  return esc(text) + (d.loc && d.loc.status !== 'OK' && !d.locating
    ? ' <button type="button" class="r-loc-retry" data-id="' + esc(id) + '">' + esc(T('rep.r_loc_retry')) + '</button>' : '');
}

// Updates just the location line, so whatever the rep is typing keeps focus.
function updateLocLine(id) {
  var d = drafts[id], el = document.getElementById('rloc-' + id);
  if (!d || !el) return;
  el.innerHTML = locLineHtml(d, id);
  var btn = el.querySelector('.r-loc-retry');
  if (btn) btn.addEventListener('click', function() {
    d.loc = null; d.locPromise = null;
    startLocation(d, id);
    updateLocLine(id);
  });
}

// Starts finding the location (once per form); returns the pending promise.
function startLocation(d, id) {
  if (d.locPromise && d.loc && Date.now() - d.loc.at < 120000) return d.locPromise;
  if (d.locPromise && !d.loc) return d.locPromise;
  d.locating = true;
  d.locPromise = currentLocation().then(function(loc) {
    d.loc = loc; d.locating = false;
    if (drafts[id] === d) updateLocLine(id);
    return loc;
  });
  return d.locPromise;
}

function cssId(id) { return window.CSS && CSS.escape ? CSS.escape(id) : String(id).replace(/["\\]/g, '\\$&'); }

function uploadErr(data) {
  var map = { TOO_BIG: 'rep.r_err_size', BAD_TYPE: 'rep.r_err_type', TOO_MANY: 'rep.r_err_many', NO_FILE: 'rep.r_err_type', STORAGE_NOT_SET: 'rep.r_err_storage' };
  return data && map[data.code] ? T(map[data.code]) : errText(data && data.error);
}

// Visual fingerprint (difference hash): shrink to 9x8 grey pixels and record
// whether each pixel is brighter than the next. Similar-looking photos get
// fingerprints that differ in only a few of the 64 bits, even after
// resizing or recompressing. Best effort: returns null if the browser
// can't read the image.
async function visualFingerprint(file) {
  try {
    var bmp = await createImageBitmap(file);
    var cv = document.createElement('canvas');
    cv.width = 9; cv.height = 8;
    var cx = cv.getContext('2d');
    cx.drawImage(bmp, 0, 0, 9, 8);
    var px = cx.getImageData(0, 0, 9, 8).data;
    var hex = '', nib = 0, n = 0;
    for (var y = 0; y < 8; y++) {
      for (var x = 0; x < 8; x++) {
        var a = (y * 9 + x) * 4, b = a + 4;
        var l = px[a] * 0.299 + px[a + 1] * 0.587 + px[a + 2] * 0.114;
        var r = px[b] * 0.299 + px[b + 1] * 0.587 + px[b + 2] * 0.114;
        nib = (nib << 1) | (l > r ? 1 : 0);
        if (++n % 4 === 0) { hex += nib.toString(16); nib = 0; }
      }
    }
    return hex;
  } catch (e) { return null; }
}

async function init() {
  // Item 8a: the outcome of a Google sign-in comes back as ?signin=...;
  // read it once and tidy the address.
  var params = new URLSearchParams(location.search);
  var signinOutcome = params.get('signin');
  if (signinOutcome !== null) { params.delete('signin'); history.replaceState(null, '', location.pathname + (params.toString() ? '?' + params : '') + location.hash); }
  var meRes = await fetch('/api/me');
  if (!meRes.ok) {
    if (meRes.status === 403) {
      renderNotice(T('rep.not_provisioned_t'), T('rep.not_provisioned'), true);
    } else if (meRes.status === 401) {
      renderSignIn(signinOutcome || '');
    } else {
      renderNotice(T('rep.session_t'), T('rep.session'));
    }
    return;
  }
  currentMe = await meRes.json();
  // A saved view that no longer exists (mandate removed) falls back to all.
  if (activeMandateId !== null && !findMandate(activeMandateId)) { activeMandateId = null; activeWardId = null; }

  var casesRes = await fetch('/api/grievances');
  var casesData = await casesRes.json();
  currentCases = casesData.grievances || [];
  teamsData = casesData.teams || {};
  if (casesData.workloadWarn) workloadWarn = casesData.workloadWarn;
  // Item 9c: the Audit tab appears once the office has an observation; a
  // link from an audit email (#audit=<id>) opens it directly.
  await fetchAuditList();
  var auHash = /^#audit=(.+)$/.exec(location.hash);
  if (auHash && hasAuditTab()) { activeTab = 'audit'; auditId = decodeURIComponent(auHash[1]); }
  if (activeTab === 'audit' && !hasAuditTab()) activeTab = 'cases';
  // Item 8b: tabs this person can't use fall back to Cases.
  if ((activeTab === 'report' && !canSeeReport()) || (activeTab === 'team' && !teamOffices().length) || (activeTab === 'overview' && !ovOffices().length)) activeTab = 'cases';

  renderShell();
  if (activeTab === 'report') loadReportTab();
  else if (activeTab === 'team') { renderFilters(); loadTeamTab(); }
  else if (activeTab === 'overview') { renderFilters(); loadOverview(); }
  else if (activeTab === 'audit') { renderContent(); if (auditId) loadAuditDetail(); }
  else { renderFilters(); renderContent(); }
}

// Switching हिन्दी / English redraws the console from the data already
// loaded (no reload, the chosen area / ward / tab are kept).
document.addEventListener('giq:lang', function() {
  if (!currentMe) { if (signInShown !== null && document.querySelector('.signin-card')) renderSignIn(signInShown === 'none' ? '' : signInShown); return; }
  renderShell();
  if (activeTab === 'report' && reportData && !reportData.error) { renderFilters(); updateSummary(); renderContent(); }
  else if (activeTab === 'report') loadReportTab();
  else { renderFilters(); renderContent(); }
});

init();
</script>
