<script>try{if(localStorage.getItem("griq-admin-theme")==="light")document.documentElement.classList.add("light-theme");}catch(e){}</script><style>
  :root {
    --admin-bg: #14181f;
    --admin-panel: #1c222c;
    --admin-border: #2c3543;
    --admin-text: #e6e9ee;
    --admin-muted: #9aa4b2;
    --admin-accent: #4c7cf0;
    --admin-danger: #e2564f;
    --admin-danger-bg: #3a2323;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--admin-bg);
    color: var(--admin-text);
  }
  header {
    background: #0e1116;
    border-bottom: 1px solid var(--admin-border);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header .brand { font-weight: 600; font-size: 15px; letter-spacing: 0.02em; }
  header .brand span { color: var(--admin-accent); }
  nav a {
    color: var(--admin-muted);
    text-decoration: none;
    font-size: 14px;
    margin-left: 20px;
  }
  nav a.active { color: var(--admin-text); font-weight: 600; }
  main { max-width: 860px; margin: 0 auto; padding: 32px 24px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.subtitle { color: var(--admin-muted); margin: 0 0 28px; font-size: 14px; }
  .panel {
    background: var(--admin-panel);
    border: 1px solid var(--admin-border);
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 24px;
  }
  .panel h2 { font-size: 15px; margin: 0 0 16px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--admin-border); }
  th { color: var(--admin-muted); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: 0.03em; }
  .role-badge {
    display: inline-block;
    padding: 2px 9px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
  }
  .role-super_admin { background: #2c1f3d; color: #b98cf0; }
  .role-operations_admin { background: #1f3040; color: #6fb0e8; }
  .role-data_moderator { background: #233a2b; color: #7fce8f; }
  .role-auditor { background: #3a3423; color: #d8c26f; }
  .role-data_entry_operator { background: #1f3a3a; color: #6fd0cf; }

  html.light-theme {
    --admin-bg: #f4f5f7;
    --admin-panel: #ffffff;
    --admin-border: #dde1e6;
    --admin-text: #14181f;
    --admin-muted: #5b6472;
    --admin-accent: #3d6be0;
    --admin-danger: #c9463c;
    --admin-danger-bg: #fbe7e5;
  }
  html.light-theme body { background: var(--admin-bg); color: var(--admin-text); }
  html.light-theme header { background: #ffffff; border-bottom-color: var(--admin-border); }
  html.light-theme header .brand { color: var(--admin-text); }
  html.light-theme nav a { color: var(--admin-muted); }
  html.light-theme nav a.active { color: var(--admin-text); }
  html.light-theme .panel { background: var(--admin-panel); border-color: var(--admin-border); }
  html.light-theme th, html.light-theme td { border-bottom-color: var(--admin-border); }
  html.light-theme select, html.light-theme input[type="email"] {
    background: #ffffff; border-color: var(--admin-border); color: var(--admin-text);
  }
  html.light-theme button { background: #eef0f3; border-color: var(--admin-border); color: var(--admin-text); }
  html.light-theme button:hover { background: #e2e5ea; }
  html.light-theme button.primary { background: var(--admin-accent); border-color: var(--admin-accent); color: #fff; }
  html.light-theme button.danger { background: #fbe7e5; border-color: #e8c3bf; color: var(--admin-danger); }
  .theme-toggle {
    background: none; border: 1px solid var(--admin-border); border-radius: 6px;
    color: var(--admin-muted); font-size: 13px; padding: 5px 10px; cursor: pointer; margin-left: 20px;
  }
  .theme-toggle:hover { color: var(--admin-text); }
  select, input[type="email"] {
    background: #11151c;
    border: 1px solid var(--admin-border);
    color: var(--admin-text);
    border-radius: 6px;
    padding: 7px 10px;
    font-size: 14px;
  }
  .row-actions { display: flex; gap: 8px; align-items: center; }
  button {
    font-size: 13px;
    padding: 6px 12px;
    border-radius: 6px;
    border: 1px solid var(--admin-border);
    background: #232a36;
    color: var(--admin-text);
    cursor: pointer;
  }
  button:hover { background: #2b3341; }
  button.primary { background: var(--admin-accent); border-color: var(--admin-accent); color: #fff; }
  button.primary:hover { background: #3d6be0; }
  button.danger { background: var(--admin-danger-bg); border-color: #5a2e2b; color: var(--admin-danger); }
  button.danger:hover { background: #472928; }
  .add-form { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .add-form input[type="email"] { flex: 1; min-width: 220px; }
  #status-msg { font-size: 13px; margin-top: 12px; min-height: 18px; }
  #status-msg.error { color: var(--admin-danger); }
  #status-msg.success { color: #7fce8f; }
  .muted { color: var(--admin-muted); font-size: 13px; }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
  header .lang-toggle { background: none; border: 1px solid var(--admin-border); color: var(--admin-muted); border-radius: 6px; font: inherit; font-size: 13px; padding: 5px 10px; margin-left: 20px; cursor: pointer; min-height: 30px; }
  header .lang-toggle:hover, header .lang-toggle:focus-visible { color: var(--admin-text); border-color: var(--admin-text); outline: none; }
  /* Item 10: staff records, status, leave cover */
  main { max-width: 980px; }
  .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 4px 16px; }
  .fld label { display: block; font-size: 13px; font-weight: 600; margin: 10px 0 4px; }
  .fld input[type=text], .fld input[type=email], .fld input[type=tel], .fld input[type=date], .fld select, .fld textarea { width: 100%; padding: 8px 10px; border-radius: 6px; border: 1px solid var(--admin-border); background: #11151c; color: var(--admin-text); font: inherit; font-size: 14px; }
  html.light-theme .fld input, html.light-theme .fld select, html.light-theme .fld textarea { background: #fff; }
  .fld [aria-invalid="true"] { border-color: var(--admin-danger); }
  .fld .hint { color: var(--admin-muted); font-size: 12px; margin: 0 0 4px; }
  .fld .check { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; margin-top: 12px; }
  .field-err { color: var(--admin-danger); font-size: 12.5px; margin-top: 4px; font-weight: 600; }
  .field-err:empty { display: none; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; align-items: center; }
  .note { font-size: 13px; color: var(--admin-muted); margin: 8px 0 0; line-height: 1.5; }
  .msg { font-size: 14px; margin: 0 0 16px; padding: 10px 12px; border-radius: 6px; }
  .msg:empty { display: none; }
  .msg.success { background: #1f3326; color: #a6e0b4; } .msg.error { background: var(--admin-danger-bg); color: var(--admin-danger); }
  html.light-theme .msg.success { background: #e6f4ea; color: #1f5f32; }
  .staff-list { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; }
  .staff-row, .row-actions > *, .row-form { min-width: 0; }
  .role-select, .row-form select, .row-form input { max-width: 100%; }
  .staff-row { border: 1px solid var(--admin-border); border-radius: 8px; padding: 14px 16px; }
  .staff-top { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: baseline; justify-content: space-between; }
  .staff-name { font-weight: 600; font-size: 15px; }
  .staff-name .missing { color: var(--admin-danger); font-weight: 600; font-size: 13px; }
  .staff-meta { font-size: 13px; color: var(--admin-muted); margin-top: 4px; line-height: 1.6; overflow-wrap: anywhere; }
  .badges { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .st { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .st-PRESENT { background: #233a2b; color: #7fce8f; } .st-ON_LEAVE { background: #3a3423; color: #d8c26f; } .st-LEFT { background: #2c3543; color: #9aa4b2; }
  .st-cover { background: #1f3040; color: #6fb0e8; }
  html.light-theme .st-PRESENT { background: #e6f4ea; color: #1f7a3a; } html.light-theme .st-ON_LEAVE { background: #fbf1d6; color: #7a5c1c; } html.light-theme .st-LEFT { background: #eef0f3; color: #5b6472; } html.light-theme .st-cover { background: #e6effb; color: #1d4e9a; }
  .row-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
  .row-form { border-top: 1px solid var(--admin-border); margin-top: 12px; padding-top: 4px; }
  .review { border: 1px solid var(--admin-border); border-left: 4px solid #d8c26f; border-radius: 8px; padding: 12px 14px; margin-bottom: 20px; }
  .review p { margin: 0 0 10px; font-size: 14px; line-height: 1.5; }
  .covers li { font-size: 14px; margin: 6px 0; line-height: 1.5; }
  details.panel > summary { cursor: pointer; font-weight: 600; font-size: 15px; }
  details.panel[open] > summary { margin-bottom: 12px; }
  button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 3px solid #FFDD00; outline-offset: 1px; }
</style>

<header>
  <div class="brand"><span class="brand-mark" aria-hidden="true" style="display:inline-flex;width:22px;height:22px;border-radius:6px;background:#13233F;align-items:center;justify-content:center;vertical-align:-5px;margin-right:8px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18)"><svg width="16" height="16" viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" focusable="false"><path d="M34.3 11.7A16 16 0 1 0 40 25H33"/><path d="M12.7 35.3 8 43l9.2-4.5z" fill="#fff"/><path d="M20 22l6 6 15-17" stroke="#E8B631"/></svg></span>GrievIQ <span data-i18n="adm.brand">Admin</span></div>
  <nav>
    <a href="/admin-dashboard.html" data-i18n="adm.nav_dashboard">Dashboard</a> <a href="/admin-visitors.html" data-i18n="adm.nav_visitors">Visitors</a> <a href="/admin-feedback.html" data-i18n="adm.nav_feedback">Feedback</a> <a href="/admin-messages.html" data-i18n="adm.nav_messages">Messages</a> <a href="/admin-cases.html" data-i18n="adm.nav_cases">Cases</a> <a href="/admin-checks.html" data-i18n="adm.nav_checks">Checks</a> <a href="/admin-areas.html" data-i18n="adm.nav_areas">Areas</a> <a href="/admin-import.html" data-i18n="adm.nav_import">Import</a>
    <a href="/admin-import-wards.html" data-i18n="adm.nav_boundaries">Ward boundaries</a>
    <a href="/admin-jurisdiction.html" data-i18n="adm.nav_jurisdiction">Jurisdiction</a>
    <a href="/admin-exceptions.html" data-i18n="adm.nav_exceptions">Exceptions</a> <a href="/admin-reviews.html" data-i18n="adm.nav_reviews">Reviews</a> <a href="/admin-change-requests.html" data-i18n="adm.nav_changes">Change requests</a> <a href="/admin-issue-types.html" data-i18n="adm.nav_issue_types">Issue types</a> <a href="/admin-staff.html" data-i18n="adm.nav_staff">Staff</a> <a href="/admin-audit.html" data-i18n="adm.nav_audit">Audit</a> <a href="/admin-retention.html" data-i18n="adm.nav_retention">Data retention</a>

<main>
  <h1 data-i18n="adm.st_title">Staff &amp; roles</h1>
  <p class="subtitle" id="page-sub" data-i18n="adm.st_sub">Manage who has admin access to GrievIQ, and what they're allowed to do.</p>
  <div class="msg" id="status-msg" role="status" tabindex="-1"></div>
  <div id="content"><p class="muted" data-i18n="adm.st_loading">Loading...</p></div>
</main>

<script>
// ---- Language (English / Hindi): text lives in /i18n.js ("adm.st_*", "adm.sf_*") ----
function T(key, vars) { return window.GIQ ? window.GIQ.t(key, vars) : key; }
function loc() { return window.GIQ ? window.GIQ.locale() : "en-IN"; }
const ROLE_LABELS = {
  super_admin: "adm.st_role_super_admin", operations_admin: "adm.st_role_operations_admin", data_moderator: "adm.st_role_data_moderator",
  auditor: "adm.st_role_auditor", data_entry_operator: "adm.st_role_data_entry_operator",
};
const ROLE_OPTS = { auditor: "adm.st_opt_auditor", data_entry_operator: "adm.st_opt_data_entry_operator" };
function roleLabel(r) { return ROLE_LABELS[r] ? T(ROLE_LABELS[r]) : r; }
function esc(v) { return String(v == null ? "" : v).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function day(d) { if (!d) return "—"; const x = new Date(String(d).length === 10 ? d + "T00:00:00+05:30" : String(d).replace(" ", "T") + (String(d).includes("T") ? "" : "Z")); return isNaN(x) ? String(d) : x.toLocaleDateString(loc(), { day: "numeric", month: "short", year: "numeric" }); }
function todayIst() { return new Date(Date.now() + 5.5 * 3600000).toISOString().slice(0, 10); }
function addDays(d, n) { return new Date(Date.parse(d + "T00:00:00Z") + n * 86400000).toISOString().slice(0, 10); }
function person(name, id, email) { return (name || email) + (id ? " (" + id + ")" : ""); }

let data = null, loadErr = null, lastStatus = null;
let addForm = { name: "", employeeId: "", phone: "", designation: "", email: "", role: "operations_admin", errors: {}, busy: false };
let rows = {};   // per email: { mode: "edit"|"leave"|"left"|"back", values, errors, busy }
let coverEnd = {};

function setStatus(key, type, vars) {
  lastStatus = key ? { key, type, vars } : null;
  const el = document.getElementById("status-msg");
  el.textContent = key ? T(key, vars) : "";
  el.className = "msg " + (type || "");
}
async function api(method, body) {
  try {
    const r = await fetch("/api/admin/staff", { method, headers: { "Content-Type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
    return { ok: r.ok, status: r.status, body: await r.json().catch(() => ({})) };
  } catch (e) { return { ok: false, status: 0, body: {} }; }
}
async function load() {
  const r = await api("GET");
  if (!r.ok) {
    loadErr = r.status === 0 ? "adm.st_err_network_load" : r.body.error === "NOT_ADMIN" ? "adm.st_err_not_admin" : r.body.error === "INSUFFICIENT_ROLE" ? "adm.st_err_role" : "adm.st_err_load";
    render(); return;
  }
  data = r.body; loadErr = null; render();
}

// Field error messages.
const ERR = {
  name: { LENGTH: "adm.sf_e_name" }, employeeId: { REQUIRED: "adm.sf_e_id", FORMAT: "adm.sf_e_id_format", TAKEN: "adm.sf_e_id_taken" },
  phone: { REQUIRED: "adm.sf_e_phone", FORMAT: "adm.sf_e_phone_format" }, designation: { LENGTH: "adm.sf_e_designation" },
  email: { FORMAT: "adm.st_err_email", TAKEN: "adm.sf_e_email_taken", FORMER: "adm.sf_e_email_former", SELF: "adm.sf_e_self_left", LAST_SUPER: "adm.sf_e_last_super", LEFT: "adm.sf_e_already_left", HAS_ACTIVITY: "adm.sf_e_has_activity", PREVIOUS: "adm.sf_e_email_previous", SELF_EMAIL: "adm.sf_e_self_email" },
  newEmail: { FORMAT: "adm.st_err_email", SAME: "adm.sf_e_email_same", TAKEN: "adm.sf_e_email_taken", FORMER: "adm.sf_e_email_former", PREVIOUS: "adm.sf_e_email_previous" },
  role: { REQUIRED: "adm.sf_e_role" },
  until: { DATE: "adm.sf_e_date", PAST: "adm.sf_e_past", TOO_LONG: "adm.sf_e_leave_long", COVER_TOO_LONG: "adm.sf_e_cover_long" },
  pause: { SELF: "adm.sf_e_pause_self", LAST_SUPER: "adm.sf_e_last_super" },
  coverEmail: { NOT_STAFF: "adm.sf_e_cover_staff", SAME: "adm.sf_e_cover_same", SUPER: "adm.sf_e_cover_super", AUDITOR: "adm.sf_e_cover_auditor", ALREADY_ALL: "adm.sf_e_cover_all", COVER_ON_LEAVE: "adm.sf_e_cover_leave", BUSY: "adm.sf_e_cover_busy", AWAY_IS_COVERING: "adm.sf_e_cover_away" },
  reason: { LENGTH: "adm.sf_e_reason" }, lastDay: { DATE: "adm.sf_e_date", TOO_FAR: "adm.sf_e_lastday_far" },
};
function serverErrors(body) {
  const out = {}, f = (body && body.fields) || {};
  Object.keys(f).forEach((k) => { const key = (ERR[k] || {})[f[k]]; out[k] = key ? T(key, { name: body.usedBy || "" }) : T("adm.err_detail", { msg: body.error || f[k] }); });
  if (!Object.keys(f).length) out.form = body && body.error ? T("adm.err_detail", { msg: body.error }) : T("adm.network");
  return out;
}
function fld(id, label, type, value, err, opts) {
  const o = opts || {};
  const hint = o.hint ? '<p class="hint" id="' + id + '-hint">' + esc(o.hint) + '</p>' : '';
  const desc = (o.hint ? id + '-hint ' : '') + id + '-err';
  const inv = err ? ' aria-invalid="true"' : '';
  let input;
  if (type === "select") input = '<select id="' + id + '" aria-describedby="' + desc + '"' + inv + '>' + o.options + '</select>';
  else if (type === "textarea") input = '<textarea id="' + id + '" rows="2" maxlength="300" aria-describedby="' + desc + '"' + inv + '>' + esc(value) + '</textarea>';
  else input = '<input type="' + type + '" id="' + id + '" value="' + esc(value) + '"' + (o.max ? ' maxlength="' + o.max + '"' : '') + (o.min ? ' min="' + o.min + '"' : '') + (o.maxDate ? ' max="' + o.maxDate + '"' : '') + (o.auto ? ' autocomplete="' + o.auto + '"' : '') + (o.ph ? ' placeholder="' + esc(o.ph) + '"' : '') + ' aria-describedby="' + desc + '"' + inv + '>';
  return '<div class="fld"><label for="' + id + '">' + esc(label) + '</label>' + hint + input + '<div class="field-err" id="' + id + '-err" role="alert">' + esc(err || "") + '</div></div>';
}
function roleOptions(sel) { return Object.keys(ROLE_LABELS).map((r) => '<option value="' + r + '"' + (r === sel ? " selected" : "") + '>' + esc(T(ROLE_OPTS[r] || ROLE_LABELS[r])) + '</option>').join(""); }

function render() {
  const c = document.getElementById("content");
  if (loadErr) { c.innerHTML = '<p class="muted">' + esc(T(loadErr)) + '</p>'; return; }
  if (!data) return;
  const man = data.canManage;
  document.getElementById("page-sub").textContent = T(man ? "adm.st_sub" : "adm.st_sub_readonly");
  let html = "";
  if (!data.ready) html += '<div class="msg error">' + esc(T("adm.sf_not_ready")) + '</div>';
  // 90-day review
  if (man && data.review && data.review.due) {
    html += '<div class="review" role="region" aria-label="' + esc(T("adm.sf_review_t")) + '"><p><b>' + esc(T("adm.sf_review_t")) + '</b><br>' +
      esc(data.review.lastAt ? T("adm.sf_review_last", { date: day(data.review.lastAt), by: data.review.by }) : T("adm.sf_review_never")) + ' ' + esc(T("adm.sf_review_ask", { n: data.review.everyDays })) + '</p>' +
      '<button type="button" class="primary" id="review-btn">' + esc(T("adm.sf_review_btn")) + '</button></div>';
  }
  // Leave covers running now
  const active = (data.covers || []).filter((x) => x.state === "ACTIVE");
  if (active.length) {
    html += '<div class="panel"><h2>' + esc(T("adm.sf_covers_t")) + '</h2><ul class="covers">' + active.map((x) => {
      const ce = coverEnd[x.id] || {};
      return '<li>' + esc(T("adm.sf_cover_line", { cover: person(x.coverName.name, x.coverName.employeeId, x.cover), away: person(x.awayName.name, x.awayName.employeeId, x.away), date: day(x.to) })) +
        '<span class="muted"> · ' + esc(x.reason) + '</span>' +
        (man ? (ce.open
          ? '<form class="cover-end" data-id="' + esc(x.id) + '" novalidate>' + fld("ce-" + x.id, T("adm.sf_f_end_reason"), "text", ce.reason || "", ce.err, { max: 300 }) +
            '<div class="actions"><button type="submit" class="danger"' + (ce.busy ? " disabled" : "") + '>' + esc(T("adm.sf_end_cover_btn")) + '</button> <button type="button" class="ce-cancel" data-id="' + esc(x.id) + '">' + esc(T("adm.cancel")) + '</button></div></form>'
          : ' <button type="button" class="ce-open" data-id="' + esc(x.id) + '">' + esc(T("adm.sf_end_cover")) + '</button>') : '') + '</li>';
    }).join("") + '</ul></div>';
  }
  // Add staff
  if (man) {
    const f = addForm, e = f.errors;
    html += '<form class="panel" id="add-panel" novalidate><h2>' + esc(T("adm.st_add_h")) + '</h2><div class="form-grid">' +
      fld("a-name", T("adm.sf_f_name"), "text", f.name, e.name, { max: 80, auto: "off" }) +

function focusFirst(scope) {
  const el = (scope || document).querySelector('[aria-invalid="true"]') || (scope || document).querySelector('.field-err:not(:empty)');
  if (el) { if (!/^(INPUT|SELECT|TEXTAREA)$/.test(el.tagName)) el.setAttribute("tabindex", "-1"); el.focus(); }
}
function openRow(email, mode) {
  const p = data.staff.concat(data.former).filter((x) => x.email === email)[0];
  rows = {}; rows[email] = { mode, errors: {}, values: mode === "edit" ? { name: p.name || "", employeeId: p.employeeId || "", phone: p.phoneMasked ? "" : (p.phone || ""), designation: p.designation || "" } : {} };
  setStatus(null); render();
  const f = document.querySelector('form.row-form[data-email="' + CSS.escape(email) + '"] input, form.row-form[data-email="' + CSS.escape(email) + '"] select');
  if (f) f.focus();
}
function readRow(form) {
  const g = (k) => { const el = form.querySelector("#r-" + k); return el ? (el.type === "checkbox" ? el.checked : el.value.trim()) : ""; };
  return { newEmail: g("newEmail"), name: g("name"), employeeId: g("employeeId"), phone: g("phone"), designation: g("designation"), until: g("until"), coverEmail: g("coverEmail"), reason: g("reason"), pause: g("pause") === true, lastDay: g("lastDay") };
}
function done(msgKey, vars) { rows = {}; setStatus(msgKey, "success", vars); return load().then(() => document.getElementById("status-msg").focus()); }

function attach() {
  const rv = document.getElementById("review-btn");
  if (rv) rv.addEventListener("click", async () => {
    const r = await api("POST", { action: "review" });
    if (!r.ok) { setStatus("adm.err_detail", "error", { msg: r.body.error || r.status }); return; }
    done("adm.sf_reviewed");
  });
  document.querySelectorAll(".ce-open").forEach((b) => b.addEventListener("click", () => { coverEnd = {}; coverEnd[b.dataset.id] = { open: true }; render(); const i = document.getElementById("ce-" + b.dataset.id); if (i) i.focus(); }));
  document.querySelectorAll(".ce-cancel").forEach((b) => b.addEventListener("click", () => { coverEnd = {}; render(); }));
  document.querySelectorAll("form.cover-end").forEach((f) => f.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const id = f.dataset.id, reason = document.getElementById("ce-" + id).value.trim();
    if (reason.length < 5) { coverEnd[id] = { open: true, reason, err: T("adm.sf_e_reason") }; render(); focusFirst(); return; }
    coverEnd[id] = { open: true, reason, busy: true }; render();
    const r = await api("POST", { action: "cover_end", id, reason });
    if (!r.ok) { coverEnd[id] = { open: true, reason, err: serverErrors(r.body).reason || serverErrors(r.body).form }; render(); focusFirst(); return; }
    coverEnd = {}; done("adm.sf_cover_ended_ok");
  }));
  const af = document.getElementById("add-panel");
  if (af) af.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const g = (id) => document.getElementById(id).value.trim();
    Object.assign(addForm, { name: g("a-name"), employeeId: g("a-employeeId"), phone: g("a-phone"), designation: g("a-designation"), email: g("new-email"), role: document.getElementById("new-role").value });
    const e = {};
    if (addForm.name.length < 2) e.name = T("adm.sf_e_name");
    if (!addForm.employeeId) e.employeeId = T("adm.sf_e_id");
    if (!addForm.phone) e.phone = T("adm.sf_e_phone");
    if (!addForm.email) e.email = T("adm.st_err_email");
    addForm.errors = e;
    if (Object.keys(e).length) { render(); focusFirst(document.getElementById("add-panel")); return; }
    addForm.busy = true; render();
    const r = await api("POST", Object.assign({ action: "add" }, addForm));
    addForm.busy = false;
    if (!r.ok) { addForm.errors = serverErrors(r.body); if (addForm.errors.email && !addForm.errors.form && r.body.fields && r.body.fields.email === "FORMAT") addForm.errors.email = T("adm.st_err_email"); render(); focusFirst(document.getElementById("add-panel")); return; }
    const added = addForm.email, role = roleLabel(addForm.role);
    addForm = { name: "", employeeId: "", phone: "", designation: "", email: "", role: "operations_admin", errors: {}, busy: false };
    done("adm.st_added", { email: added, role });
  });
  document.querySelectorAll(".staff-row").forEach((row) => {
    const email = row.dataset.email;
    const on = (sel, fn) => { const b = row.querySelector(sel); if (b) b.addEventListener("click", fn); };
    on(".act-edit", () => openRow(email, "edit"));
    on(".act-leave", () => openRow(email, "leave"));
    on(".act-left", () => openRow(email, "left"));
    on(".act-back", () => openRow(email, "back"));
    on(".act-delete", () => openRow(email, "delete"));
    on(".act-email", () => openRow(email, "email"));
    on(".row-cancel", () => { rows = {}; render(); const b = document.querySelector('.staff-row[data-email="' + CSS.escape(email) + '"] button'); if (b) b.focus(); });
    on(".act-present", async () => {
      const r = await api("POST", { action: "present", email });
      if (!r.ok) { setStatus("adm.err_detail", "error", { msg: r.body.error || r.status }); return; }
      done("adm.sf_present_ok", { name: email });
    });
    on(".save-role-btn", async () => {
      const role = row.querySelector(".role-select").value;
      setStatus("adm.st_saving", "");
      const r = await api("PATCH", { email, role });
      if (!r.ok) { setStatus(r.status === 0 ? "adm.st_err_network_update" : "adm.err_detail", "error", { msg: r.body.error || r.status }); return; }
      done("adm.st_updated", { email, role: roleLabel(role) });
    });
    const sel = row.querySelector("#r-coverEmail");
    if (sel) sel.addEventListener("change", () => { const w = document.getElementById("cover-reason-wrap"); if (w) w.hidden = !sel.value; });
    const form = row.querySelector("form.row-form");
    if (form) form.addEventListener("submit", async (ev) => {
      ev.preventDefault();
      const mode = form.dataset.mode, v = readRow(form), e = {};
      if (mode === "edit") {
        if (v.name.length < 2) e.name = T("adm.sf_e_name");
        if (!v.employeeId) e.employeeId = T("adm.sf_e_id");
        if (!v.phone) e.phone = T("adm.sf_e_phone");
      } else if (mode === "leave") {
        if (!v.until) e.until = T("adm.sf_e_date");
        if (v.coverEmail && v.reason.length < 5) e.reason = T("adm.sf_e_reason");
      } else if (mode === "left") {
        if (!v.lastDay) e.lastDay = T("adm.sf_e_date");
        if (v.reason.length < 10) e.reason = T("adm.sf_e_reason");
      } else if (mode === "email") {
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.newEmail)) e.newEmail = T("adm.st_err_email");
        else if (v.newEmail.toLowerCase() === email) e.newEmail = T("adm.sf_e_email_same");
        if (v.reason.length < 10) e.reason = T("adm.sf_e_reason");
      } else if (mode === "back" || mode === "delete") {
        if (v.reason.length < 10) e.reason = T("adm.sf_e_reason");
      }
      rows[email] = { mode, values: v, errors: e, busy: !Object.keys(e).length };
      render();
      if (Object.keys(e).length) { focusFirst(document.querySelector('form.row-form[data-email="' + CSS.escape(email) + '"]')); return; }
      const who = ((data.staff.concat(data.former).filter((x) => x.email === email)[0] || {}).name) || email;
      if (mode === "left" && !confirm(T("adm.sf_left_confirm", { name: who }))) { rows[email].busy = false; render(); return; }
      if (mode === "email" && !confirm(T("adm.sf_email_confirm", { name: who, from: email, to: v.newEmail.toLowerCase() }))) { rows[email].busy = false; render(); return; }
      if (mode === "delete" && !confirm(T("adm.sf_delete_confirm", { name: who }))) { rows[email].busy = false; render(); return; }
      const payload = mode === "edit" ? { action: "edit", email, name: v.name, employeeId: v.employeeId, phone: v.phone, designation: v.designation }
        : mode === "leave" ? { action: "leave", email, until: v.until, pause: v.pause, coverEmail: v.coverEmail, reason: v.reason }
        : mode === "left" ? { action: "left", email, lastDay: v.lastDay, reason: v.reason }
        : mode === "delete" ? { action: "delete", email, reason: v.reason }
        : mode === "email" ? { action: "change_email", email, newEmail: v.newEmail, reason: v.reason } : { action: "reactivate", email, reason: v.reason };
      const r = await api("POST", payload);
      if (!r.ok) { const se = serverErrors(r.body); if (se.email && !se.form) se.form = se.email; rows[email] = { mode, values: v, errors: se, busy: false }; render(); focusFirst(document.querySelector('form.row-form[data-email="' + CSS.escape(email) + '"]')); return; }
      done(mode === "edit" ? (r.body.unchanged ? "adm.sf_unchanged" : "adm.sf_saved_details") : mode === "leave" ? "adm.sf_leave_ok" : mode === "left" ? "adm.sf_left_ok" : mode === "delete" ? "adm.sf_delete_ok" : mode === "email" ? "adm.sf_email_ok" : "adm.sf_back_ok", { name: v.name || who });
    });
  });
}

  if (rf && rows[rf.dataset.email]) rows[rf.dataset.email].values = readRow(rf);
  if (lastStatus) setStatus(lastStatus.key, lastStatus.type, lastStatus.vars);
  render();
});
load();
</script>
